    const nextTargetBase = r.stopped ? (r.baseFrom + 1) : r.baseTo;
    const leadHoldingBag = leadRunner && (leadRunner.stopped || leadRunner.retreating || (leadRunner.isMe && isPlayerOffense() && !holdRun && leadRunner.progress < 0.15));
    const blockedByLead = !!(leadHoldingBag && leadRunner.baseFrom <= nextTargetBase);

    if (r.isMe && isPlayerOffense() && r.targetBase === undefined) {
      r.targetBase = (r.baseFrom === 0 || forcedNow || game.outs === 2) ? (r.baseFrom + 1) : r.baseFrom;
    }

    if (r.stopped) {
      const meWantGo = r.isMe && isPlayerOffense() && r.targetBase > r.baseFrom;
      if (r.baseFrom < 4 && !pl.flyNoThrow && !blockedByLead && (pushedByTrailer || meWantGo || (!r.isMe && !pl.flyCaught && !pl.fielded && !pl.throwActive && !isAirFly))) {
        r.stopped = false;
        r.baseTo = r.baseFrom + 1;
      } else {
        return;
      }
    }

    // 玩家在一、二壘遇外野飛球：未按衝刺前先跑出約 1/3，視線鎖定在球上方便判斷
    if (isAirFly && r.isMe && isPlayerOffense() && !r.isBatter && r.baseFrom >= 1 && state.meta && state.meta.land.z > 42 && !r.manualControl) {
      const movingOut = r.baseFrom < 3 && r.progress < 0.28;
      if (movingOut) r.progress = Math.min(0.28, r.progress + 0.24 * dt);
      const cur = new THREE.Vector3().lerpVectors(BASES[r.baseFrom % 4], BASES[r.baseTo % 4], r.progress);
      cur.y = 1.65 + (movingOut ? Math.sin(now * 0.02) * 0.06 : 0);
      camera.position.copy(cur);
      lookTarget.lerp(ballMesh.position, 0.22);
      camera.lookAt(lookTarget);
      anyMoving = true;
      return;
    }
    if (false) {
      if (holdRun) {
        r.manualControl = true;
        r.leadGrace = 0;
      } else {
        r.leadGrace = 0.45;
        const movingOut = r.progress < 0.33;
        if (movingOut) r.progress = Math.min(0.33, r.progress + 0.26 * dt);
        const cur = new THREE.Vector3().lerpVectors(BASES[r.baseFrom % 4], BASES[r.baseTo % 4], r.progress);
        cur.y = 1.65 + (movingOut ? Math.sin(now * 0.02) * 0.06 : 0);
        camera.position.copy(cur);
        lookTarget.lerp(ballMesh.position, 0.22);
        camera.lookAt(lookTarget);
        anyMoving = true;
        return;
      }
    }

    // 未滿兩出局的空中飛球／平飛球：夠深遠想 Tag-up 的二三壘跑者留在壘包等接殺，其餘先跑出去約 1/3 判斷
    if (isAirFly && !r.isBatter && !r.isMe) {
      const wantTagUp = r.baseFrom >= 2 && pl.la >= 20 && state.meta && state.meta.land.z >= 82;
      const holdFrac = r.baseFrom === 1 ? 0.50 : 0.36;
      if (!wantTagUp && r.progress < holdFrac) {
        r.progress = Math.min(holdFrac, r.progress + r.speed * 0.9 * dt);
        const cur = new THREE.Vector3().lerpVectors(BASES[r.baseFrom % 4], BASES[r.baseTo % 4], r.progress);
        cur.y = Math.abs(Math.sin(now * 0.018)) * 0.14;
        r.mesh.position.copy(cur);
        anyMoving = true;
      }
      return;
    }

    // 接殺後：跑出去 1/3 的會自動回壘；留在壘包的二三壘深遠飛球才會 Tag-up 推進，否則留壘
    if (pl.flyCaught && !r.isMe && !r.leftEarly && !pushedByTrailer && !r.retreating) {
      if (r.baseFrom < 2 || state.ballPos.z < 82 || pl.la < 20) { r.stopped = true; return; }
    }

    // 落地後保留短暫反應時間，讓玩家看到球落地再按衝刺，不會瞬間往回拉
    if (r.isMe && isPlayerOffense() && r.leadGrace > 0) {
      if (holdRun || forcedNow || pl.flyCaught) {
        if (holdRun) r.manualControl = true;
        r.leadGrace = 0;
      } else {
        r.leadGrace = Math.max(0, r.leadGrace - dt);
      }
    }

    // 球落地安打（或滾穿到外野）時，原本壘包往前推進這一個壘包直接衝；繞過該壘包想拚下一壘時，反方向長傳改看 1/3，其餘看 1/2
    const commitFirstBase = !r.isMe && r.baseFrom === r.startBase && pl.landed && !pl.flyCaught && (pl.la > 8 || state.ballPos.z > 40);
    let retreatThreshold = 0.5;
    if (pl.landed && !pl.flyCaught && state.ballPos.z > 42 && r.baseTo >= 2 && r.baseTo <= 4) {
      const fromP = BASES[r.baseFrom % 4];
      const toP = BASES[r.baseTo % 4];
      const runX = toP.x - fromP.x, runZ = toP.z - fromP.z;
      const ballX = state.ballPos.x - fromP.x, ballZ = state.ballPos.z - fromP.z;
      const dot = (runX * ballX + runZ * ballZ) / ((Math.hypot(runX, runZ) || 1) * (Math.hypot(ballX, ballZ) || 1));
      const throwDist = Math.hypot(state.ballPos.x - toP.x, state.ballPos.z - toP.z);
      if (dot < -0.45 && throwDist > 55) retreatThreshold = 1 / 3;
    }
    if (!pl.isHR && r.baseFrom >= 1 && !r.retreating && !forcedNow && !pushedByTrailer) {
      if (r.isMe && isPlayerOffense()) {
        if (r.targetBase <= r.baseFrom && r.progress > 0.03) r.retreating = true;
      } else if (!pl.flyCaught) {
        if (blockedByLead) {
          r.retreating = true;
        } else if (!commitFirstBase && (pl.fielded || pl.throwActive) && r.progress < retreatThreshold) {
          r.retreating = true;
        }
      }
    }

    if (r.retreating) {
      if ((pushedByTrailer && !blockedByLead && !r.leftEarly) || (r.isMe && isPlayerOffense() && r.targetBase > r.baseFrom && !r.leftEarly)) {
        r.retreating = false;
      } else {
        r.progress -= r.speed * 1.25 * dt;
        const cur = new THREE.Vector3().lerpVectors(BASES[r.baseFrom % 4], BASES[r.baseTo % 4], Math.max(0, r.progress));
        if (r.isMe && isPlayerOffense()) {
          cur.y = 1.65;
          camera.position.copy(cur);
          const backLook = BASES[r.baseFrom % 4].clone().setY(1.2).lerp(ballMesh.position, 0.35);
          lookTarget.lerp(backLook, 0.2);
          camera.lookAt(lookTarget);
        } else {
          cur.y = Math.abs(Math.sin(now * 0.02)) * 0.14;
          r.mesh.position.copy(cur);
        }
        anyMoving = true;
        if (r.progress <= 0) {
          if (r.leftEarly && r.baseFrom > r.startBase) {
            r.baseTo = r.baseFrom;
            r.baseFrom -= 1;
            r.progress = 1;
          } else {
            r.progress = 0; r.retreating = false; r.leftEarly = false; r.baseTo = r.baseFrom; r.stopped = true;
            if (!r.isMe) r.mesh.position.copy(BASES[r.baseFrom]);
          }
        }
        return;
      }
    }

    // 避免後位跑者超車前位跑者
    let speedScale = 1.0;
    if (leadRunner) {
      const myTotal = r.baseFrom + r.progress;
      const leadTotal = leadRunner.baseFrom + leadRunner.progress;
      if (leadTotal - myTotal < 0.25) speedScale = 0.0;
    }

    if (r.isMe && isPlayerOffense()) {
      const wantFwd = r.baseFrom === 0 || forcedNow || r.targetBase > r.baseFrom;
      const spd = (pl.isHR
        ? (holdRun ? 0.36 : 0.22)
        : (wantFwd ? (holdRun ? 0.36 : 0.30) : 0.0)) * speedScale;
      r.progress += spd * dt;
      const cur = new THREE.Vector3().lerpVectors(BASES[r.baseFrom % 4], BASES[r.baseTo % 4], Math.min(1, r.progress));
      cur.y = 1.65 + (spd > 0 ? Math.sin(now * 0.022) * 0.08 : 0);
      camera.position.copy(cur);
      const baseLook = BASES[r.baseTo % 4].clone().setY(1.3);
      const runDir = baseLook.clone().sub(cur).normalize();
      const ballDir = ballMesh.position.clone().sub(cur).normalize();
      const gaze = (pl.isHR && pl.hrTimer <= 0)
        ? baseLook
        : ((spd === 0 && r.leadGrace > 0)
          ? ballMesh.position
          : (runDir.dot(ballDir) > -0.25 ? baseLook.clone().lerp(ballMesh.position, 0.55) : baseLook));
      lookTarget.lerp(gaze, 0.16);
      camera.lookAt(lookTarget);
      if (spd > 0 || r.leadGrace > 0) anyMoving = true;
    } else {
      const aiSpd = pl.isHR
        ? Math.max(r.speed, 0.28) * (state.speed === 2 && !liveRunners.some(x => x.isMe && isPlayerOffense()) ? 1.6 : 1.0)
        : r.speed;
      r.progress += aiSpd * speedScale * dt;
      const cur = new THREE.Vector3().lerpVectors(BASES[r.baseFrom % 4], BASES[r.baseTo % 4], Math.min(1, r.progress));
      cur.y = Math.abs(Math.sin(now * 0.018)) * 0.14;
      r.mesh.position.copy(cur);
      anyMoving = true;
    }

    if (r.progress >= 1) {
      r.baseFrom = r.baseTo;
      r.isForced = false;
      r.progress = 0;
      if (r.baseFrom >= 4) {
        r.scored = true; r.mesh.visible = false;
        if (r.isMe && isPlayerOffense()) updateRunPadUI();
        if (pl.landed || pl.isHR || (pl.flyCaught && game.outs + 1 < 3)) {
          addRuns(1);
          pl.runsAdded = (pl.runsAdded || 0) + 1;
          if (pl.isMeBatting) { game.stats.rbi++; pl.rbiAdded = (pl.rbiAdded || 0) + 1; }
          AudioFX.tone(660, 0.15);
          updateGameUI();
        } else {
          r.pendingScore = true;
        }
      } else {
        const ballLive = !pl.fielded && !pl.throwActive;
        const canStretch = pl.isHR || (r.isMe ? (r.targetBase > r.baseFrom) : (!pl.flyCaught && (pushedByTrailer || (ballLive && r.baseFrom < 4))));
        if (canStretch) r.baseTo = r.baseFrom + 1;
        else { r.stopped = true; r.mesh.position.copy(BASES[r.baseFrom]); }
      }
    }
  });

  if (pl.landed || pl.isHR) {
    let flushed = false;
    liveRunners.forEach(r => {
      if (r.pendingScore) {
        r.pendingScore = false;
        addRuns(1);
        pl.runsAdded = (pl.runsAdded || 0) + 1;
        if (pl.isMeBatting) { game.stats.rbi++; pl.rbiAdded = (pl.rbiAdded || 0) + 1; }
        flushed = true;
      }
    });
    if (flushed) { AudioFX.tone(660, 0.15); updateGameUI(); }
  }
  if (pl.isHR) {
    const meStillRunning = liveRunners.some(r => r.isMe && isPlayerOffense() && !r.scored && !r.out);
    if (!meStillRunning) {
      let watchPos = ballMesh.position;
      if (pl.hrTimer <= 0) {
        const lastR = liveRunners.slice().reverse().find(r => !r.out && !r.scored);
        watchPos = lastR ? lastR.mesh.position.clone().setY(1.4) : new THREE.Vector3(0, 1.2, 0);
      }
      lookTarget.lerp(watchPos, 0.16);
      camera.lookAt(lookTarget);
    }
    if (liveRunners.every(r => r.out || r.scored) || pl.elapsed > 40) {
      finishLivePlayHR();
    }
    return;
  }
  if (isPlayerDefense() && (player.hasBall || pl.pendingFromPlayer)) {
    let aim = new THREE.Vector3(0, 1.4, 22);
    if (pl.pendingFromPlayer && pl.pendingThrowTargetPos) {
      aim.copy(pl.pendingThrowTargetPos);
    } else if (pl.playerCoverBase && game.playerPos !== '1B') {
      const b = BASES[pl.playerCoverBase % 4];
      aim.set(b.x, 1.1, b.z);
    } else if (POS_MAP[game.playerPos].isIF) {
      const tb = getBestThrowTargetBase(true);
      if (game.playerPos === '1B' && tb === 1) {
        aim.set(0, 1.35, 18.44);
      } else {
        const tPos = BASES[tb % 4];
        if (Math.hypot(player.pos.x - tPos.x, player.pos.z - tPos.z) > 3.5) aim.set(tPos.x, 1.3, tPos.z);
        else if (Math.hypot(player.pos.x - BASES[1].x, player.pos.z - BASES[1].z) > 3.5) aim.set(BASES[1].x, 1.3, BASES[1].z);
        else aim.set(0, 1.3, 18.44);
      }
    }
    lookTarget.lerp(aim, 0.16);
    camera.lookAt(lookTarget);
  } else if (isPlayerDefense() || !(isPlayerOffense() && (game.playerBase > 0 || pl.isMeBatting))) {
    lookTarget.lerp(ballMesh.position, 0.2);
    camera.lookAt(lookTarget);
  }
  const totalOutsNow = game.outs + liveRunners.filter(r => r.out).length;
  if (pl.elapsed > 18) {
    finalizeLivePlay(pl.lastGotOut, pl.lastOutBase || 1);
  } else if (pl.fielded && !pl.throwActive && pl.throwDelay <= 0 && !(pl.tagDelay > 0) && !pl.selfCoverBase && !pl.playerCoverBase) {
    if (totalOutsNow >= 3) {
      finalizeLivePlay(pl.lastGotOut, pl.lastOutBase || 1);
    } else if (!anyMoving) {
      if (!pl.waitingEnd) {
        pl.waitingEnd = true;
        pl.endCooldown = 1.5;
      } else {
        pl.endCooldown -= dt;
        if (pl.endCooldown <= 0) finalizeLivePlay(pl.lastGotOut, pl.lastOutBase || 1);
      }
    }
  }
}

function handleFlyOut(fielderId, isPlayerCF) {
  const pl = game.play;
  pl.fielded = true;
  pl.flyCaught = true;
  pl.fielderId = fielderId;
  pl.fielderRef = !isPlayerCF ? getFielderById(fielderId) : null;
  if (pl.fielderRef) {
    ballMesh.position.set(pl.fielderRef.pos.x, 1.35, pl.fielderRef.pos.z);
    ballShadow.position.set(pl.fielderRef.pos.x, 0.07, pl.fielderRef.pos.z);
  }
  AudioFX.glovePop();
  if (isPlayerCF) { AudioFX.cheer(); game.stats.po++; }
  landingRing.visible = false;
  updateDiveBtnState();

  const batter = liveRunners.find(r => r.isBatter);
  if (batter) { batter.out = true; batter.mesh.visible = false; }

  const onBase = liveRunners.filter(r => !r.isBatter && !r.out);
  // 已經三出局就直接結束
  if (game.outs + 1 >= 3) {
    pl.resolved = true;
    btnRun.style.display = 'none';
    setBanner(isPlayerCF && player.diving ? '美技撲接！' : '接殺出局！', '');
    if (!addOut(`${fielderId} 飛球接殺出局！`)) { nextBatter(); enterAfterPause(1.4); }
    updateGameUI();
    return;
  }

  const meRunning = isPlayerOffense() && game.playerBase > 0;
  let tagTarget = 0;
  let doubleOffTarget = 0;
  let hasPassedBase = false;
  onBase.forEach(r => {
    const origBase = r.startBase !== undefined ? r.startBase : r.baseFrom;
    const passedBase = r.scored || r.baseFrom > origBase;
    if (passedBase || (r.isMe && r.progress > 0.08)) {
      if (r.scored) {
        r.scored = false;
        r.pendingScore = false;
        if (!r.isMe) r.mesh.visible = true;
        r.baseFrom = 3;
        r.baseTo = 4;
        r.progress = 0.99;
      } else if (r.baseFrom > origBase && r.progress <= 0.01) {
        r.baseTo = r.baseFrom;
        r.baseFrom = r.baseTo - 1;
        r.progress = 0.99;
      }
      r.stopped = false;
      r.leftEarly = true;
      r.retreating = true;
      if (passedBase) {
        hasPassedBase = true;
        doubleOffTarget = Math.max(doubleOffTarget, origBase);
      } else if (r.manualControl && r.progress > 0.25) {
        doubleOffTarget = Math.max(doubleOffTarget, origBase);
      }
    } else if (!r.isMe && r.progress > 0.02) {
      r.retreating = true;
    } else if (r.baseFrom >= 2 && state.ballPos.z >= 82 && pl.la >= 20) {
      tagTarget = Math.max(tagTarget, r.baseTo);
    } else if (r.isMe && r.baseFrom >= 2) {
      tagTarget = Math.max(tagTarget, r.baseTo);
    }
  });
  const targetBase = hasPassedBase ? doubleOffTarget : (tagTarget > 0 ? tagTarget : doubleOffTarget);

  if (isPlayerCF) {
    player.hasBall = true;
    pl.waitingEnd = true;
    pl.endCooldown = 1.5;
    setBanner(player.diving ? '美技撲接！' : '接殺出局！', '');
    setTicker(`${fielderId} 接殺出局！`);
    updateDiveBtnState();
    updateGameUI();
    return;
  }

  if (targetBase === 0) {
    btnRun.style.display = 'none';
    pl.flyNoThrow = true;
    pl.waitingEnd = true;
    pl.endCooldown = 1.5;
    onBase.forEach(r => { if (!r.retreating) r.stopped = true; });
    setBanner('接殺出局！', '');
    setTicker(`${fielderId} 接殺出局！`);
    updateGameUI();
    return;
  }

  const f = getFielderById(fielderId);
  const cover = getBaseCoverFielder(targetBase, fielderId);
  pl.fielderRef = f;
  pl.throwDelay = 0.38;
  pl.relayActive = false;
  pl.throwTargetFielder = cover;
  pl.pendingThrowTargetPos = cover ? cover.pos.clone().setY(1.35) : BASES[targetBase % 4].clone().setY(1.2);
  pl.pendingThrowTargetBase = targetBase;
  setBanner('接殺出局！', meRunning ? '可按住衝刺拚推進，提早離壘快回壘！' : '');
  setTicker(`${fielderId} 接殺，回傳${['本', '一', '二', '三', '本'][targetBase]}壘！`);
  updateGameUI();
}
function handleAIFieldGroundBall(f) {
  const pl = game.play;
  pl.fielded = true;
  pl.fielderId = f.id;
  pl.fielderRef = f;
  AudioFX.glovePop();

  const isInfield = f.type === 'IF';
  if (isInfield) {
    const batterRunning1B = liveRunners.some(r => r.isBatter && !r.out && !r.scored && r.baseTo === 1 && !r.stopped);
    let targetBase = 0;
    let isDPAttempt = false;

    if (pl.tag === '軟弱滾地') {
      if (game.outs < 2) {
        const leadForced = liveRunners.find(r =>
          !r.isBatter && !r.out && !r.scored && !r.stopped && !r.retreating &&
          r.isForced && r.progress < 0.75 && getBaseCoverFielder(r.baseTo, f.id)
        );
        if (leadForced) targetBase = leadForced.baseTo;
      }
      if (targetBase === 0 && batterRunning1B) targetBase = 1;
    } else {
      const forceAt2B = game.outs < 2 && liveRunners.some(r => !r.out && !r.scored && r.isForced && r.baseTo === 2);
      if (forceAt2B && batterRunning1B) {
        targetBase = 2;
        isDPAttempt = true;
      } else if (batterRunning1B) {
        targetBase = 1;
      }
    }

    if (targetBase === 0) {
      // 打者已經踩過一壘（例如沖天炮落地），改抓還在往前衝的領先跑者
      let leadAdv = 0;
      liveRunners.forEach(r => {
        if (!r.out && !r.scored && !r.stopped && !r.retreating && (r.isForced || r.progress > 0.12) && r.baseTo > leadAdv) {
          leadAdv = r.baseTo;
        }
      });
      targetBase = leadAdv;
    }

    if (targetBase === 0) {
      pl.throwDelay = 0;
      pl.waitingEnd = true;
      pl.endCooldown = 1.5;
      setTicker(`${f.id} 持球牽制`);
      return;
    }

    // 一壘或二壘方向滾地球要抓二壘時，若玩家游擊手還沒補位就改傳一壘
    if (targetBase === 2 && f.id === '1B' && isPlayerDefense() && game.playerPos === 'SS') {
      const ssDist2B = Math.hypot(player.pos.x - BASES[2].x, player.pos.z - BASES[2].z);
      if (ssDist2B > 7.5) {
        targetBase = 1;
        isDPAttempt = false;
      }
    }
    if (f.id === '1B' && targetBase === 1 && pl.tag !== '軟弱滾地') {
      pl.throwDelay = 0;
      pl.selfCoverBase = 1;
      setTicker('1B 接球自踩一壘');
    } else {
      const cover = getBaseCoverFielder(targetBase, f.id);
      if (!cover) {
        pl.throwDelay = 0;
        pl.waitingEnd = true;
        pl.endCooldown = 1.5;
        setTicker(`${f.id} 持球牽制`);
        return;
      }
      pl.throwDelay = 0.38;
      if (isDPAttempt && targetBase === 2) pl.dpSecondThrow = true;
      pl.relayActive = false;
      pl.throwTargetFielder = cover;
      pl.pendingThrowTargetPos = cover.pos.clone().setY(1.35);
      pl.pendingThrowTargetBase = targetBase;
      setTicker(`${f.id} 傳${['本', '一', '二', '三', '本'][targetBase]}壘！`);
    }
  } else {
    pl.throwDelay = 0.62;
    const targetBase = getBestThrowTargetBase(false);
    const bName = ['本', '一', '二', '三', '本'][targetBase];
    const prog = getRunnerProgressTo(targetBase);
    const movingTarget = hasRunnerMovingTo(targetBase);
    const canDirectThrow = movingTarget && prog >= 0.25 && f.pos.z <= 84;
    const wantRelayOut = movingTarget;
    const cover = canDirectThrow ? getBaseCoverFielder(targetBase, f.id) : null;
    if (!canDirectThrow || !cover) {
      const cutoff = getCutoffFielder(f.pos);
      pl.relayActive = true;
      pl.cutoffFielder = cutoff;
      pl.relayFinalBase = targetBase;
      pl.pendingThrowTargetPos = cutoff.pos.clone().setY(1.4);
      pl.pendingThrowTargetBase = -1;
      setTicker(wantRelayOut ? `${f.id} 傳給 ${cutoff.id} 轉傳${bName}壘` : `${f.id} 回傳 ${cutoff.id}`);
    } else {
      pl.relayActive = false;
      pl.throwTargetFielder = cover;
      pl.pendingThrowTargetPos = cover.pos.clone().setY(1.35);
      pl.pendingThrowTargetBase = targetBase;
      setTicker(`${f.id} 直傳${bName}壘！`);
    }
  }
}

function resolveThrowArrival() {
  const pl = game.play;
  pl.throwActive = false;

  if (pl.relayActive) {
    pl.relayActive = false;
    const tb = getBestThrowTargetBase(false);
    if (pl.cutoffFielder.isPlayer) {
      pl.isRelayThrow = true;
      pl.fielderRef = null;
      player.hasBall = true;
      pl.waitingEnd = true;
      pl.endCooldown = 1.5;
      const bName = ['本', '一', '二', '三', '本'][tb];
      setBanner('接到轉傳球！', hasRunnerMovingTo(tb) ? `傳${bName}壘！` : '');
      updateDiveBtnState();
      return;
    }
    if (!hasRunnerMovingTo(tb)) {
      pl.fielderRef = pl.cutoffFielder;
      setTicker(`${pl.cutoffFielder.id} 接到回傳球`);
      pl.waitingEnd = true;
      pl.endCooldown = 1.5;
      return;
    }
    const bName = ['本', '一', '二', '三', '本'][tb];
    const cover = getBaseCoverFielder(tb, pl.cutoffFielder.id);
    if (!cover) {
      pl.fielderRef = pl.cutoffFielder;
      setTicker(`${pl.cutoffFielder.id} 持球牽制`);
      pl.waitingEnd = true;
      pl.endCooldown = 1.5;
      return;
    }
    pl.fielderRef = pl.cutoffFielder;
    pl.throwDelay = 0.32;
    pl.throwTargetFielder = cover;
    pl.pendingThrowTargetPos = cover.pos.clone().setY(1.35);
    pl.pendingThrowTargetBase = tb;
    setTicker(`${pl.cutoffFielder.id} 轉傳${bName}壘！`);
    return;
  }

  const tb = pl.throwTargetBase;
  const cover = pl.throwTargetFielder;
  pl.throwTargetFielder = null;
  pl.fielderRef = (cover && !cover.isPlayer) ? cover : null;

  if (cover && cover.isPlayer && !cover.steppedBag) {
    const distToBag = Math.hypot(player.pos.x - BASES[tb % 4].x, player.pos.z - BASES[tb % 4].z);
    if (distToBag > 1.5) {
      player.hasBall = true;
      pl.playerCoverBase = tb;
      const bName = ['本', '一', '二', '三', '本'][tb];
      setBanner('接到傳球！', `快跑去踩${bName}壘包抓出局！`);
      updateDiveBtnState();
      return;
    }
  } else if (cover && !cover.isCatcher && !cover.isPlayer && tb >= 1 && tb <= 3) {
    const distToBag = Math.hypot(cover.pos.x - BASES[tb % 4].x, cover.pos.z - BASES[tb % 4].z);
    if (distToBag > 1.2) {
      pl.fielderRef = cover;
      pl.selfCoverBase = tb;
      const bName = ['本', '一', '二', '三', '本'][tb];
      setTicker(`${cover.id} 接到傳球，快步踩向${bName}壘包！`);
      return;
    }
  }

  let gotOut = false;
  let gotForceOut = false;
  liveRunners.forEach(r => {
    if (r.out || r.scored) return;
    const isForcePlay = r.isForced && !pl.flyCaught;
    const minProg = isForcePlay ? 0.05 : 0.5;
    const origBase = r.startBase !== undefined ? r.startBase : r.baseFrom;
    const caughtAdvancing = r.baseTo === tb && r.progress > minProg && r.progress < 0.99 && (!r.retreating || r.progress > 0.55);
    const caughtOffBase = (r.leftEarly && origBase === tb && (r.baseFrom > origBase || r.progress > 0.05))
      || (r.retreating && r.baseFrom === tb && r.progress > 0.08);
    if (caughtAdvancing || caughtOffBase) {
      r.out = true;
      r.mesh.visible = false;
      gotOut = true;
      if (isForcePlay || (r.isBatter && tb === 1)) gotForceOut = true;
    } else if (!r.retreating && r.baseTo === tb && r.progress <= minProg) {
      r.retreating = true;
    }
  });

  if (gotOut) {
    pl.lastGotOut = true;
    pl.lastOutBase = tb;
    pl.lastOutWasForce = gotForceOut;
  }

  const totalOutsNow = game.outs + liveRunners.filter(r => r.out).length;
  if (totalOutsNow >= 3) {
    finalizeLivePlay(pl.lastGotOut, pl.lastOutBase || tb);
    return;
  }

  if (cover && cover.isPlayer) {
    pl.dpSecondThrow = false;
    pl.dpCoverDone = true;
    player.hasBall = true;
    pl.waitingEnd = true;
    pl.endCooldown = 1.5;
    const bName = ['本', '一', '二', '三', '本'][tb];
    setBanner(gotOut ? `${bName}壘封殺！` : '接到傳球！', '');
    updateDiveBtnState();
    return;
  }

  if (pl.dpSecondThrow && tb === 2 && gotOut) {
    pl.dpSecondThrow = false;
    const cover2B = (cover && !cover.isPlayer) ? cover : getFielderById((pl.fielderId === 'SS' || pl.fielderId === '3B') ? '2B' : 'SS');
    const cover1B = getBaseCoverFielder(1, cover2B.id);
    if (cover1B) {
      pl.fielderRef = cover2B;
      pl.throwDelay = 0.28;
      pl.throwTargetFielder = cover1B;
      pl.pendingThrowTargetPos = cover1B.pos.clone().setY(1.35);
      pl.pendingThrowTargetBase = 1;
      setTicker('二壘封殺！轉傳一壘拚雙殺！');
      return;
    }
  }

  const advancing = liveRunners.filter(r => !r.out && !r.scored && !r.stopped && !r.retreating && r.progress > 0.1 && r.baseTo !== tb);
  const scramblingBack = liveRunners.filter(r => {
    if (r.out || r.scored || r.stopped || !r.retreating) return false;
    const backBase = r.leftEarly ? (r.startBase !== undefined ? r.startBase : r.baseFrom) : r.baseFrom;
    return backBase >= 1 && backBase !== tb && (r.baseFrom > backBase || r.progress > 0.25);
  });
  const nextTargetRunner = advancing[0] || scramblingBack[0];
  if (nextTargetRunner && (pl.extraThrows || 0) < 2) {
    const nextTb = nextTargetRunner.retreating
      ? (nextTargetRunner.leftEarly ? (nextTargetRunner.startBase !== undefined ? nextTargetRunner.startBase : nextTargetRunner.baseFrom) : nextTargetRunner.baseFrom)
      : nextTargetRunner.baseTo;
    const nextCover = getBaseCoverFielder(nextTb, '');
    if (nextCover) {
      pl.extraThrows = (pl.extraThrows || 0) + 1;
      const fromName = ['本', '一', '二', '三', '本'][tb];
      const toName = ['本', '一', '二', '三', '本'][nextTb];
      pl.fielderRef = { pos: BASES[tb % 4] };
      pl.throwDelay = 0.32;
      pl.throwTargetFielder = nextCover;
      pl.pendingThrowTargetPos = nextCover.pos.clone().setY(1.35);
      pl.pendingThrowTargetBase = nextTb;
      setTicker(`${fromName}壘轉傳${toName}壘！`);
      return;
    }
  }

  if (gotOut) {
    const bName = ['本', '一', '二', '三', '本'][tb];
    setTicker(`${bName}壘出局！`);
  }
  pl.waitingEnd = true;
  pl.endCooldown = 1.5;
}

function finishLivePlayHR() {
  const pl = game.play;
  if (!pl || pl.resolved) return;
  pl.resolved = true;
  btnRun.style.display = 'none';
  liveRunners.forEach(r => {
    if (!r.out && (!r.scored || r.pendingScore)) {
      r.scored = true;
      r.pendingScore = false;
      addRuns(1);
      if (pl.isMeBatting) game.stats.rbi++;
    }
  });
  game.bases = [false, false, false];
  game.playerBase = 0;
  if (pl.isMeBatting) { game.stats.h++; game.stats.hr++; }
  nextBatter();
  enterAfterPause(1.4);
  updateGameUI();
}

function finalizeLivePlay(gotOut = false, outBase = 1) {
  const pl = game.play;
  if (!pl || pl.resolved) return;
  pl.resolved = true;
  btnRun.style.display = 'none';
  landingRing.visible = false;

  const outsCount = liveRunners.filter(r => r.out).length;
  const thirdOutNoRun = (game.outs + outsCount >= 3) && ((pl.flyCaught && outsCount === 1) || pl.lastOutWasForce);
  if (thirdOutNoRun && pl.runsAdded > 0) {
    if (game.half === 'top') game.awayScore = Math.max(0, game.awayScore - pl.runsAdded);
    else game.homeScore = Math.max(0, game.homeScore - pl.runsAdded);
    if (pl.isMeBatting) game.stats.rbi = Math.max(0, game.stats.rbi - (pl.rbiAdded || 0));
    pl.runsAdded = 0;
    pl.rbiAdded = 0;
  }
  const batter = liveRunners.find(r => r.isBatter);
  const nextB = [false, false, false];
  let nextMe = 0;

  liveRunners.forEach(r => {
    if (!r.out && !r.scored) {
      let b = (!r.retreating && r.progress > 0.65) ? r.baseTo : r.baseFrom;
      while (b >= 1 && b <= 3 && nextB[b - 1]) b--;
      if (b >= 4) {
        if (!thirdOutNoRun) {
          addRuns(1);
          if (pl.isMeBatting) game.stats.rbi++;
        }
      } else if (b >= 1 && b <= 3) {
        nextB[b - 1] = true;
        if (r.isMe) nextMe = b;
      }
    }
  });

  game.bases = nextB;
  if (isPlayerOffense()) game.playerBase = nextMe;
  if (pl.isMeBatting && batter && !batter.out) game.stats.h++;

  if (outsCount >= 2) {
    setBanner('DOUBLE PLAY!', '');
    if (!addOuts(2, '雙殺！')) { nextBatter(); enterAfterPause(1.5); }
  } else if (outsCount === 1) {
    if (pl.flyCaught) {
      setBanner('接殺出局！', '');
      if (!addOut('接殺出局！')) { nextBatter(); enterAfterPause(1.4); }
    } else {
      const bName = ['本', '一', '二', '三', '本'][outBase];
      setBanner('OUT!', `${bName}壘出局`); if (!addOut(`${bName}壘出局！`)) { nextBatter(); enterAfterPause(1.4); }
    }
  } else if (pl.errorCounted) {
    setBanner('ERROR! 失誤上壘', '守備相撞漏接，記失誤（E）');
    setTicker('記守備失誤（E）！打者安全上壘');
    nextBatter();
    enterAfterPause(1.5);
  } else {
    const bDest = batter ? (batter.scored ? 4 : ((!batter.retreating && batter.progress > 0.65) ? batter.baseTo : batter.baseFrom)) : 1;
    const prefix = pl.tag === '車布邊' ? '車布邊' : '';
    const hitName = bDest >= 4 ? '場內全壘打！' : (bDest === 3 ? `${prefix}三壘安打！` : (bDest === 2 ? `${prefix}二壘安打！` : `${prefix}一壘安打！`));
    setBanner(hitName, '');
    setTicker(`安全上壘！${hitName}`);
    nextBatter();
    enterAfterPause(1.4);
  }
  updateGameUI();
}

function launchPlayerAtBatPitch() {
  game.subPhase = 'BAT_PITCH';
  game.pitchSwung = false;
  state.pitchT = 0;
  const picked = pickPitchType();
  game.pitchType = picked.pt;
  game.pitchKmh = picked.kmh;
  game.pitchDur = picked.pt.dur + (Math.random() * 0.04 - 0.02);

  const isStrike = Math.random() < 0.54;
  game.pitchIsStrike = isStrike;
  if (isStrike) {
    game.pitchTarget.set((Math.random() - 0.5) * 0.44, 0.62 + Math.random() * 0.56, 0.22);
  } else {
    const side = Math.random() < 0.5 ? (Math.random() > 0.5 ? 0.48 : -0.48) : (Math.random() - 0.5) * 0.6;
    const high = Math.abs(side) < 0.35 ? (Math.random() > 0.5 ? 1.52 : 0.32) : (0.5 + Math.random() * 0.8);
    game.pitchTarget.set(side, high, 0.22);
  }
  ballMesh.visible = true;
  ballMesh.position.set(0, 1.85, 18.44);
}

function swingBat() {
  if (game.subPhase !== 'BAT_PITCH' || game.pitchSwung) return;
  game.pitchSwung = true;
  const z = ballMesh.position.z;
  const err = Math.abs(z - 0.9);
  const zonePenalty = game.pitchIsStrike ? 0 : 0.72;
  const pInfo = `${game.pitchType.name} ${game.pitchKmh}km/h｜`;

  if (err + zonePenalty < 1.38) {
    const quality = 1 - (err + zonePenalty) / 1.38;
    const ev = 34 + quality * 16.5;
    const la = 2 + Math.random() * 29 + quality * 5;
    const spray = (z - 0.9) * 14 + (Math.random() * 18 - 9);
    strikeZoneMesh.visible = false;
    btnSwing.style.display = 'none';

    if (Math.abs(spray) > 45) {
      if (la < 10) {
        AudioFX.crack(0.65);
        if (game.strikes < 2) game.strikes++;
        setTicker(`${pInfo}滾地界外（${game.balls}壞${game.strikes}好）`);
        launchVisualBall(ev * 0.8, la, spray, 0.5);
        game.subPhase = 'WATCH_FOUL';
        game.timer = 1.3;
      } else {
        launchFoulFly(pInfo);
      }
    } else {
      game.stats.ab++;
      const tag = (Math.abs(spray) > 40 && la < 10) ? '車布邊' : '';
      startLiveBallInPlay(ev, la, spray, 1.0, true, tag);
    }
    updateGameUI();
  } else if (err < 2.6) {
    launchFoulFly(pInfo);
    updateGameUI();
  } else {
    AudioFX.tone(180, 0.12);
    game.strikes++;
    if (game.strikes >= 3) {
      game.stats.ab++;
      if (!addOut(`${pInfo}揮棒落空！三振出局！`)) { nextBatter(); enterAfterPause(1.2); }
    } else {
      setTicker(`${pInfo}揮棒落空（${game.balls}壞${game.strikes}好）`);
      enterAfterPause(1.0);
    }
    updateGameUI();
  }
}

function attemptSteal() {
  if (game.subPhase !== 'OFF_SIM_WAIT' && game.subPhase !== 'OFF_SIM_PITCH') return;
  if (game.playerBase <= 0 || game.playerBase >= 3 || game.bases[game.playerBase]) return;
  if (game.steal) return;

  if (game.subPhase === 'OFF_SIM_WAIT') {
    if (game.playerBase === 1 && Math.random() < 0.72) {
      startPickoff(true);
      return;
    }
    startStealRun(game.playerBase, true);
    launchSimPitch(false);
    return;
  }
  startStealRun(game.playerBase, true);
}

function startStealRun(fromBase, isMe) {
  const color = isPlayerDefense() ? 0xc62828 : 0x1565c0;
  let mesh = null;
  if (!isMe) {
    mesh = createPlayerSilhouette(BASES[fromBase].x, BASES[fromBase].z, color);
  }
  game.steal = {
    fromBase, toBase: fromBase + 1, isMe, mesh,
    prog: fromBase === 1 ? 0.20 : 0.16,
    speed: fromBase === 1 ? (0.49 + Math.random() * 0.10) : (0.51 + Math.random() * 0.10),
    stage: 'PITCHING',
    throwFrom: null, throwTo: null, throwT: 0, throwDur: fromBase === 1 ? 0.50 : 0.38, popTimer: 0,
    tagTimer: 0
  };
  syncStaticRunners();
  if (isMe) {
    runPad.style.display = 'none';
    setTicker(`⚡ 啟動盜壘！衝向${['', '', '二', '三'][fromBase + 1]}壘！`);
  } else if (isPlayerFielding() && game.playerPos === 'SS' && fromBase === 1) {
    setBanner('⚠️ 跑者起跑了！', '快按 二（或 2）進二壘補位接阻殺球！');
    setTicker('📣 1B 喊聲：跑者起跑了！游擊快進二壘補位！');
    updateDiveBtnState();
  } else {
    setTicker(`⚡ 對手發動盜壘！衝向${['', '', '二', '三'][fromBase + 1]}壘！`);
  }
  AudioFX.tone(540, 0.1);
}

function startPickoff(jumpedEarly = false) {
  const isMeRunner = isPlayerOffense() && game.playerBase === 1;
  const isMe1B = isPlayerFielding() && game.playerPos === '1B';
  const color = isPlayerDefense() ? 0xc62828 : 0x1565c0;
  const rMesh = isMeRunner ? null : createPlayerSilhouette(BASES[1].x, BASES[1].z, color);
  const f1B = getFielderById('1B');
  const target1B = isMe1B ? player.pos.clone().setY(1.35) : (f1B ? f1B.pos.clone().setY(1.35) : BASES[1].clone().setY(1.35));

  game.pickoff = {
    stage: 'TO_1B',
    t: 0, dur: 0.42,
    throwFrom: new THREE.Vector3(0, 1.7, 18.44),
    throwTo: target1B,
    runnerProg: jumpedEarly ? 0.26 : 0.20,
    runnerState: jumpedEarly ? 'BREAK' : (isMeRunner ? 'LEAD' : (Math.random() < 0.08 && !game.bases[1] ? 'BREAK' : 'BACK')),
    runnerMesh: rMesh,
    isMeRunner, isMe1B,
    tagTimer: 0, holdTimer: 0
  };
  game.subPhase = 'PICKOFF';
  syncStaticRunners();
  ballMesh.visible = true;
  ballShadow.visible = true;
  AudioFX.tone(480, 0.1);

  if (isMeRunner) {
    updateRunPadUI();
    document.getElementById('run-ret-1').classList.add('alert');
    setBanner('⚠️ 投手牽制！', jumpedEarly ? '太早起跑被抓包！快按 ↘ 回一壘！' : '快按 ↘ 回一壘！');
    setTicker('⚠️ 投手轉身牽制一壘！');
  } else if (isMe1B) {
    setBanner('牽制球！', '準備接球！');
    setTicker('投手轉身牽制一壘！');
    updateDiveBtnState();
  } else {
    setTicker('投手轉身牽制一壘！');
  }
}

function handlePickoff1BAction(mode) {
  const pk = game.pickoff;
  if (!pk || !pk.isMe1B || pk.stage !== 'HOLD_1B') return;
  if (mode === 2) {
    const cover2B = getBaseCoverFielder(2, 'PLAYER');
    pk.stage = 'TO_2B';
    pk.t = 0;
    pk.dur = 0.56;
    pk.throwFrom = player.pos.clone().setY(1.4);
    pk.throwTo = cover2B ? cover2B.pos.clone().setY(1.35) : BASES[2].clone().setY(1.35);
    setBanner('傳二壘！', '抓觸殺！');
    setTicker('1B(你) 轉傳二壘抓盜壘跑者！');
  } else {
    pk.stage = 'TO_P';
    pk.t = 0;
    pk.dur = 0.45;
    pk.throwFrom = player.pos.clone().setY(1.4);
    pk.throwTo = new THREE.Vector3(0, 1.5, 18.44);
    setBanner('回傳投手', '');
    setTicker('1B(你) 將球回傳給投手');
  }
  updateDiveBtnState();
}

function cleanupPickoff() {
  if (game.pickoff && game.pickoff.runnerMesh) scene.remove(game.pickoff.runnerMesh);
  game.pickoff = null;
  document.getElementById('run-ret-1').classList.remove('alert');
}

function updatePickoff(dt, now) {
  const pk = game.pickoff;
  if (!pk) return;

  if (pk.runnerState === 'BACK') {
    pk.runnerProg = Math.max(0, pk.runnerProg - 0.52 * dt);
  } else if (pk.runnerState === 'BREAK') {
    pk.runnerProg = Math.min(1, pk.runnerProg + 0.33 * dt);
  }
  const rPos = new THREE.Vector3().lerpVectors(BASES[1], BASES[2], pk.runnerProg);
  if (pk.isMeRunner) {
    camera.position.set(rPos.x, 1.65, rPos.z);
    lookTarget.lerp(ballMesh.position, 0.25);
    camera.lookAt(lookTarget);
  } else if (pk.runnerMesh) {
    pk.runnerMesh.position.set(rPos.x, Math.abs(Math.sin(now * 0.02)) * 0.12, rPos.z);
  }

  const f2B = getFielderById('2B'), fSS = getFielderById('SS');
  if (pk.runnerState === 'BREAK' && fSS && fSS.mesh.visible) moveObjToward(fSS.pos, BASES[2], fSS.speed, dt);
  if (pk.runnerState === 'BREAK' && f2B && f2B.mesh.visible) moveObjToward(f2B.pos, BASES[2], f2B.speed, dt);
  if (fSS) fSS.mesh.position.set(fSS.pos.x, 0, fSS.pos.z);
  if (f2B) f2B.mesh.position.set(f2B.pos.x, 0, f2B.pos.z);
  if (pk.isMe1B) {
    updateCFMovement(dt, now);
    lookTarget.lerp(pk.stage === 'HOLD_1B' ? (pk.runnerState === 'BREAK' ? BASES[2].clone().setY(1.2) : new THREE.Vector3(0, 1.4, 18.44)) : ballMesh.position, 0.2);
    camera.lookAt(lookTarget);
  } else if (!pk.isMeRunner) {
    lookTarget.lerp(ballMesh.position, 0.2);
    camera.lookAt(lookTarget);
  }

  if (pk.stage === 'TO_1B') {
    pk.t += dt;
    const p = Math.min(1, pk.t / pk.dur);
    ballMesh.position.lerpVectors(pk.throwFrom, pk.throwTo, p);
    ballMesh.position.y += Math.sin(p * Math.PI) * 0.6;
    ballShadow.position.set(ballMesh.position.x, 0.07, ballMesh.position.z);
    if (p >= 1) {
      AudioFX.glovePop();
      pk.stage = 'TAG_1B';
      pk.tagTimer = 0.26;
    }
  } else if (pk.stage === 'TAG_1B') {
    pk.tagTimer -= dt;
    if (pk.tagTimer <= 0) {
      if (pk.runnerState !== 'BREAK' && pk.runnerProg > 0.025) {
        AudioFX.tone(170, 0.25);
        game.bases[0] = false;
        if (pk.isMeRunner) game.playerBase = 0;
        cleanupPickoff();
        setBanner('OUT! 牽制出局！', '回壘不及遭觸殺！');
        if (!addOut('投手牽制一壘成功！跑者回壘不及出局！')) enterAfterPause(1.5);
        updateGameUI();
      } else if (pk.isMe1B) {
        pk.stage = 'HOLD_1B';
        pk.holdTimer = 3.5;
        setBanner(pk.runnerState === 'BREAK' ? '跑者起跑了！' : '跑者回壘安全', pk.runnerState === 'BREAK' ? '快按 二（或 2）傳二壘抓觸殺！' : '按中間鈕（或 Space）回傳投手');
        updateDiveBtnState();
      } else if (pk.runnerState === 'BREAK') {
        const cover2B = getBaseCoverFielder(2, '1B');
        pk.stage = 'TO_2B';
        pk.t = 0; pk.dur = 0.56;
        pk.throwFrom = BASES[1].clone().setY(1.35);
        pk.throwTo = cover2B ? cover2B.pos.clone().setY(1.35) : BASES[2].clone().setY(1.35);
        setTicker('跑者起跑！一壘手轉傳二壘抓觸殺！');
      } else {
        cleanupPickoff();
        setBanner('SAFE!', '安全撲回一壘');
        enterAfterPause(0.95);
        updateGameUI();
      }
    }
  } else if (pk.stage === 'HOLD_1B') {
    ballMesh.position.set(player.pos.x, 1.0, player.pos.z);
    pk.holdTimer -= dt;
    if (pk.holdTimer <= 0) handlePickoff1BAction(0);
  } else if (pk.stage === 'TO_P') {
    pk.t += dt;
    const p = Math.min(1, pk.t / pk.dur);
    ballMesh.position.lerpVectors(pk.throwFrom, pk.throwTo, p);
    ballMesh.position.y += Math.sin(p * Math.PI) * 0.7;
    if (p >= 1) {
      AudioFX.glovePop();
      if (pk.runnerState === 'BREAK' && pk.runnerProg >= 0.98) {
        game.bases[0] = false; game.bases[1] = true;
      }
      cleanupPickoff();
      enterAfterPause(0.75);
      updateGameUI();
    }
  } else if (pk.stage === 'TO_2B') {
    pk.t += dt;
    const p = Math.min(1, pk.t / pk.dur);
    ballMesh.position.lerpVectors(pk.throwFrom, pk.throwTo, p);
    ballMesh.position.y += Math.sin(p * Math.PI) * 1.1;
    ballShadow.position.set(ballMesh.position.x, 0.07, ballMesh.position.z);
    if (p >= 1) {
      AudioFX.glovePop();
      pk.stage = 'TAG_2B';
      pk.tagTimer = 0.28;
    }
  } else if (pk.stage === 'TAG_2B') {
    pk.tagTimer -= dt;
    if (pk.tagTimer <= 0) {
      const safe = pk.runnerProg >= 0.98;
      cleanupPickoff();
      if (safe) {
        AudioFX.cheer();
        game.bases[0] = false; game.bases[1] = true;
        if (pk.isMeRunner) game.playerBase = 2;
        setBanner('SAFE!', '滑上二壘安全！');
        enterAfterPause(1.2);
      } else {
        AudioFX.tone(170, 0.25);
        game.bases[0] = false;
        if (pk.isMeRunner) game.playerBase = 0;
        setBanner('OUT!', '夾殺觸殺出局！');
        if (!addOut('跑者太早起跑遭牽制轉傳二壘觸殺出局！')) enterAfterPause(1.4);
      }
      updateGameUI();
    }
  }
}

function updateStealThrow(dt, now) {
  const st = game.steal;
  if (!st) return;

  st.prog = Math.min(1, st.prog + st.speed * dt);
  const rPos = new THREE.Vector3().lerpVectors(BASES[st.fromBase], BASES[st.toBase], st.prog);
  if (st.isMe) {
    camera.position.set(rPos.x, 1.65 + Math.sin(now * 0.022) * 0.08, rPos.z);
    lookTarget.lerp(BASES[st.toBase].clone().setY(1.2), 0.2);
    camera.lookAt(lookTarget);
  } else if (st.mesh) {
    st.mesh.position.set(rPos.x, Math.abs(Math.sin(now * 0.02)) * 0.14, rPos.z);
  }

  if (st.toBase === 2) {
    const fSS = getFielderById('SS'), f2B = getFielderById('2B');
    if (fSS && fSS.mesh.visible) {
      moveObjToward(fSS.pos, BASES[2], fSS.speed, dt);
      fSS.mesh.position.set(fSS.pos.x, 0, fSS.pos.z);
    }
    if (f2B && f2B.mesh.visible) {
      moveObjToward(f2B.pos, new THREE.Vector3(0, 0, 46), f2B.speed, dt);
      f2B.mesh.position.set(f2B.pos.x, 0, f2B.pos.z);
    }
  } else {
    const cover = getBaseCoverFielder(st.toBase, '');
    if (cover && cover.pos && !cover.isPlayer) {
      moveObjToward(cover.pos, BASES[st.toBase], cover.speed || 7.8, dt);
      if (cover.mesh) cover.mesh.position.set(cover.pos.x, 0, cover.pos.z);
    }
  }
  if (!st.isMe) {
    if (isPlayerFielding()) updateCFMovement(dt, now);
    lookTarget.lerp(ballMesh.position, 0.2);
    camera.lookAt(lookTarget);
  }

  if (st.stage === 'POP') {
    ballMesh.position.copy(st.throwFrom);
    ballShadow.position.set(st.throwFrom.x, 0.07, st.throwFrom.z);
    st.popTimer -= dt;
    if (st.popTimer <= 0) {
      st.stage = 'THROW';
      AudioFX.tone(520, 0.08);
    }
  } else if (st.stage === 'THROW') {
    st.throwT += dt;
    const p = Math.min(1, st.throwT / st.throwDur);
    ballMesh.position.lerpVectors(st.throwFrom, st.throwTo, p);
    ballMesh.position.y += Math.sin(p * Math.PI) * 1.25;
    ballShadow.position.set(ballMesh.position.x, 0.07, ballMesh.position.z);
    if (p >= 1) {
      AudioFX.glovePop();
      st.stage = 'TAG';
      st.tagTimer = 0.28;
    }
  } else if (st.stage === 'TAG') {
    st.tagTimer -= dt;
    if (st.tagTimer <= 0) {
      const ssMissedBag = isPlayerFielding() && game.playerPos === 'SS' && st.toBase === 2
        && Math.hypot(player.pos.x - BASES[2].x, player.pos.z - BASES[2].z) > 3.2;
      const safe = st.prog >= 0.98 || ssMissedBag;
      player.autoRun2B = false;
      const bName = ['', '', '二', '三'][st.toBase];
      if (st.mesh) scene.remove(st.mesh);
      game.steal = null;
      if (safe) {
        AudioFX.cheer();
        game.bases[st.fromBase - 1] = false;
        game.bases[st.toBase - 1] = true;
        if (st.isMe) game.playerBase = st.toBase;
        setBanner('SAFE!', `盜上${bName}壘成功！`);
        setTicker(`盜上${bName}壘成功！`);
        enterAfterPause(1.3);
      } else {
        AudioFX.tone(170, 0.25);
        game.bases[st.fromBase - 1] = false;
        if (st.isMe) game.playerBase = 0;
        setBanner('OUT!', `捕手狙殺！盜${bName}壘失敗！`);
        if (!addOut(`捕手長傳${bName}壘觸殺出局！`)) enterAfterPause(1.4);
      }
      updateGameUI();
    }
  }
}

function updatePracticeScoreUI() {
  document.getElementById('stat-ok').textContent = state.ok;
  document.getElementById('stat-total').textContent = state.total;
  document.getElementById('stat-streak').textContent = state.streak;
}

function startPracticePitch() {
  resultCard.style.display = 'none'; startWrap.style.display = 'none'; quizControls.style.display = 'none';
  resetFielders(true, 0x1565c0); resetPlayerCF(); batterMesh.visible = true;
  state.meta = generatePlayableBall(state.mode === 'quiz');
  state.phase = 'PITCHING'; state.pitchT = 0; state.flightT = 0; state.quizChoice = null;
  trailPts.length = 0; trailGeo.setFromPoints([]);
  ballMesh.visible = true; ballMesh.position.set(0, 1.85, 18.44);
  ballShadow.visible = false; landingRing.visible = false;
  setBanner('', '投球中...');
}

function launchPracticeBall() {
  const m = state.meta;
  launchVisualBall(m.ev, m.la, m.spray, m.spin);
  AudioFX.crack(THREE.MathUtils.clamp((m.ev - 36) / 12, 0.55, 1.25));
  state.phase = 'IN_FLIGHT';
  if (state.showMarker && state.mode === 'chase') {
    landingRing.position.set(m.land.x, 0.08, m.land.z); landingRing.visible = true;
  }
  setBanner('', state.mode === 'quiz' ? '看球！準備判斷前還是後...' : '');
}

function submitQuiz(choice) {
  if (state.phase !== 'QUIZ_WAIT') return;
  state.quizChoice = choice; quizControls.style.display = 'none';
  setBanner(choice === 'front' ? '你選：往前衝！' : '你選：往後退！', '揭曉真實落點...');
  landingRing.position.set(state.meta.land.x, 0.08, state.meta.land.z); landingRing.visible = true;
  state.phase = 'IN_FLIGHT';
}

function finishPracticePlay(outcome, title, sub, color) {
  state.phase = 'RESULT'; state.total++;
  if (outcome) { state.ok++; state.streak++; } else state.streak = 0;
  updatePracticeScoreUI();
  const m = state.meta;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-title').style.color = color;
  document.getElementById('result-sub').textContent = sub;
  document.getElementById('st-ev').textContent = `${(m.ev * 3.6).toFixed(1)} km/h`;
  document.getElementById('st-la').textContent = `${m.la.toFixed(1)}°`;
  document.getElementById('st-dist').textContent = `${m.dist.toFixed(1)} m`;
  document.getElementById('st-hang').textContent = `${m.hang.toFixed(2)} s`;
  document.getElementById('st-delta').textContent = m.deltaZ < 0
    ? `站位前方 ${Math.abs(m.deltaZ).toFixed(1)} 公尺（往前衝）`
    : `站位後方 ${Math.abs(m.deltaZ).toFixed(1)} 公尺（往後退）`;
  document.getElementById('btn-next').textContent = '下一球（Space）';
  setBanner('', ''); resultCard.style.display = 'block';
}

function switchMode(newMode) {
  state.mode = newMode; game.active = false; state.phase = 'IDLE';
  hideAllActionUI(); clearLiveRunners();
  resultCard.style.display = 'none'; quizControls.style.display = 'none'; startWrap.style.display = 'block';
  ballMesh.visible = false; ballShadow.visible = false;
  trailPts.length = 0; trailGeo.setFromPoints([]);
  ['mode-game', 'mode-chase', 'mode-quiz'].forEach(id => document.getElementById(id).classList.remove('active'));

  if (newMode === 'game') {
    gameBug.style.display = 'block'; practiceScore.style.display = 'none'; ticker.style.display = 'none';
    document.getElementById('setup-panel').style.display = 'block';

    updateSetupBanner();
    resetPlayerCF(); updateGameUI();
  } else {
    gameBug.style.display = 'none'; practiceScore.style.display = 'flex'; ticker.style.display = 'none';
    document.getElementById('setup-panel').style.display = 'none';
    document.getElementById('btn-start').textContent = '投球（Space）';
    if (newMode === 'chase') { touchControls.style.display = 'block'; setBanner('實戰追接模式', '靠視線與聲音判斷落點，跑位接殺飛球'); }
    else setBanner('這顆飛球，前？後？', '擊球後 1.15 秒瞬間判斷往前衝還是往後退');

}

  camera.aspect = window.innerWidth / window.innerHeight;

const minimap = document.getElementById('minimap');
const mctx = minimap.getContext('2d');
function drawMinimap() {
  const w = minimap.width, h = minimap.height;
  mctx.clearRect(0, 0, w, h);
  const ox = w / 2, oy = h - 18, scale = 1.2;
  mctx.beginPath(); mctx.moveTo(ox, oy);
  mctx.arc(ox, oy, 122 * scale, -Math.PI * 0.75, -Math.PI * 0.25);
  mctx.closePath();
  mctx.fillStyle = 'rgba(56, 142, 60, 0.45)'; mctx.fill();
  mctx.strokeStyle = 'rgba(255,255,255,0.45)'; mctx.lineWidth = 2; mctx.stroke();

  fielders.forEach(f => {
    if (!f.mesh.visible) return;
    mctx.fillStyle = 'rgba(144, 202, 249, 0.85)';
    mctx.beginPath(); mctx.arc(ox - f.pos.x * scale, oy - f.pos.z * scale, 3, 0, Math.PI * 2); mctx.fill();
  });

  liveRunners.forEach(r => {
    if (r.out || r.scored) return;
    const p = r.isMe && isPlayerOffense() ? camera.position : r.mesh.position;
    mctx.fillStyle = '#ffca28';
    mctx.beginPath(); mctx.arc(ox - p.x * scale, oy - p.z * scale, 4, 0, Math.PI * 2); mctx.fill();
  });

  if (state.mode !== 'game' || isPlayerFielding()) {
    mctx.fillStyle = '#29b6f6';
    mctx.beginPath(); mctx.arc(ox - player.pos.x * scale, oy - player.pos.z * scale, 5, 0, Math.PI * 2); mctx.fill();
  }
  if (landingRing.visible && state.meta && state.meta.land) {
    mctx.strokeStyle = '#ffeb3b'; mctx.lineWidth = 2.5;
    mctx.beginPath(); mctx.arc(ox - state.meta.land.x * scale, oy - state.meta.land.z * scale, 6, 0, Math.PI * 2); mctx.stroke();
  }
  if (ballMesh.visible) {
    mctx.fillStyle = '#ffffff';
    mctx.beginPath(); mctx.arc(ox - ballMesh.position.x * scale, oy - ballMesh.position.z * scale, 3.5, 0, Math.PI * 2); mctx.fill();
  }
}

function updateCFMovement(dt, now) {
  if (player.stunTimer > 0) {
    player.stunTimer = Math.max(0, player.stunTimer - dt);
    player.diving = false;
    if (game.play) game.play.autoRun1B = false;
    player.vel.multiplyScalar(Math.pow(0.04, dt));
    player.pos.addScaledVector(player.vel, dt);
    const targetY = player.stunTimer > 0.2 ? 0.62 : 1.7;
    player.pos.y = THREE.MathUtils.lerp(player.pos.y, targetY, Math.min(1, dt * 10));
    camera.position.copy(player.pos);
    return;
  }
  const isIF = state.mode === 'game' && isPlayerIF();
  if (player.diving) {
    if (game.play) game.play.autoRun1B = false;
    player.diveTimer -= dt;
    const speed = (isIF ? 9.0 : 10.6) * Math.max(player.diveTimer / 0.52, 0.15);
    player.pos.addScaledVector(player.diveDir, speed * dt);
    player.pos.y = 0.72 + 0.55 * Math.sin((player.diveTimer / 0.52) * Math.PI);
    if (player.diveTimer <= 0) { player.diving = false; player.pos.y = 1.7; }
  } else {
    const input = getMoveInput();
    const pl = (state.mode === 'game' && game.subPhase === 'LIVE_PLAY') ? game.play : null;
    let autoRunning = false;
    if (pl && pl.autoRun1B) {
      if (input.lengthSq() > 0.05) {
        pl.autoRun1B = false;
      } else {
        const dx = BASES[1].x - player.pos.x, dz = BASES[1].z - player.pos.z;
        const d = Math.hypot(dx, dz);
        if (d <= 0.35) {
          pl.autoRun1B = false;
          player.pos.x = BASES[1].x;
          player.pos.z = BASES[1].z;
          player.vel.set(0, 0, 0);
        } else {
          input.set(dx / d, 0, dz / d);
          autoRunning = true;
        }
      }
    } else if (player.autoRun2B) {
      if (input.lengthSq() > 0.05) {
        player.autoRun2B = false;
      } else {
        const dx = BASES[2].x - player.pos.x, dz = BASES[2].z - player.pos.z;
        const d = Math.hypot(dx, dz);
        if (d <= 0.35) {
          player.autoRun2B = false;
          player.pos.x = BASES[2].x;
          player.pos.z = BASES[2].z;
          player.vel.set(0, 0, 0);
        } else {
          input.set(dx / d, 0, dz / d);
          autoRunning = true;
        }
      }
    }
    const maxSpeed = isIF
      ? (autoRunning ? 7.5 : (input.z > 0.3 ? 6.6 : 7.2))
      : (autoRunning ? 8.8 : (input.z > 0.3 ? 7.8 : 8.8));
    player.vel.lerp(input.multiplyScalar(maxSpeed), Math.min(1, dt * 8.5));
    player.pos.addScaledVector(player.vel, dt);
    player.pos.y = 1.7 + Math.sin(now * 0.018) * (player.vel.length() * 0.012);
  }
  const r = Math.hypot(player.pos.x, player.pos.z);
  if (r > wallRadius - 1.2) { player.pos.x *= (wallRadius - 1.2) / r; player.pos.z *= (wallRadius - 1.2) / r; }
  const minZ = isIF ? 4 : 36;
  if (player.pos.z < minZ) player.pos.z = minZ;
  camera.position.copy(player.pos);
}

const lookTarget = new THREE.Vector3(0, 2.2, 0);
let lastTime = performance.now(), accum = 0;
const FIXED_DT = 1 / 120;

function animateHumanoid(mesh, dt, now, opts = {}) {
  if (!mesh || !mesh.visible || !mesh.userData.leftArm) return;
  const u = mesh.userData;
  if (opts.hideGlove && u.glove) u.glove.visible = false;

  const dx = mesh.position.x - u.prevPos.x;
  const dz = mesh.position.z - u.prevPos.z;
  const spd = Math.hypot(dx, dz) / Math.max(dt, 0.001);
  u.prevPos.copy(mesh.position);

  const lerp = (a, b) => THREE.MathUtils.lerp(a, b, Math.min(1, dt * 14));
  const lKnee = u.leftLeg.userData.lower;
  const rKnee = u.rightLeg.userData.lower;
  if (!opts.crouch && !opts.pitchMode) {
    if (lKnee) lKnee.rotation.x = lerp(lKnee.rotation.x, 0);
    if (rKnee) rKnee.rotation.x = lerp(rKnee.rotation.x, 0);
    u.leftLeg.rotation.z = lerp(u.leftLeg.rotation.z, 0);
    u.rightLeg.rotation.z = lerp(u.rightLeg.rotation.z, 0);
  }

  if (opts.stunned) {
    u.leftArm.rotation.x = -0.6; u.rightArm.rotation.x = -0.6;
    u.leftLeg.rotation.x = 0.2; u.rightLeg.rotation.x = -0.2;
    return;
  }

  if (opts.pitchMode) {
    const isSet = opts.pitchMode === 'set';
    const w = opts.windupP || 0;
    const p = opts.pitchP;

    if (p === undefined) {
      if (isSet) {
        if (w <= 0) {
          mesh.rotation.y = lerp(mesh.rotation.y, Math.PI * 0.5);
          mesh.rotation.x = lerp(mesh.rotation.x, 0);
          u.leftArm.rotation.x = lerp(u.leftArm.rotation.x, -1.05);
          u.leftArm.rotation.z = lerp(u.leftArm.rotation.z, -0.32);
          u.rightArm.rotation.x = lerp(u.rightArm.rotation.x, -1.05);
          u.rightArm.rotation.z = lerp(u.rightArm.rotation.z, 0.32);
          u.leftLeg.rotation.x = lerp(u.leftLeg.rotation.x, 0.05);
          u.rightLeg.rotation.x = lerp(u.rightLeg.rotation.x, -0.05);
          if (lKnee) lKnee.rotation.x = lerp(lKnee.rotation.x, 0);
          if (rKnee) rKnee.rotation.x = lerp(rKnee.rotation.x, 0);
        } else if (w < 0.45) {
          // 封閉式：快速小抬腿
          const k = w / 0.45;
          mesh.rotation.y = Math.PI * 0.5;
          mesh.rotation.x = 0;
          u.leftLeg.rotation.x = -0.78 * k;
          if (lKnee) lKnee.rotation.x = 0.85 * k;
          u.rightLeg.rotation.x = 0.1 * k;
          u.leftArm.rotation.x = -1.05;
          u.rightArm.rotation.x = -1.05;
        } else {
          // 封閉式：跨步＋拉臂蓄力到放球前
          const k = (w - 0.45) / 0.55;
          mesh.rotation.y = THREE.MathUtils.lerp(Math.PI * 0.5, Math.PI * 0.92, k);
          mesh.rotation.x = 0.14 * k;
          u.leftLeg.rotation.x = THREE.MathUtils.lerp(-0.78, -0.45, k);
          if (lKnee) lKnee.rotation.x = THREE.MathUtils.lerp(0.85, 0.25, k);
          u.rightLeg.rotation.x = THREE.MathUtils.lerp(0.1, 0.48, k);
          u.rightArm.rotation.x = THREE.MathUtils.lerp(-1.05, -2.45, k);
          u.rightArm.rotation.z = THREE.MathUtils.lerp(0.32, -0.42, k);
          u.leftArm.rotation.x = THREE.MathUtils.lerp(-1.05, -1.35, k);
        }
      } else if (w <= 0) {
        // 開放式預備：正面朝本壘
        mesh.rotation.y = lerp(mesh.rotation.y, Math.PI);
        mesh.rotation.x = lerp(mesh.rotation.x, 0);
        u.leftArm.rotation.x = lerp(u.leftArm.rotation.x, -0.55);
        u.leftArm.rotation.z = lerp(u.leftArm.rotation.z, -0.2);
        u.rightArm.rotation.x = lerp(u.rightArm.rotation.x, -0.55);
        u.rightArm.rotation.z = lerp(u.rightArm.rotation.z, 0.2);
        u.leftLeg.rotation.x = lerp(u.leftLeg.rotation.x, 0.05);
        u.rightLeg.rotation.x = lerp(u.rightLeg.rotation.x, -0.05);
        if (lKnee) lKnee.rotation.x = lerp(lKnee.rotation.x, 0);
        if (rKnee) rKnee.rotation.x = lerp(rKnee.rotation.x, 0);
      } else if (w < 0.30) {
        // 開放式第一段：雙手高舉過頭
        const k = w / 0.30;
        mesh.rotation.y = Math.PI;
        u.leftArm.rotation.x = THREE.MathUtils.lerp(-0.55, -2.65, k);
        u.rightArm.rotation.x = THREE.MathUtils.lerp(-0.55, -2.65, k);
        u.leftArm.rotation.z = -0.18;
        u.rightArm.rotation.z = 0.18;
        u.leftLeg.rotation.x = 0.12 * k;
        u.rightLeg.rotation.x = -0.08 * k;
      } else if (w < 0.68) {
        // 開放式第二段：轉身側向＋彎膝高抬腿
        const k = (w - 0.30) / 0.38;
        mesh.rotation.y = THREE.MathUtils.lerp(Math.PI, Math.PI * 0.52, k);
        u.leftArm.rotation.x = THREE.MathUtils.lerp(-2.65, -1.05, k);
        u.rightArm.rotation.x = THREE.MathUtils.lerp(-2.65, -1.05, k);
        u.leftArm.rotation.z = -0.28;
        u.rightArm.rotation.z = 0.28;
        u.leftLeg.rotation.x = THREE.MathUtils.lerp(0.12, -1.25, k);
        if (lKnee) lKnee.rotation.x = 1.25 * k;
        u.rightLeg.rotation.x = 0.12 * k;
      } else {
        // 開放式第三段：跨步＋拉臂蓄力完成，準備放球
        const k = (w - 0.68) / 0.32;
        mesh.rotation.y = THREE.MathUtils.lerp(Math.PI * 0.52, Math.PI * 0.92, k);
        mesh.rotation.x = 0.14 * k;
        u.leftLeg.rotation.x = THREE.MathUtils.lerp(-1.25, -0.45, k);
        if (lKnee) lKnee.rotation.x = THREE.MathUtils.lerp(1.25, 0.25, k);
        u.rightLeg.rotation.x = THREE.MathUtils.lerp(0.12, 0.48, k);
        u.rightArm.rotation.x = THREE.MathUtils.lerp(-1.05, -2.45, k);
        u.rightArm.rotation.z = THREE.MathUtils.lerp(0.28, -0.42, k);
        u.leftArm.rotation.x = THREE.MathUtils.lerp(-1.05, -1.35, k);
      }
      return;
    }

    // 球已經離開手：立刻甩臂收尾＋回正守備
    if (p < 0.30) {
      const k = p / 0.30;
      mesh.rotation.y = THREE.MathUtils.lerp(Math.PI * 0.92, Math.PI * 1.18, k);
      mesh.rotation.x = THREE.MathUtils.lerp(0.14, 0.24, k);
      u.leftLeg.rotation.x = THREE.MathUtils.lerp(-0.45, -0.18, k);
      if (lKnee) lKnee.rotation.x = THREE.MathUtils.lerp(0.25, 0.1, k);
      u.rightLeg.rotation.x = THREE.MathUtils.lerp(0.48, 0.65, k);
      if (rKnee) rKnee.rotation.x = 0.45 * k;
      u.rightArm.rotation.x = THREE.MathUtils.lerp(-2.45, 1.15, k);
      u.rightArm.rotation.z = THREE.MathUtils.lerp(-0.42, 0.38, k);
      u.leftArm.rotation.x = THREE.MathUtils.lerp(-1.35, -0.45, k);
      u.leftArm.rotation.z = 0.1;
    } else {
      const k = (p - 0.30) / 0.70;
      mesh.rotation.y = THREE.MathUtils.lerp(Math.PI * 1.18, Math.PI, k);
      mesh.rotation.x = THREE.MathUtils.lerp(0.24, 0, k);
      u.leftLeg.rotation.x = THREE.MathUtils.lerp(-0.18, 0.05, k);
      u.rightLeg.rotation.x = THREE.MathUtils.lerp(0.65, -0.05, k);
      if (lKnee) lKnee.rotation.x = THREE.MathUtils.lerp(0.1, 0, k);
      if (rKnee) rKnee.rotation.x = THREE.MathUtils.lerp(0.45, 0, k);
      u.rightArm.rotation.x = THREE.MathUtils.lerp(1.15, -0.25, k);
      u.rightArm.rotation.z = THREE.MathUtils.lerp(0.38, 0, k);
      u.leftArm.rotation.x = THREE.MathUtils.lerp(-0.45, -0.3, k);
      u.leftArm.rotation.z = 0;
    }
    return;
  }
  if (opts.swing) {
    mesh.rotation.y = -Math.PI / 2;
    u.rightArm.rotation.x = lerp(u.rightArm.rotation.x, -1.45);
    u.rightArm.rotation.z = lerp(u.rightArm.rotation.z, 1.15);
    u.leftArm.rotation.x = lerp(u.leftArm.rotation.x, -1.1);
    u.leftLeg.rotation.x = lerp(u.leftLeg.rotation.x, -0.25);
    u.rightLeg.rotation.x = lerp(u.rightLeg.rotation.x, 0.25);
    return;
  }

  if (opts.batterReady) {
    mesh.rotation.y = -Math.PI / 2;
    u.rightArm.rotation.x = lerp(u.rightArm.rotation.x, -2.15);
    u.rightArm.rotation.z = lerp(u.rightArm.rotation.z, -0.35);
    u.leftArm.rotation.x = lerp(u.leftArm.rotation.x, -1.55);
    u.leftLeg.rotation.x = lerp(u.leftLeg.rotation.x, 0.1);
    u.rightLeg.rotation.x = lerp(u.rightLeg.rotation.x, -0.1);
    return;
  }

  if (opts.crouch) {
    mesh.rotation.y = 0;
    mesh.position.y = -0.34;
    u.leftLeg.rotation.x = -1.25; u.rightLeg.rotation.x = -1.25;
    u.leftLeg.rotation.z = 0.22;  u.rightLeg.rotation.z = -0.22;
    if (lKnee) lKnee.rotation.x = 2.05;
    if (rKnee) rKnee.rotation.x = 2.05;
    u.leftArm.rotation.x = -1.15; u.leftArm.rotation.z = -0.25;
    u.rightArm.rotation.x = -0.45; u.rightArm.rotation.z = 0.25;
    return;
  }

  if (opts.throwing) {
    const k = opts.throwP || 0;
    u.rightArm.rotation.x = k < 0.65 ? -2.35 : 1.25;
    u.leftArm.rotation.x = -0.7;
    u.leftLeg.rotation.x = -0.35; u.rightLeg.rotation.x = 0.25;
    return;
  }

  if (opts.tagging) {
    u.leftArm.rotation.x = -1.25 + Math.sin(now * 0.04) * 0.45;
    u.rightArm.rotation.x = -0.3;
    u.leftLeg.rotation.x = -0.35; u.rightLeg.rotation.x = 0.35;
    return;
  }

  if (spd > 0.45) {
    mesh.rotation.y = Math.atan2(dx, dz);
    const amp = Math.min(1, spd / 5.5);
    const s = Math.sin(now * 0.02);
    u.leftLeg.rotation.x = s * 0.85 * amp;
    u.rightLeg.rotation.x = -s * 0.85 * amp;
    u.leftArm.rotation.x = -s * 0.72 * amp;
    u.rightArm.rotation.x = s * 0.72 * amp;
    u.rightArm.rotation.z = 0;
  } else {
    if (opts.idleYaw !== undefined) mesh.rotation.y = opts.idleYaw;
    u.leftLeg.rotation.x = lerp(u.leftLeg.rotation.x, 0.05);
    u.rightLeg.rotation.x = lerp(u.rightLeg.rotation.x, -0.05);
    u.leftArm.rotation.x = lerp(u.leftArm.rotation.x, -0.28);
    u.rightArm.rotation.x = lerp(u.rightArm.rotation.x, -0.2);
    u.rightArm.rotation.z = lerp(u.rightArm.rotation.z, 0);
  }
}

function updateAllCharacterAnimations(dt, now) {
  const pl = game.play;
  const isSimPitch = state.mode === 'game' && (game.subPhase === 'DEF_PITCH' || game.subPhase === 'OFF_SIM_PITCH');
  const isBatPitch = state.mode === 'game' && game.subPhase === 'BAT_PITCH';
  const isPracPitch = state.mode !== 'game' && state.phase === 'PITCHING';

  // 投手動作（壘上無人開放式 windup / 壘上有人封閉式 set）
  const hasRunner = state.mode === 'game' && (game.bases[0] || game.bases[1] || game.bases[2]);
  const isWaitPitch = state.mode === 'game' && (game.subPhase === 'DEF_WAIT' || game.subPhase === 'OFF_SIM_WAIT' || game.subPhase === 'BAT_WAIT');
  let pitchP, windupP = 0;
  if (isSimPitch) pitchP = Math.min(1, state.pitchT / Math.max(0.1, game.pitchType.dur));
  else if (isBatPitch) pitchP = Math.min(1, state.pitchT / Math.max(0.1, game.pitchDur));
  else if (isPracPitch) pitchP = Math.min(1, state.pitchT / 0.48);
  else if (isWaitPitch) {
    const winDur = (hasRunner ? 0.52 : 0.92) / (game.subPhase === 'BAT_WAIT' ? 1 : state.speed);
    if (game.timer < winDur) windupP = Math.min(1, 1 - game.timer / winDur);
  }
  const pitchMode = (pitchP !== undefined || isWaitPitch) ? (hasRunner ? 'set' : 'windup') : null;
  animateHumanoid(pitcherMesh, dt, now, { pitchMode, windupP, pitchP, idleYaw: Math.PI });

  // 打者動作（準備打擊 / 揮棒）
  const aiSwing = isSimPitch && pitchP > 0.72 && game.simResult !== 'BALL' && game.simResult !== 'STRIKE_LOOK';
  const pracSwing = state.mode !== 'game' && state.phase === 'IN_FLIGHT' && state.flightT < 0.35;
  const liveSwing = state.mode === 'game' && ((game.subPhase === 'LIVE_PLAY' && pl && pl.elapsed < 0.35) || game.subPhase === 'WATCH_FOUL');
  animateHumanoid(batterMesh, dt, now, { swing: aiSwing || pracSwing || liveSwing, batterReady: true });

  // 捕手動作（平時蹲捕，抓盜壘時起身傳球）
  const catcherThrow = state.mode === 'game' && game.subPhase === 'STEAL_THROW' && game.steal && (game.steal.stage === 'POP' || game.steal.stage === 'THROW');
  if (catcherThrow) {
    catcherMesh.position.y = 0;
    catcherMesh.rotation.y = 0;
    animateHumanoid(catcherMesh, dt, now, { throwing: true, throwP: game.steal.stage === 'POP' ? 0.3 : 0.9 });
  } else {
    animateHumanoid(catcherMesh, dt, now, { crouch: true });
  }

  // 所有守備員
  fielders.forEach(f => {
    const isThrower = pl && pl.fielderRef === f && pl.throwDelay > 0;
    const isTagger = pl && pl.fielderRef === f && pl.tagDelay > 0;
    const idleYaw = Math.atan2(-f.pos.x, -f.pos.z);
    animateHumanoid(f.mesh, dt, now, {
      stunned: f.stunTimer > 0,
      throwing: isThrower,
      throwP: isThrower ? (1 - pl.throwDelay / 0.44) : 0,
      tagging: isTagger,
      idleYaw
    });
  });

  // 所有跑者（收起手套）
  staticRunners.forEach((m, i) => animateHumanoid(m, dt, now, { hideGlove: true, idleYaw: Math.atan2(-m.position.x, 18.44 - m.position.z) }));
  liveRunners.forEach(r => animateHumanoid(r.mesh, dt, now, { hideGlove: true }));
  if (game.steal && game.steal.mesh) animateHumanoid(game.steal.mesh, dt, now, { hideGlove: true });
  if (game.pickoff && game.pickoff.runnerMesh) animateHumanoid(game.pickoff.runnerMesh, dt, now, { hideGlove: true });
}
  function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (state.mode === 'game' && game.active) {
    if (game.subPhase === 'CHANGE_SIDES' || game.subPhase === 'PAUSE_NEXT') {
      game.timer -= dt;
      if (game.timer <= 0) enterCurrentRole();
    } else if (game.subPhase === 'DEF_WAIT' || game.subPhase === 'OFF_SIM_WAIT') {
      if (game.subPhase === 'DEF_WAIT') {
        updateCFMovement(dt, now);
        lookTarget.lerp(new THREE.Vector3(0, 1.8, 0), 0.12); camera.lookAt(lookTarget);
      }
      game.timer -= dt;
      if (game.timer <= 0) {
        if (game.bases[0] && Math.random() < 0.06) startPickoff(false);
        else launchSimPitch(game.subPhase === 'DEF_WAIT');
      }
    } else if (game.subPhase === 'DEF_PITCH' || game.subPhase === 'OFF_SIM_PITCH') {
      if (game.subPhase === 'DEF_PITCH') updateCFMovement(dt, now);
      state.pitchT += dt * state.speed;
      const p = Math.min(state.pitchT / game.pitchType.dur, 1);
      const pt = game.pitchType;
      ballMesh.position.set(
        pt.breakX * p * p,
        1.85 - p * 0.8 + Math.sin(p * Math.PI) * pt.arc + pt.breakY * p * p * 0.5,
        18.44 * (1 - p) + 0.3
      );
      ballMesh.scale.setScalar(game.subPhase === 'DEF_PITCH' ? 2.4 : 1.3);
      if (game.subPhase === 'DEF_PITCH') lookTarget.lerp(new THREE.Vector3(0, 1.8, 0), 0.12);
      else lookTarget.lerp(ballMesh.position, 0.2);
      camera.lookAt(lookTarget);
      if (game.steal && game.steal.stage === 'PITCHING') {
        const st = game.steal;
        st.prog = Math.min(1, st.prog + st.speed * dt * state.speed);
        const rp = new THREE.Vector3().lerpVectors(BASES[st.fromBase], BASES[st.toBase], st.prog);
        if (st.isMe) {
          camera.position.set(rp.x, 1.65 + Math.sin(now * 0.022) * 0.08, rp.z);
          lookTarget.lerp(BASES[st.toBase].clone().setY(1.2), 0.2);
          camera.lookAt(lookTarget);
        } else if (st.mesh) {
          st.mesh.position.set(rp.x, Math.abs(Math.sin(now * 0.02)) * 0.14, rp.z);
        }
      }
      if (p >= 1) resolveSimPitch(game.subPhase === 'DEF_PITCH');
    } else if (game.subPhase === 'LIVE_PLAY') {
      updateLivePlay(dt, now);
    } else if (game.subPhase === 'BAT_WAIT') {
      game.timer -= dt;
      if (game.timer <= 0) launchPlayerAtBatPitch();
    } else if (game.subPhase === 'BAT_PITCH') {
      state.pitchT += dt;
      const p = Math.min(state.pitchT / game.pitchDur, 1);
      const t = game.pitchTarget, pt = game.pitchType;
      ballMesh.position.set(
        (t.x - pt.breakX) * p + pt.breakX * p * p,
        1.85 + (t.y - 1.85 - pt.breakY) * p + pt.breakY * p * p + Math.sin(p * Math.PI) * pt.arc,
        18.44 * (1 - p) + t.z * p
      );
      ballMesh.scale.setScalar(1.15);
      if (p >= 1 && !game.pitchSwung) {
        AudioFX.glovePop();
        const pInfo = `${pt.name} ${game.pitchKmh}km/h｜`;
        if (game.pitchIsStrike) {
          game.strikes++;
          if (game.strikes >= 3) {
            game.stats.ab++;
            if (!addOut(`${pInfo}好球沒揮棒！遭到三振出局！`)) { nextBatter(); enterAfterPause(1.2); }
          } else { setTicker(`${pInfo}好球進壘（${game.balls}壞${game.strikes}好）`); enterAfterPause(0.95); }
        } else {
          game.balls++;
          if (game.balls >= 4) {
            AudioFX.cheer(); game.stats.bb++; applyWalk(true);
            setBanner('BALL FOUR!', '選到四壞球保送上一壘！');
            setTicker(`${pInfo}選球漂亮！四壞球保送上一壘`);
            nextBatter(); enterAfterPause(1.4);
          } else { setTicker(`${pInfo}壞球！選得好（${game.balls}壞${game.strikes}好）`); enterAfterPause(0.95); }
        }
        updateGameUI();
      }
    } else if (game.subPhase === 'WATCH_FOUL') {
      stepPhysics(state.ballPos, state.ballVel, 0.5, dt);
      if (state.ballPos.y < 0.11) state.ballPos.y = 0.11;
      ballMesh.position.copy(state.ballPos);
      ballShadow.position.set(state.ballPos.x, 0.07, state.ballPos.z);
      lookTarget.lerp(state.ballPos, 0.16); camera.lookAt(lookTarget);
      game.timer -= dt;
      if (game.timer <= 0) enterCurrentRole();
    } else if (game.subPhase === 'PICKOFF') {
      updatePickoff(dt, now);
    } else if (game.subPhase === 'STEAL_THROW') {
      updateStealThrow(dt, now);
    }
  } else if (state.mode !== 'game') {
    if (state.phase === 'PITCHING') {
      state.pitchT += dt;
      const p = Math.min(state.pitchT / 0.48, 1);
      ballMesh.position.set(0, 1.85 - p * 0.8, 18.44 * (1 - p) + 0.3);
      ballMesh.scale.setScalar(2.4);
      lookTarget.lerp(new THREE.Vector3(0, 1.6, 0), 0.15); camera.lookAt(lookTarget);
      if (p >= 1) launchPracticeBall();
    } else if (state.phase === 'IN_FLIGHT') {
      if (state.mode === 'chase') updateCFMovement(dt, now);
      accum += dt;
      while (accum >= FIXED_DT && state.phase === 'IN_FLIGHT') {
        stepPhysics(state.ballPos, state.ballVel, state.meta.spin, FIXED_DT);
        state.flightT += FIXED_DT; accum -= FIXED_DT;
        if (state.mode === 'quiz' && !state.quizChoice && state.flightT >= 1.15) {
          state.phase = 'QUIZ_WAIT'; quizControls.style.display = 'flex';
          setBanner('這顆飛球，前？後？', '立刻選擇！'); break;
        }
        if (state.mode === 'chase') {
          const horiz = Math.hypot(state.ballPos.x - player.pos.x, state.ballPos.z - player.pos.z);
          if (horiz <= (player.diving ? 2.85 : 2.15) && state.ballPos.y <= 2.65 && state.ballPos.y >= 0.15 && state.ballVel.y < 0) {
            AudioFX.glovePop(); AudioFX.tone(660, 0.22);
            finishPracticePlay(true, player.diving ? '美技撲接接殺！' : '穩穩接殺出局！', `落點偏差 ${horiz.toFixed(2)} 公尺`, '#66bb6a'); break;
          }
        }
        if (state.ballPos.y <= 0.11) {
          state.ballPos.y = 0.11; AudioFX.thud();
          if (state.mode === 'quiz') {
            const correct = state.meta.deltaZ < 0 ? 'front' : 'back';
            const ok = state.quizChoice === correct;
            AudioFX.tone(ok ? 720 : 180, 0.22);
            finishPracticePlay(ok, ok ? '判斷正確！' : '判斷失誤！', `正確方向：${correct === 'front' ? '往前衝（前）' : '往後退（後）'}`, ok ? '#66bb6a' : '#ef5350');
          } else {
            const miss = Math.hypot(state.ballPos.x - player.pos.x, state.ballPos.z - player.pos.z);
            finishPracticePlay(false, state.ballPos.z > player.pos.z + 2 ? '越過頭頂長打！' : '落地安打！', `落地距離差 ${miss.toFixed(1)} 公尺`, '#ef5350');
          }
          break;
        }
      }
      ballMesh.position.copy(state.ballPos);
      ballMesh.scale.setScalar(THREE.MathUtils.clamp(camera.position.distanceTo(state.ballPos) * 0.026, 1.0, 2.8));
      ballShadow.position.set(state.ballPos.x, 0.07, state.ballPos.z);
      if (state.mode === 'quiz' && state.quizChoice) { trailPts.push(state.ballPos.clone()); trailGeo.setFromPoints(trailPts); }
      lookTarget.lerp(state.ballPos, 0.22); camera.lookAt(lookTarget);
    } else if (state.phase === 'QUIZ_WAIT') {
      camera.lookAt(lookTarget);
    }
  }

  updateAllCharacterAnimations(dt, now);
    drawMinimap();
  renderer.render(scene, camera);
}

switchMode('game');
requestAnimationFrame(animate);
</script>
</body>
</html>
