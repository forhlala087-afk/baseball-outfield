<script>
const AudioFX = (() => {
  let ctx = null;
  function ensure() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
  }
  function crack(power = 1) {
    ensure();
    const now = ctx.currentTime;
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.14, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.018));
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1400 + power * 500;
    filter.Q.value = 1.4;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.9 * power, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
    noise.connect(filter).connect(gain).connect(ctx.destination);
    noise.start(now);

    const osc = ctx.createOscillator();
    const og = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(520 + power * 180, now);
    osc.frequency.exponentialRampToValueAtTime(140, now + 0.06);
    og.gain.setValueAtTime(0.5 * power, now);
    og.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
    osc.connect(og).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.07);
  }
  function glovePop() {
    ensure();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(210, now);
    osc.frequency.exponentialRampToValueAtTime(55, now + 0.09);
    g.gain.setValueAtTime(0.75, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc.connect(g).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.1);
  }
  function thud() {
    ensure();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(110, now);
    osc.frequency.exponentialRampToValueAtTime(38, now + 0.12);
    g.gain.setValueAtTime(0.5, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
    osc.connect(g).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.13);
  }
  function tone(freq, dur = 0.16) {
    ensure();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(0.22, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(g).connect(ctx.destination);
    osc.start(now);
    osc.stop(now + dur);
  }
  return { crack, glovePop, thud, tone };
})();

function createGrassTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const g = c.getContext('2d');
  for (let i = 0; i < 16; i++) {
    g.fillStyle = i % 2 === 0 ? '#2f7a32' : '#388a3a';
    g.fillRect(0, i * 32, 512, 32);
  }
  for (let i = 0; i < 6000; i++) {
    g.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.04)';
    g.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(16, 16);
  return tex;
}

function createCrowdTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#243447';
  g.fillRect(0, 0, 512, 128);
  const colors = ['#cfd8dc', '#90caf9', '#ef9a9a', '#ffe082', '#ffffff', '#546e7a', '#1e88e5'];
  for (let y = 6; y < 124; y += 8) {
    g.fillStyle = '#1b2838';
    g.fillRect(0, y + 4, 512, 2);
    for (let x = 2; x < 512; x += 6) {
      if (Math.random() > 0.25) {
        g.fillStyle = colors[Math.floor(Math.random() * colors.length)];
        g.fillRect(x, y, 4, 5);
      }
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.repeat.set(14, 1);
  return tex;
}

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') {
    e.preventDefault();
    if (state.phase === 'IDLE') startPitch();
    else if (state.phase === 'RESULT') startPitch();
    else if (state.phase === 'IN_FLIGHT' && state.mode === 'chase') triggerDive();
  }
  if (state.phase === 'QUIZ_WAIT') {
    if (e.code === 'ArrowUp' || e.code === 'KeyW') submitQuiz('front');
    if (e.code === 'ArrowDown' || e.code === 'KeyS') submitQuiz('back');
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

const joy = { active: false, dx: 0, dy: 0, id: null };
const joyZone = document.getElementById('joy-zone');
const joyKnob = document.getElementById('joy-knob');

function updateJoy(clientX, clientY) {
  const rect = joyZone.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const maxR = rect.width * 0.38;
  let dx = clientX - cx;
  let dy = clientY - cy;
  const len = Math.hypot(dx, dy);
  if (len > maxR) { dx = dx / len * maxR; dy = dy / len * maxR; }
  joy.dx = dx / maxR;
  joy.dy = dy / maxR;
  joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
}

joyZone.addEventListener('pointerdown', e => {
  joy.active = true; joy.id = e.pointerId;
  joyZone.setPointerCapture(e.pointerId);
  updateJoy(e.clientX, e.clientY);
});
joyZone.addEventListener('pointermove', e => {
  if (joy.active && e.pointerId === joy.id) updateJoy(e.clientX, e.clientY);
});
function endJoy() {
  joy.active = false; joy.dx = 0; joy.dy = 0;
  joyKnob.style.transform = 'translate(0px, 0px)';
}
joyZone.addEventListener('pointerup', endJoy);
joyZone.addEventListener('pointercancel', endJoy);

document.getElementById('dive-btn').addEventListener('pointerdown', e => {
  e.preventDefault();
  if (state.phase === 'IN_FLIGHT' && state.mode === 'chase') triggerDive();
});

function stepPhysics(pos, vel, spin, dt) {
  const speed = vel.length();
  const drag = 0.0046 * speed;
  vel.x -= drag * vel.x * dt;
  vel.y -= (9.81 + drag * vel.y) * dt;
  vel.z -= drag * vel.z * dt;
  vel.y += spin * speed * 0.0014 * dt;
  pos.addScaledVector(vel, dt);
}

function simulateHit(ev, laDeg, sprayDeg, spin) {
  const la = THREE.MathUtils.degToRad(laDeg);
  const sp = THREE.MathUtils.degToRad(sprayDeg);
  const pos = new THREE.Vector3(0, 1.05, 0.3);
  const vel = new THREE.Vector3(
    ev * Math.cos(la) * Math.sin(sp),
    ev * Math.sin(la),
    ev * Math.cos(la) * Math.cos(sp)
  );
  const dt = 1 / 120;
  let t = 0;
  let maxH = 0;
  while (pos.y > 0.1 && t < 10) {
    stepPhysics(pos, vel, spin, dt);
    if (pos.y > maxH) maxH = pos.y;
    t += dt;
  }
  return { land: pos.clone(), hang: t, maxH };
}

function generatePlayableBall() {
  for (let tries = 0; tries < 80; tries++) {
    const ev = 38 + Math.random() * 10.5;
    const la = 19 + Math.random() * 28;
    const spray = state.mode === 'quiz'
      ? (Math.random() * 10 - 5)
      : (Math.random() * 24 - 12);
    const spin = 0.8 + Math.random() * 1.1;
    const sim = simulateHit(ev, la, spray, spin);
    const dist = Math.hypot(sim.land.x, sim.land.z);
    const deltaZ = sim.land.z - START_POS.z;
    if (state.mode === 'quiz') {
      if (dist > 64 && dist < 118 && Math.abs(deltaZ) > 5.5 && Math.abs(deltaZ) < 25) {
        return { ev, la, spray, spin, ...sim, dist, deltaZ };
      }
    } else {
      if (dist > 62 && dist < 120 && Math.abs(sim.land.x) < 28) {
        return { ev, la, spray, spin, ...sim, dist, deltaZ };
      }
    }
  }
  const sim = simulateHit(43, 30, 0, 1.2);
  return { ev: 43, la: 30, spray: 0, spin: 1.2, ...sim, dist: sim.land.z, deltaZ: sim.land.z - START_POS.z };
}

const bannerTitle = document.getElementById('banner-title');
const bannerSub = document.getElementById('banner-sub');
const resultCard = document.getElementById('result-card');
const startWrap = document.getElementById('start-btn-wrap');
const quizControls = document.getElementById('quiz-controls');
const touchControls = document.getElementById('touch-controls');

function updateScoreUI() {
  document.getElementById('stat-ok').textContent = state.ok;
  document.getElementById('stat-total').textContent = state.total;
  document.getElementById('stat-streak').textContent = state.streak;
}

function resetPlayer() {
  player.pos.copy(START_POS);
  player.vel.set(0, 0, 0);
  player.diving = false;
  player.diveTimer = 0;
  camera.position.copy(player.pos);
  camera.lookAt(0, 2.2, 0);
}

function startPitch() {
  resultCard.style.display = 'none';
  startWrap.style.display = 'none';
  quizControls.style.display = 'none';
  resetPlayer();

  state.meta = generatePlayableBall();
  state.phase = 'PITCHING';
  state.pitchT = 0;
  state.flightT = 0;
  state.quizChoice = null;
  state.quizFrozen = false;
  trailPts.length = 0;
  trailGeo.setFromPoints([]);

  ballMesh.visible = true;
  ballMesh.position.set(0, 1.85, 18.44);
  ballShadow.visible = false;
  landingRing.visible = false;

  bannerTitle.textContent = '';
  bannerSub.textContent = '投球中...';
}

function launchBall() {
  const m = state.meta;
  const la = THREE.MathUtils.degToRad(m.la);
  const sp = THREE.MathUtils.degToRad(m.spray);
  state.ballPos.set(0, 1.05, 0.3);
  state.ballVel.set(
    m.ev * Math.cos(la) * Math.sin(sp),
    m.ev * Math.sin(la),
    m.ev * Math.cos(la) * Math.cos(sp)
  );
  AudioFX.crack(THREE.MathUtils.clamp((m.ev - 36) / 12, 0.55, 1.25));
  state.phase = 'IN_FLIGHT';
  ballShadow.visible = true;
  if (state.showMarker && state.mode === 'chase') {
    landingRing.position.set(m.land.x, 0.08, m.land.z);
    landingRing.visible = true;
  }
  bannerSub.textContent = state.mode === 'quiz' ? '看球！準備判斷前還是後...' : '';
}

function triggerDive() {
  if (player.diving) return;
  const dir = getMoveInput();
  if (dir.lengthSq() < 0.05) {
    dir.set(state.ballPos.x - player.pos.x, 0, state.ballPos.z - player.pos.z);
  }
  dir.y = 0;
  if (dir.lengthSq() > 0.001) dir.normalize();
  player.diving = true;
  player.diveTimer = 0.52;
  player.diveDir.copy(dir);
  AudioFX.tone(180, 0.08);
}

function submitQuiz(choice) {
  if (state.phase !== 'QUIZ_WAIT') return;
  state.quizChoice = choice;
  quizControls.style.display = 'none';
  bannerTitle.textContent = choice === 'front' ? '你選：往前衝！' : '你選：往後退！';
  bannerSub.textContent = '揭曉真實落點...';
  landingRing.position.set(state.meta.land.x, 0.08, state.meta.land.z);
  landingRing.visible = true;
  state.phase = 'IN_FLIGHT';
  state.quizFrozen = false;
}

function finishPlay(outcome, title, sub, color) {
  state.phase = 'RESULT';
  state.total++;
  if (outcome) {
    state.ok++;
    state.streak++;
  } else {
    state.streak = 0;
  }
  updateScoreUI();

  const m = state.meta;
  const kmh = (m.ev * 3.6).toFixed(1);
  const mph = (m.ev * 2.237).toFixed(1);
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-title').style.color = color;
  document.getElementById('result-sub').textContent = sub;
  document.getElementById('st-ev').textContent = `${kmh} km/h (${mph} mph)`;
  document.getElementById('st-la').textContent = `${m.la.toFixed(1)}°`;
  document.getElementById('st-dist').textContent = `${m.dist.toFixed(1)} m`;
  document.getElementById('st-hang').textContent = `${m.hang.toFixed(2)} s`;

  const dz = m.deltaZ;
  const dirText = dz < 0
    ? `站位前方 ${Math.abs(dz).toFixed(1)} 公尺（往前衝）`
    : `站位後方 ${Math.abs(dz).toFixed(1)} 公尺（往後退）`;
  document.getElementById('st-delta').textContent = dirText;

  bannerTitle.textContent = '';
  bannerSub.textContent = '';
  resultCard.style.display = 'block';
}

function getMoveInput() {
  let x = 0, z = 0;
  if (keys['KeyW'] || keys['ArrowUp']) z -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) z += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) x -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) x += 1;
  if (joy.active) {
    x += joy.dx;
    z += joy.dy;
  }
  const v = new THREE.Vector3(x, 0, z);
  if (v.length() > 1) v.normalize();
  return v;
}

const minimap = document.getElementById('minimap');
const mctx = minimap.getContext('2d');
function drawMinimap() {
  const w = minimap.width, h = minimap.height;
  mctx.clearRect(0, 0, w, h);
  const ox = w / 2, oy = h - 18, scale = 1.2;

  mctx.beginPath();
  mctx.moveTo(ox, oy);
  mctx.arc(ox, oy, 122 * scale, -Math.PI * 0.75, -Math.PI * 0.25);
  mctx.closePath();
  mctx.fillStyle = 'rgba(56, 142, 60, 0.45)';
  mctx.fill();
  mctx.strokeStyle = 'rgba(255,255,255,0.45)';
  mctx.lineWidth = 2;
  mctx.stroke();

  const px = ox - player.pos.x * scale;
  const pz = oy - player.pos.z * scale;
  mctx.fillStyle = '#29b6f6';
  mctx.beginPath();
  mctx.arc(px, pz, 5.5, 0, Math.PI * 2);
  mctx.fill();

  if (landingRing.visible && state.meta) {
    const lx = ox - state.meta.land.x * scale;
    const lz = oy - state.meta.land.z * scale;
    mctx.strokeStyle = '#ffeb3b';
    mctx.lineWidth = 2.5;
    mctx.beginPath();
    mctx.arc(lx, lz, 6, 0, Math.PI * 2);
    mctx.stroke();
  }

  if (state.phase === 'IN_FLIGHT' || state.phase === 'QUIZ_WAIT') {
    const bx = ox - state.ballPos.x * scale;
    const bz = oy - state.ballPos.z * scale;
    mctx.fillStyle = '#ffffff';
    mctx.beginPath();
    mctx.arc(bx, bz, 3.5, 0, Math.PI * 2);
    mctx.fill();
  }
}

document.getElementById('mode-chase').onclick = () => {
  state.mode = 'chase';
  document.getElementById('mode-chase').classList.add('active');
  document.getElementById('mode-quiz').classList.remove('active');
  touchControls.style.display = 'block';
  bannerTitle.textContent = '實戰追接模式';
  bannerSub.textContent = '靠視線與聲音判斷落點，跑位接殺飛球';
  resultCard.style.display = 'none';
  quizControls.style.display = 'none';
  startWrap.style.display = 'block';
  state.phase = 'IDLE';
  resetPlayer();
};

document.getElementById('mode-quiz').onclick = () => {
  state.mode = 'quiz';
  document.getElementById('mode-quiz').classList.add('active');
  document.getElementById('mode-chase').classList.remove('active');
  touchControls.style.display = 'none';
  bannerTitle.textContent = '這顆飛球，前？後？';
  bannerSub.textContent = '擊球後 1.2 秒瞬間判斷要往前衝還是往後退';
  resultCard.style.display = 'none';
  quizControls.style.display = 'none';
  startWrap.style.display = 'block';
  state.phase = 'IDLE';
  resetPlayer();
};

document.getElementById('toggle-marker').onclick = e => {
  state.showMarker = !state.showMarker;
  e.target.textContent = `落點：${state.showMarker ? '開' : '關'}`;
  e.target.classList.toggle('active', state.showMarker);
  if (state.phase === 'IN_FLIGHT' && state.mode === 'chase') {
    landingRing.visible = state.showMarker;
    if (state.showMarker) landingRing.position.set(state.meta.land.x, 0.08, state.meta.land.z);
  }
};

document.getElementById('btn-pitch').onclick = startPitch;
document.getElementById('btn-next').onclick = startPitch;
document.getElementById('btn-front').onclick = () => submitQuiz('front');
document.getElementById('btn-back').onclick = () => submitQuiz('back');

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const lookTarget = new THREE.Vector3(0, 2.2, 0);
let lastTime = performance.now();
let accum = 0;
const FIXED_DT = 1 / 120;

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (state.phase === 'PITCHING') {
    state.pitchT += dt;
    const p = Math.min(state.pitchT / 0.48, 1);
    ballMesh.position.set(0, 1.85 - p * 0.8, 18.44 * (1 - p) + 0.3);
    ballMesh.scale.setScalar(2.4);
    lookTarget.lerp(new THREE.Vector3(0, 1.6, 0), 0.15);
    camera.lookAt(lookTarget);
    if (p >= 1) launchBall();
  } else if (state.phase === 'IN_FLIGHT') {
    if (state.mode === 'chase') {
      if (player.diving) {
        player.diveTimer -= dt;
        const speed = 10.6 * Math.max(player.diveTimer / 0.52, 0.15);
        player.pos.addScaledVector(player.diveDir, speed * dt);
        player.pos.y = 0.72 + 0.55 * Math.sin((player.diveTimer / 0.52) * Math.PI);
        if (player.diveTimer <= 0) {
          player.diving = false;
          player.pos.y = 1.7;
        }
      } else {
        const input = getMoveInput();
        const maxSpeed = input.z > 0.3 ? 7.6 : 8.5;
        const targetVel = input.multiplyScalar(maxSpeed);
        player.vel.lerp(targetVel, Math.min(1, dt * 8.5));
        player.pos.addScaledVector(player.vel, dt);
        player.pos.y = 1.7 + Math.sin(now * 0.018) * (player.vel.length() * 0.012);
      }
      const r = Math.hypot(player.pos.x, player.pos.z);
      if (r > wallRadius - 1.2) {
        player.pos.x *= (wallRadius - 1.2) / r;
        player.pos.z *= (wallRadius - 1.2) / r;
      }
      if (player.pos.z < 36) player.pos.z = 36;
    }

    accum += dt;
    while (accum >= FIXED_DT && state.phase === 'IN_FLIGHT') {
      stepPhysics(state.ballPos, state.ballVel, state.meta.spin, FIXED_DT);
      state.flightT += FIXED_DT;
      accum -= FIXED_DT;

      if (state.mode === 'quiz' && !state.quizChoice && state.flightT >= 1.15) {
        state.phase = 'QUIZ_WAIT';
        quizControls.style.display = 'flex';
        bannerTitle.textContent = '這顆飛球，前？後？';
        bannerSub.textContent = '立刻選擇！';
        break;
      }

      if (state.mode === 'chase') {
        const horiz = Math.hypot(state.ballPos.x - player.pos.x, state.ballPos.z - player.pos.z);
        const reach = player.diving ? 2.85 : 2.15;
        if (horiz <= reach && state.ballPos.y <= 2.65 && state.ballPos.y >= 0.15 && state.ballVel.y < 0) {
          AudioFX.glovePop();
          AudioFX.tone(660, 0.22);
          const msg = player.diving ? '美技撲接接殺！' : '穩穩接殺出局！';
          const sub = player.diving ? '全場起立鼓掌的五星級守備！' : `距離落點偏差 ${horiz.toFixed(2)} 公尺`;
          finishPlay(true, msg, sub, '#66bb6a');
          break;
        }
      }

      if (state.ballPos.y <= 0.11) {
        state.ballPos.y = 0.11;
        AudioFX.thud();
        if (state.mode === 'quiz') {
          const correct = state.meta.deltaZ < 0 ? 'front' : 'back';
          const isRight = state.quizChoice === correct;
          if (isRight) AudioFX.tone(720, 0.22);
          else AudioFX.tone(180, 0.28);
          finishPlay(
            isRight,
            isRight ? '判斷正確！' : '判斷失誤！',
            `正確方向：${correct === 'front' ? '往前衝（前）' : '往後退（後）'}`,
            isRight ? '#66bb6a' : '#ef5350'
          );
        } else {
          const missDist = Math.hypot(state.ballPos.x - player.pos.x, state.ballPos.z - player.pos.z);
          const overHead = state.ballPos.z > player.pos.z + 2;
          finishPlay(
            false,
            overHead ? '越過頭頂長打！' : '落地安打！',
            `球落地時距離你 ${missDist.toFixed(1)} 公尺`,
            '#ef5350'
          );
        }
        break;
      }
    }

    ballMesh.position.copy(state.ballPos);
    const camDist = camera.position.distanceTo(state.ballPos);
    const visScale = THREE.MathUtils.clamp(camDist * 0.026, 1.0, 2.8);
    ballMesh.scale.setScalar(visScale);

    ballShadow.position.set(state.ballPos.x, 0.07, state.ballPos.z);
    const shScale = THREE.MathUtils.clamp(1.6 - state.ballPos.y * 0.035, 0.35, 1.5);
    ballShadow.scale.setScalar(shScale);

    if (state.mode === 'quiz' && state.quizChoice) {
      trailPts.push(state.ballPos.clone());
      trailGeo.setFromPoints(trailPts);
    }

    camera.position.copy(player.pos);
    lookTarget.lerp(state.ballPos, 0.22);
    camera.lookAt(lookTarget);
  } else if (state.phase === 'QUIZ_WAIT') {
    camera.lookAt(lookTarget);
  }

  drawMinimap();
  renderer.render(scene, camera);
}

resetPlayer();
requestAnimationFrame(animate);
</script>
