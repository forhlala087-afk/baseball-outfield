<script>
  (() => {
    const c = document.createElement('canvas');
    c.width = c.height = 512;
    const g = c.getContext('2d');
    g.fillStyle = '#14452f';
    g.fillRect(0, 0, 512, 512);
    g.font = '320px sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText('⚾', 256, 276);
    const icon = c.toDataURL('image/png');
    const addLink = (rel, href) => {
      const l = document.createElement('link');
      l.rel = rel; l.href = href;
      document.head.appendChild(l);
    };
    addLink('icon', icon);
    addLink('apple-touch-icon', icon);
    const manifest = {
      name: '外野飛球 3D',
      short_name: '外野飛球',
      display: 'standalone',
      background_color: '#0b1622',
      theme_color: '#0b1622',
      start_url: location.href,
      icons: [{ src: icon, sizes: '512x512', type: 'image/png' }]
    };
    addLink('manifest', 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest)));
  })();
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1622; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; color: #fff; touch-action: none; user-select: none; }
  #canvas-wrap { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  #hud-top {

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const AudioFX = (() => {
  let ctx = null;
  function ensure() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
  }
  function crack(power = 1) {
    ensure();
    const now = ctx.currentTime;
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.14, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.018));
    const noise = ctx.createBufferSource();
    noise.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass'; filter.frequency.value = 1400 + power * 500; filter.Q.value = 1.4;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.85 * power, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
    noise.connect(filter).connect(gain).connect(ctx.destination);
    noise.start(now);
    const osc = ctx.createOscillator(), og = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(520 + power * 180, now);
    osc.frequency.exponentialRampToValueAtTime(140, now + 0.06);
    og.gain.setValueAtTime(0.45 * power, now);
    og.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
    osc.connect(og).connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.07);
  }
  function glovePop() {
    ensure();
    const now = ctx.currentTime, osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(210, now);
    osc.frequency.exponentialRampToValueAtTime(55, now + 0.09);
    g.gain.setValueAtTime(0.7, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc.connect(g).connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.1);
  }
  function thud() {
    ensure();
    const now = ctx.currentTime, osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(110, now);
    osc.frequency.exponentialRampToValueAtTime(38, now + 0.12);
    g.gain.setValueAtTime(0.48, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
    osc.connect(g).connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.13);
  }
  function tone(freq, dur = 0.15) {
    ensure();
    const now = ctx.currentTime, osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(0.2, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(g).connect(ctx.destination);
    osc.start(now); osc.stop(now + dur);
  }
  function cheer() {
    tone(523, 0.14);
    setTimeout(() => tone(659, 0.14), 90);
    setTimeout(() => tone(784, 0.25), 180);
  }
  return { crack, glovePop, thud, tone, cheer };
})();

const wrap = document.getElementById('canvas-wrap');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x4b86c6);
scene.fog = new THREE.FogExp2(0x6da1d4, 0.0021);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
wrap.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xdff2ff, 0x2e5a27, 0.88));
const sun = new THREE.DirectionalLight(0xfff8e7, 0.9);
sun.position.set(50, 90, -30);
scene.add(sun);

function createGrassTexture() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const g = c.getContext('2d');
  for (let i = 0; i < 16; i++) {
    g.fillStyle = i % 2 === 0 ? '#2f7a32' : '#388a3a';
    g.fillRect(0, i * 32, 512, 32);
  }
  for (let i = 0; i < 5000; i++) {
    g.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.04)';
    g.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(16, 16);
  return tex;
}

function createCrowdTexture() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#243447'; g.fillRect(0, 0, 512, 128);
  const colors = ['#cfd8dc', '#90caf9', '#ef9a9a', '#ffe082', '#ffffff', '#546e7a', '#1e88e5'];
  for (let y = 6; y < 124; y += 8) {
    g.fillStyle = '#1b2838'; g.fillRect(0, y + 4, 512, 2);
    for (let x = 2; x < 512; x += 6) {
      if (Math.random() > 0.25) {
        g.fillStyle = colors[Math.floor(Math.random() * colors.length)];
        g.fillRect(x, y, 4, 5);
      }
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping; tex.repeat.set(14, 1);
  return tex;
}

const fieldMesh = new THREE.Mesh(
  new THREE.CircleGeometry(155, 64),
  new THREE.MeshLambertMaterial({ map: createGrassTexture() })
);
fieldMesh.rotation.x = -Math.PI / 2;
scene.add(fieldMesh);

const warningTrack = new THREE.Mesh(
  new THREE.RingGeometry(117, 123, 64, 1, Math.PI * 0.2, Math.PI * 0.6),
  new THREE.MeshLambertMaterial({ color: 0x8d5b3c })
);
warningTrack.rotation.x = -Math.PI / 2; warningTrack.rotation.z = -Math.PI / 2;
warningTrack.position.y = 0.02;
scene.add(warningTrack);

const infieldDirt = new THREE.Mesh(
  new THREE.CircleGeometry(30, 48),
  new THREE.MeshLambertMaterial({ color: 0xb68657 })
);
infieldDirt.rotation.x = -Math.PI / 2; infieldDirt.position.set(0, 0.03, 19);
scene.add(infieldDirt);

const infieldGrass = new THREE.Mesh(
  new THREE.PlaneGeometry(25, 25),
  new THREE.MeshLambertMaterial({ color: 0x358237 })
);
infieldGrass.rotation.x = -Math.PI / 2; infieldGrass.rotation.z = Math.PI / 4;
infieldGrass.position.set(0, 0.05, 19.4);
scene.add(infieldGrass);

const mound = new THREE.Mesh(
  new THREE.CylinderGeometry(2.2, 2.7, 0.25, 24),
  new THREE.MeshLambertMaterial({ color: 0xa87648 })
);
mound.position.set(0, 0.12, 18.44);
scene.add(mound);

const joy = { active: false, dx: 0, dy: 0, id: null };
const joyZone = document.getElementById('joy-zone');
const joyKnob = document.getElementById('joy-knob');

function updateJoy(cx, cy) {
  const rect = joyZone.getBoundingClientRect();
  const maxR = rect.width * 0.38;
  let dx = cx - (rect.left + rect.width / 2);
  let dy = cy - (rect.top + rect.height / 2);
  const len = Math.hypot(dx, dy);
  if (len > maxR) { dx = dx / len * maxR; dy = dy / len * maxR; }
  joy.dx = dx / maxR; joy.dy = dy / maxR;
  joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
}
joyZone.addEventListener('pointerdown', e => { joy.active = true; joy.id = e.pointerId; joyZone.setPointerCapture(e.pointerId); updateJoy(e.clientX, e.clientY); });
joyZone.addEventListener('pointermove', e => { if (joy.active && e.pointerId === joy.id) updateJoy(e.clientX, e.clientY); });
function endJoy() { joy.active = false; joy.dx = 0; joy.dy = 0; joyKnob.style.transform = 'translate(0px, 0px)'; }
joyZone.addEventListener('pointerup', endJoy);
joyZone.addEventListener('pointercancel', endJoy);

function stepPhysics(pos, vel, spin, dt) {
  const speed = vel.length();
  const drag = 0.0046 * speed;
  vel.x -= drag * vel.x * dt;
  vel.y -= (9.81 + drag * vel.y) * dt;
  vel.z -= drag * vel.z * dt;
  vel.y += spin * speed * 0.0014 * dt;
  pos.addScaledVector(vel, dt);
}

function simulateHit(ev, laDeg, sprayDeg, spin) {
  const la = THREE.MathUtils.degToRad(laDeg);
  const sp = THREE.MathUtils.degToRad(sprayDeg);
  const pos = new THREE.Vector3(0, 1.05, 0.3);
  const vel = new THREE.Vector3(ev * Math.cos(la) * Math.sin(sp), ev * Math.sin(la), ev * Math.cos(la) * Math.cos(sp));
  const dt = 1 / 120;
  let t = 0, maxH = 0;
  while (pos.y > 0.1 && t < 10) {
    stepPhysics(pos, vel, spin, dt);
    if (pos.y > maxH) maxH = pos.y;
    t += dt;
  }
  return { land: pos.clone(), hang: t, maxH };
}

function generatePlayableBall(narrow = false) {
  for (let tries = 0; tries < 80; tries++) {
    const ev = 38 + Math.random() * 10.5;
    const la = 19 + Math.random() * 28;
    const spray = narrow ? (Math.random() * 10 - 5) : (Math.random() * 24 - 12);
    const spin = 0.8 + Math.random() * 1.1;
    const sim = simulateHit(ev, la, spray, spin);
    const dist = Math.hypot(sim.land.x, sim.land.z);
    const deltaZ = sim.land.z - START_POS.z;
    if (narrow) {
      if (dist > 64 && dist < 118 && Math.abs(deltaZ) > 5.5 && Math.abs(deltaZ) < 25) return { ev, la, spray, spin, ...sim, dist, deltaZ };
    } else {
      if (dist > 62 && dist < 120 && Math.abs(sim.land.x) < 28) return { ev, la, spray, spin, ...sim, dist, deltaZ };
    }
  }
  const sim = simulateHit(43, 30, 0, 1.2);
  return { ev: 43, la: 30, spray: 0, spin: 1.2, ...sim, dist: sim.land.z, deltaZ: sim.land.z - START_POS.z };
}

function getMoveInput() {
  let x = 0, z = 0;
  if (keys['KeyW'] || keys['ArrowUp']) z -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) z += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) x -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) x += 1;
  if (joy.active) { x += joy.dx; z += joy.dy; }
  const v = new THREE.Vector3(x, 0, z);
  if (v.length() > 1) v.normalize();
  return v;
}

function triggerDive() {
  if (player.diving) return;
  const dir = getMoveInput();
  if (dir.lengthSq() < 0.05) dir.set(state.ballPos.x - player.pos.x, 0, state.ballPos.z - player.pos.z);
  dir.y = 0;
  if (dir.lengthSq() > 0.001) dir.normalize();
  player.diving = true; player.diveTimer = 0.52; player.diveDir.copy(dir);
  AudioFX.tone(180, 0.08);
}

function handleDefenseAction() {
  if (!game.play) return;
  if (player.hasBall) {
    throwBallFromCF();
  } else if (game.play.landed && !game.play.fielded) {
    const d = Math.hypot(state.ballPos.x - player.pos.x, state.ballPos.z - player.pos.z);
    if (d < 4.0) pickUpBallCF();
  } else if (!game.play.landed) {
    triggerDive();
  }
}

function pickUpBallCF() {
  if (!game.play || game.play.fielded) return;
  game.play.fielded = true;
  player.hasBall = true;
  AudioFX.glovePop();
  setBanner('撿到球了！', '快按「回傳 / Space」把球傳回內野！');
  updateDiveBtnState();
}

function getBestThrowTargetBase() {
  let leadTarget = 2;
  liveRunners.forEach(r => {
    if (!r.out && !r.scored) {
      if (r.baseTo > leadTarget) leadTarget = r.baseTo;
    }
  });
  return Math.min(4, Math.max(2, leadTarget));
}

function throwBallFromCF() {
  if (!player.hasBall || !game.play) return;
  player.hasBall = false;
  const targetBase = getBestThrowTargetBase();
  const targetPos = BASES[targetBase % 4].clone();
  targetPos.y = 1.2;
  game.play.throwActive = true;
  game.play.throwFrom = player.pos.clone();
  game.play.throwFrom.y = 1.6;
  game.play.throwTo = targetPos;
  game.play.throwTargetBase = targetBase;
  game.play.throwT = 0;
  game.play.throwDur = Math.max(0.55, game.play.throwFrom.distanceTo(targetPos) / 36);
  AudioFX.tone(520, 0.1);
  const bName = targetBase === 4 ? '本壘' : (targetBase === 3 ? '三壘' : '二壘');
  setBanner(`雷射肩回傳${bName}！`, '');
  updateDiveBtnState();
}

function nextBatter() {
  game.balls = 0; game.strikes = 0;
  if (game.half === 'top') game.awayOrder = (game.awayOrder % 9) + 1;
  else game.homeOrder = (game.homeOrder % 9) + 1;
}

function addOuts(count, msg) {
  game.outs += count;
  setTicker(msg);
  if (game.outs >= 3) {
    game.outs = 0; game.balls = 0; game.strikes = 0;
    game.bases = [false, false, false];
    game.playerBase = 0;
    clearLiveRunners();
    if (game.half === 'top') game.awayOrder = (game.awayOrder % 9) + 1;
    else game.homeOrder = (game.homeOrder % 9) + 1;

    if (game.half === 'bottom' && game.inning >= 9) { endFullGame(); return true; }
    if (game.half === 'top') {
      game.half = 'bottom';
      if (game.inning === 9 && game.homeScore > game.awayScore) { endFullGame(); return true; }
      setBanner(`${game.inning}局下半`, '三出局攻守交換｜換我方進攻！');
    } else {
      game.half = 'top';
      game.inning++;
      setBanner(`${game.inning}局上半`, '三出局攻守交換｜前往中外野守備！');
    }
    game.subPhase = 'CHANGE_SIDES';
    game.timer = 2.2;
    hideAllActionUI();
    updateGameUI();
    return true;
  }
  return false;
}
function addOut(msg) { return addOuts(1, msg); }

function endFullGame() {
  game.active = false; game.subPhase = 'OVER';
  hideAllActionUI(); clearLiveRunners();
  const win = game.homeScore > game.awayScore;
  const tie = game.homeScore === game.awayScore;
  document.getElementById('result-title').textContent = win ? '比賽勝利！' : (tie ? '握手言和' : '惜敗收場');
  document.getElementById('result-title').style.color = win ? '#66bb6a' : (tie ? '#ffca28' : '#ef5350');
  document.getElementById('result-sub').textContent = `終場比數 客隊 ${game.awayScore} : ${game.homeScore} 我方`;
  const s = game.stats;
  document.getElementById('st-ev').textContent = `${s.ab} 打數 ${s.h} 安打`;
  document.getElementById('st-la').textContent = `${s.hr} 支全壘打`;
  document.getElementById('st-dist').textContent = `${s.rbi} 打點 / ${s.bb} 保送`;
  document.getElementById('st-hang').textContent = `${s.po} 次接殺`;
  document.getElementById('st-delta').textContent = `打擊率 ${s.ab > 0 ? (s.h / s.ab).toFixed(3) : '.000'}`;
  document.getElementById('btn-next').textContent = '再打一場（Space）';
  resultCard.style.display = 'block';
  updateGameUI();
}

function hideAllActionUI() {
  actionBar.style.display = 'none';
  btnSwing.style.display = 'none';
  btnSteal.style.display = 'none';
  btnRun.style.display = 'none';
  touchControls.style.display = 'none';
  strikeZoneMesh.visible = false;
  landingRing.visible = false;
}

function startGameMode() {
  resultCard.style.display = 'none'; startWrap.style.display = 'none';
  game.active = true;
  game.inning = 1; game.half = 'top';
  game.awayScore = 0; game.homeScore = 0;
  game.balls = 0; game.strikes = 0; game.outs = 0;
  game.bases = [false, false, false];
  game.awayOrder = 1; game.homeOrder = 1; game.playerBase = 0;
  game.stats = { ab: 0, h: 0, hr: 0, bb: 0, rbi: 0, po: 0 };
  clearLiveRunners();
  ticker.style.display = 'block';
  setBanner('1局上半', '先發 3 棒中外野手，就守備位置！');
  game.subPhase = 'CHANGE_SIDES';
  game.timer = 1.6;
  updateGameUI();
}

function enterCurrentRole() {
  hideAllActionUI();
  clearLiveRunners();
  game.play = null;
  player.hasBall = false;
  ballMesh.visible = false; ballShadow.visible = false;
  batterMesh.visible = true;
  setBanner('', '');
  updateDiveBtnState();

  if (game.half === 'top') {
    resetFielders(true, 0x1565c0);
    resetPlayerCF();
    touchControls.style.display = 'block';
    game.subPhase = 'DEF_WAIT';
    game.timer = 1.35 / state.speed;
    setTicker(`客隊 ${game.awayOrder} 棒打擊中｜你在中外野待命`);
  } else {
    resetFielders(false, 0xc62828);
    if (game.playerBase > 0) {
      const bPos = BASES[game.playerBase];
      camera.position.set(bPos.x, 1.65, bPos.z);
      lookTarget.set(0, 1.4, 10);
      camera.lookAt(lookTarget);
      actionBar.style.display = 'flex';
      const canSteal = game.playerBase < 3 && !game.bases[game.playerBase];
      btnSteal.style.display = canSteal ? 'block' : 'none';
      game.subPhase = 'OFF_SIM_WAIT';
      game.timer = 1.5 / state.speed;
      setTicker(`你在${['', '一', '二', '三'][game.playerBase]}壘｜隊友 ${game.homeOrder} 棒打擊中`);
    } else if (game.homeOrder === 3) {
      batterMesh.visible = false;
      camera.position.copy(BATTER_POS);
      lookTarget.set(0, 1.1, 18.44);
      camera.lookAt(lookTarget);
      strikeZoneMesh.visible = true;
      actionBar.style.display = 'flex';
      btnSwing.style.display = 'block';
      game.subPhase = 'BAT_WAIT';
      game.timer = 1.25;
      setTicker('輪到你了（第 3 棒）！盯緊投手球路準備揮棒');
    } else {
      const isOnDeck = game.homeOrder === 2;
      camera.position.copy(isOnDeck ? ONDECK_POS : DUGOUT_POS);
      lookTarget.set(0, 1.4, 15);
      camera.lookAt(lookTarget);
      game.subPhase = 'OFF_SIM_WAIT';
      game.timer = 1.35 / state.speed;
      setTicker(isOnDeck ? '打擊準備區熱身中（下一棒就是你！）' : `休息室觀戰｜我方 ${game.homeOrder} 棒打擊中`);
    }
  }
  updateGameUI();
}

function pickPitchType() {
  const pt = PITCH_TYPES[Math.floor(Math.random() * PITCH_TYPES.length)];
  const kmh = Math.round(pt.minKmh + Math.random() * (pt.maxKmh - pt.minKmh));
  return { pt, kmh };
}

function launchSimPitch(isDefense) {
  game.subPhase = isDefense ? 'DEF_PITCH' : 'OFF_SIM_PITCH';
  state.pitchT = 0;
  const picked = pickPitchType();
  game.pitchType = picked.pt;
  game.pitchKmh = picked.kmh;
  ballMesh.visible = true;
  ballMesh.position.set(0, 1.85, 18.44);

  const r = Math.random();
  if (r < 0.24) game.simResult = 'BALL';
  else if (r < 0.42) game.simResult = 'STRIKE_LOOK';
  else if (r < 0.54) game.simResult = 'STRIKE_SWING';
  else if (r < 0.62) game.simResult = 'FOUL_FLY';
  else if (r < 0.69) game.simResult = 'FOUL_GROUND';
  else game.simResult = 'IN_PLAY';
}

function generateBattedBallParams() {
  const r = Math.random();
  if (r < 0.34) {
    // 滾地球（內野或穿越）
    return { ev: 30 + Math.random() * 14, la: 2 + Math.random() * 7, spray: Math.random() * 74 - 37, spin: 0.3 };
  } else if (r < 0.60) {
    // 平飛球 / 淺外野安打
    return { ev: 36 + Math.random() * 10, la: 11 + Math.random() * 10, spray: Math.random() * 70 - 35, spin: 0.9 };
  } else if (r < 0.93) {
    // 外野高飛球（左／中／右外野）
    return { ev: 38 + Math.random() * 10, la: 22 + Math.random() * 22, spray: Math.random() * 68 - 34, spin: 1.1 };
  } else {
    // 全壘打級強襲球
    return { ev: 47.5 + Math.random() * 5, la: 25 + Math.random() * 10, spray: Math.random() * 64 - 32, spin: 1.2 };
  }
}

function spawnLiveRunners(isMeBatting) {
  clearLiveRunners();
  const color = game.half === 'top' ? 0xc62828 : 0xffca28;
  for (let i = 2; i >= 0; i--) {
    if (game.bases[i]) {
      const isMe = (game.half === 'bottom' && game.playerBase === i + 1);
      const m = createPlayerSilhouette(BASES[i + 1].x, BASES[i + 1].z, color);
      if (isMe) m.visible = false;
      liveRunners.push({
        mesh: m, baseFrom: i + 1, baseTo: i + 2, progress: 0,
        speed: 0.25 + Math.random() * 0.03, isBatter: false, isMe, out: false, scored: false, stopped: false
      });
    }
  }
  const bm = createPlayerSilhouette(0, 0, color);
  if (isMeBatting) bm.visible = false;
  liveRunners.push({
    mesh: bm, baseFrom: 0, baseTo: 1, progress: 0,
    speed: 0.26, isBatter: true, isMe: isMeBatting, out: false, scored: false, stopped: false
  });
  syncStaticRunners();
}

function startLiveBallInPlay(ev, la, spray, spin, isMeBatting = false) {
  const sim = simulateHit(ev, la, spray, spin);
  launchVisualBall(ev, la, spray, spin);
  state.meta = { ev, la, spray, spin, ...sim };
  AudioFX.crack(THREE.MathUtils.clamp((ev - 30) / 16, 0.65, 1.3));

  if (game.half === 'top' && state.showMarker && la > 12) {
    landingRing.position.set(sim.land.x, 0.08, sim.land.z);
    landingRing.visible = true;
  }

  // 我方三壘有人且 < 2出局，若隊友打高飛球，切到互動 Tag-up
  if (game.half === 'bottom' && !isMeBatting && game.playerBase === 3 && game.outs < 2 && la > 20 && Math.hypot(sim.land.x, sim.land.z) > 62) {
    startInteractiveTagUp(spray);
    return;
  }

  spawnLiveRunners(isMeBatting);
  if (game.half === 'bottom' && game.playerBase > 0) {
    btnSteal.style.display = 'none';
    btnRun.style.display = 'block';
    holdRun = false;
  }

  game.play = {
    isMeBatting,
    ev, la, spray,
    landed: false,
    fielded: false,
    fielderId: null,
    isHR: false,
    hrTimer: 0,
    throwActive: false,
    throwFrom: null,
    throwTo: null,
    throwTargetBase: 1,
    throwT: 0,
    throwDur: 0.7,
    dpSecondThrow: false,
    elapsed: 0,
    resolved: false
  };
  game.subPhase = 'LIVE_PLAY';
  if (game.half === 'top' && Math.abs(spray) < 16 && Math.hypot(sim.land.x, sim.land.z) > 55) {
    setTicker('⚡ 打向中外野！快追球！');
  } else {
    setTicker(la < 11 ? '滾地球打進場內！' : '高飛球打向空中！');
  }
  updateDiveBtnState();
}

function resolveSimPitch(isDefense) {
  const res = game.simResult;
  const pInfo = `${game.pitchType.name} ${game.pitchKmh}km/h｜`;

  if (res === 'BALL') {
    AudioFX.glovePop();
    game.balls++;
    if (game.balls >= 4) {
      setTicker(`${pInfo}四壞球保送！打者上一壘`);
      applyWalk(false);
      nextBatter();
    } else setTicker(`${pInfo}壞球（${game.balls}壞${game.strikes}好）`);
    enterAfterPause(1.0);
  } else if (res === 'STRIKE_LOOK' || res === 'STRIKE_SWING') {
    AudioFX.glovePop();
    game.strikes++;
    const label = res === 'STRIKE_LOOK' ? '好球進壘' : '揮棒落空';
    if (game.strikes >= 3) {
      AudioFX.tone(320, 0.2);
      if (!addOut(`${pInfo}${label}！三振出局！`)) { nextBatter(); enterAfterPause(1.1); }
    } else {
      setTicker(`${pInfo}${label}（${game.balls}壞${game.strikes}好）`);
      enterAfterPause(0.95);
    }
  } else if (res === 'FOUL_FLY' || res === 'FOUL_GROUND') {
    AudioFX.crack(0.7);
    if (game.strikes < 2) game.strikes++;
    const isGr = res === 'FOUL_GROUND';
    setTicker(`${pInfo}${isGr ? '滾地界外' : '界外飛球'}（${game.balls}壞${game.strikes}好）`);
    launchVisualBall(isGr ? 30 : 32, isGr ? 4 : 34, (Math.random() > 0.5 ? 1 : -1) * (54 + Math.random() * 18), 0.5);
    game.subPhase = 'WATCH_FOUL';
    game.timer = 1.35 / state.speed;
  } else {
    const p = generateBattedBallParams();
    startLiveBallInPlay(p.ev, p.la, p.spray, p.spin, false);
  }
  updateGameUI();
}

function applyWalk(isMeBatting) {
  let scored = 0;
  if (game.bases[0] && game.bases[1] && game.bases[2]) {
    scored++;
    if (game.half === 'bottom' && game.playerBase === 3) game.playerBase = 0;
  }
  if (game.bases[0] && game.bases[1]) {
    game.bases[2] = true;
    if (game.half === 'bottom' && game.playerBase === 2) game.playerBase = 3;
  }
  if (game.bases[0]) {
    game.bases[1] = true;
    if (game.half === 'bottom' && game.playerBase === 1) game.playerBase = 2;
  }
  game.bases[0] = true;
  if (isMeBatting) game.playerBase = 1;
  addRuns(scored);
  if (isMeBatting) game.stats.rbi += scored;
}

function launchVisualBall(ev, laDeg, sprayDeg, spin) {
  const la = THREE.MathUtils.degToRad(laDeg);
  const sp = THREE.MathUtils.degToRad(sprayDeg);
  state.ballPos.set(0, 1.05, 0.3);
  state.ballVel.set(ev * Math.cos(la) * Math.sin(sp), ev * Math.sin(la), ev * Math.cos(la) * Math.cos(sp));
  ballMesh.visible = true;
  ballShadow.visible = true;
}

function enterAfterPause(sec) {
  game.subPhase = 'PAUSE_NEXT';
  game.timer = sec / state.speed;
  updateGameUI();
}

function updateLivePlay(dt, now) {
  const pl = game.play;
  if (!pl) return;
  pl.elapsed += dt;

  if (game.half === 'top') updateCFMovement(dt, now);

  // 1. 全壘打動畫：一路飛出牆外
  if (pl.isHR) {
    stepPhysics(state.ballPos, state.ballVel, state.meta.spin, dt);
    ballMesh.position.copy(state.ballPos);
    ballMesh.scale.setScalar(THREE.MathUtils.clamp(camera.position.distanceTo(state.ballPos) * 0.025, 1.0, 2.8));
    lookTarget.lerp(state.ballPos, 0.2);
    camera.lookAt(lookTarget);
    pl.hrTimer -= dt;
    if (pl.hrTimer <= 0) finishLivePlayHR();
    return;
  }

  // 2. 更新球的位置（未撿起且未回傳時）
  if (!pl.fielded && !pl.throwActive) {
    stepPhysics(state.ballPos, state.ballVel, state.meta.spin, dt);

    // 檢查全壘打
    const distFromHome = Math.hypot(state.ballPos.x, state.ballPos.z);
    if (!pl.landed && distFromHome >= wallRadius && state.ballPos.y > 3.1 && Math.abs(Math.atan2(state.ballPos.x, state.ballPos.z)) < Math.PI * 0.25) {
      pl.isHR = true;
      pl.hrTimer = 1.65;
      AudioFX.cheer();
      setBanner('HOME RUN!!', `飛出全壘打牆！飛行距離 ${Math.round(distFromHome + 10)} 公尺`);
      setTicker(pl.isMeBatting ? '你轟出特大號全壘打！' : `${game.half === 'top' ? '客隊' : '隊友'}轟出全壘打！`);
      return;
    }

    // 撞牆反彈
    if (distFromHome >= wallRadius - 0.5 && state.ballPos.y <= 3.1) {
      const nx = state.ballPos.x / distFromHome, nz = state.ballPos.z / distFromHome;
      state.ballPos.x = nx * (wallRadius - 0.6);
      state.ballPos.z = nz * (wallRadius - 0.6);
      state.ballVel.x *= -0.45;
      state.ballVel.z *= -0.45;
      pl.landed = true;
      AudioFX.thud();
      updateDiveBtnState();
    }

    // 落地與滾動彈跳
    if (state.ballPos.y <= 0.11) {
      state.ballPos.y = 0.11;
      if (!pl.landed) {
        pl.landed = true;
        AudioFX.thud();
        updateDiveBtnState();
      }
      if (Math.abs(state.ballVel.y) > 1.2) {
        state.ballVel.y = Math.abs(state.ballVel.y) * 0.42;
        state.ballVel.x *= 0.86;
        state.ballVel.z *= 0.86;
      } else {
        state.ballVel.y = 0;
        const fric = Math.pow(0.55, dt);
        state.ballVel.x *= fric;
        state.ballVel.z *= fric;
      }
    }

    ballMesh.position.copy(state.ballPos);
    ballShadow.position.set(state.ballPos.x, 0.07, state.ballPos.z);
    ballMesh.scale.setScalar(THREE.MathUtils.clamp(camera.position.distanceTo(state.ballPos) * 0.026, 1.0, 2.8));

    // 3. 玩家（中外野）接殺或自動踩球撿起
    if (game.half === 'top') {
      const horiz = Math.hypot(state.ballPos.x - player.pos.x, state.ballPos.z - player.pos.z);
      if (!pl.landed && horiz <= (player.diving ? 2.85 : 2.15) && state.ballPos.y <= 2.65 && state.ballPos.y >= 0.15 && state.ballVel.y < 0) {
        handleFlyOut('CF', true);
        return;
      }
      if (pl.landed && horiz <= 2.4) {
        pickUpBallCF();
      }
    }

    // 4. AI 守備員移動與攔截／接殺
    fielders.forEach(f => {
      if (!f.mesh.visible || pl.fielded) return;
      const target = !pl.landed && f.type === 'OF' ? state.meta.land : state.ballPos;
      const dx = target.x - f.pos.x, dz = target.z - f.pos.z;
      const d = Math.hypot(dx, dz);
      const maxRange = f.type === 'IF' ? 16 : 36;
      if (Math.hypot(target.x - f.home.x, target.z - f.home.z) < maxRange && d > 0.2) {
        const step = Math.min(d, f.speed * dt);
        f.pos.x += (dx / d) * step;
        f.pos.z += (dz / d) * step;
        f.mesh.position.set(f.pos.x, 0, f.pos.z);
      }

      const bDist = Math.hypot(state.ballPos.x - f.pos.x, state.ballPos.z - f.pos.z);
      if (!pl.landed && bDist <= f.reach && state.ballPos.y <= 2.6 && state.ballPos.y >= 0.15 && state.ballVel.y < 0) {
        handleFlyOut(f.id, false);
      } else if (pl.landed && bDist <= (f.type === 'IF' ? 1.85 : 2.2) && state.ballPos.y < 1.6) {
        handleAIFieldGroundBall(f);
      }
    });
  } else if (player.hasBall) {
    // 球在玩家手上
    ballMesh.position.set(player.pos.x, player.pos.y - 0.25, player.pos.z - 0.4);
  } else if (pl.throwActive) {
    // 回傳球飛行中
    pl.throwT += dt;
    const p = Math.min(1, pl.throwT / pl.throwDur);
    ballMesh.position.lerpVectors(pl.throwFrom, pl.throwTo, p);
    ballMesh.position.y += Math.sin(p * Math.PI) * 1.4;
    ballShadow.position.set(ballMesh.position.x, 0.07, ballMesh.position.z);
    if (p >= 1) {
      AudioFX.glovePop();
      resolveThrowArrival();
      return;
    }
  }

  // 5. 更新所有 3D 跑壘員
  let anyMoving = false;
  liveRunners.forEach(r => {
    if (r.out || r.scored || r.stopped) return;
    if (r.isMe && game.half === 'bottom' && !pl.isMeBatting) {
      const spd = holdRun ? 0.34 : 0.02;
      r.progress += spd * dt;
      const cur = new THREE.Vector3().lerpVectors(BASES[r.baseFrom % 4], BASES[r.baseTo % 4], Math.min(1, r.progress));
      cur.y = 1.65 + (holdRun ? Math.sin(now * 0.022) * 0.08 : 0);
      camera.position.copy(cur);
      lookTarget.lerp(BASES[r.baseTo % 4].clone().setY(1.2), 0.18);
      camera.lookAt(lookTarget);
    } else {
      r.progress += r.speed * dt;
      const cur = new THREE.Vector3().lerpVectors(BASES[r.baseFrom % 4], BASES[r.baseTo % 4], Math.min(1, r.progress));
      cur.y = Math.abs(Math.sin(now * 0.018)) * 0.14;
      r.mesh.position.copy(cur);
    }
    anyMoving = true;

    if (r.progress >= 1) {
      r.baseFrom = r.baseTo;
      r.progress = 0;
      if (r.baseFrom >= 4) {
        r.scored = true;
        r.mesh.visible = false;
        addRuns(1);
        if (pl.isMeBatting) game.stats.rbi++;
        AudioFX.tone(660, 0.15);
      } else {
        // 決定要不要繼續往下一個壘包衝（球還沒被處理好就繼續衝！）
        const ballDeep = state.ballPos.z > 55 && !pl.fielded && !pl.throwActive;
        const canStretch = (r.isMe && holdRun) || (!r.isMe && ballDeep && r.baseFrom < 4);
        if (canStretch) {
          r.baseTo = r.baseFrom + 1;
        } else {
          r.stopped = true;
          r.mesh.position.copy(BASES[r.baseFrom]);
        }
      }
    }
  });

  // 攝影機視角追蹤
  if (game.half === 'top' || !(game.half === 'bottom' && game.playerBase > 0 && !pl.isMeBatting)) {
    lookTarget.lerp(ballMesh.position, 0.2);
    camera.lookAt(lookTarget);
  }

  // 安全防卡機制
  if (pl.elapsed > 12 || (!anyMoving && pl.fielded && !pl.throwActive && !player.hasBall)) {
    finalizeLivePlay();
  }
}

function handleFlyOut(fielderId, isPlayerCF) {
  const pl = game.play;
  pl.fielded = true;
  AudioFX.glovePop();
  if (isPlayerCF) { AudioFX.cheer(); game.stats.po++; }
  landingRing.visible = false;
  btnRun.style.display = 'none';

  const isSac = game.bases[2] && game.outs < 2 && state.ballPos.z > 74 && Math.random() < 0.65;
  if (isSac) {
    game.bases[2] = false;
    addRuns(1);
    if (pl.isMeBatting) { game.stats.ab--; game.stats.rbi++; }
    setBanner('接殺（高飛犧牲打）', '三壘跑者趁傳滑回本壘得分！');
    if (!addOut(`${fielderId} 深遠飛球接殺！三壘跑者跑回本壘得分`)) {
      nextBatter(); enterAfterPause(1.6);
    }
  } else {
    setBanner(isPlayerCF && player.diving ? '美技撲接！' : '接殺出局！', `${fielderId} 穩穩接殺`);
    if (!addOut(`${fielderId} 飛球接殺出局！`)) {
      nextBatter(); enterAfterPause(1.4);
    }
  }
  updateGameUI();
}

function handleAIFieldGroundBall(f) {
  const pl = game.play;
  pl.fielded = true;
  pl.fielderId = f.id;
  AudioFX.glovePop();

  const isInfield = f.type === 'IF';
  let targetBase = 1;
  if (isInfield) {
    if (game.bases[0] && game.outs < 2) {
      targetBase = 2;
      pl.dpSecondThrow = true;
    } else {
      targetBase = 1;
    }
  } else {
    targetBase = getBestThrowTargetBase();
  }

  pl.throwActive = true;
  pl.throwFrom = f.pos.clone().setY(1.4);
  pl.throwTo = BASES[targetBase % 4].clone().setY(1.2);
  pl.throwTargetBase = targetBase;
  pl.throwT = 0;
  pl.throwDur = Math.max(0.42, pl.throwFrom.distanceTo(pl.throwTo) / 34);
  setTicker(`${f.id} 攔到球，快傳${['本', '一', '二', '三', '本'][targetBase]}壘！`);
}

function resolveThrowArrival() {
  const pl = game.play;
  const tb = pl.throwTargetBase;
  let gotOut = false;

  liveRunners.forEach(r => {
    if (r.out || r.scored) return;
    if (r.baseTo === tb && r.progress > 0.15 && r.progress < 0.99) {
      r.out = true;
      r.mesh.visible = false;
      gotOut = true;
    }
  });

  // 內野雙殺轉傳一壘
  if (pl.dpSecondThrow && tb === 2 && gotOut) {
    pl.dpSecondThrow = false;
    pl.throwFrom = BASES[2].clone().setY(1.3);
    pl.throwTo = BASES[1].clone().setY(1.2);
    pl.throwTargetBase = 1;
    pl.throwT = 0;
    pl.throwDur = 0.55;
    setTicker('二壘封殺！轉傳一壘拚雙殺！');
    return;
  }

  pl.throwActive = false;
  finalizeLivePlay(gotOut, tb);
}

function finishLivePlayHR() {
  const pl = game.play;
  let scored = 1;
  for (let i = 0; i < 3; i++) if (game.bases[i]) scored++;
  game.bases = [false, false, false];
  game.playerBase = 0;
  addRuns(scored);
  if (pl.isMeBatting) { game.stats.h++; game.stats.hr++; game.stats.rbi += scored; }
  nextBatter();
  enterAfterPause(1.4);
  updateGameUI();
}

function finalizeLivePlay(gotOut = false, outBase = 1) {
  const pl = game.play;
  if (!pl || pl.resolved) return;
  pl.resolved = true;
  btnRun.style.display = 'none';
  landingRing.visible = false;

  const outsCount = liveRunners.filter(r => r.out).length;
  const batter = liveRunners.find(r => r.isBatter);
  const nextB = [false, false, false];
  let nextMe = 0;

  liveRunners.forEach(r => {
    if (!r.out && !r.scored) {
      const b = r.progress > 0.65 ? r.baseTo : r.baseFrom;
      if (b >= 4) {
        addRuns(1);
        if (pl.isMeBatting) game.stats.rbi++;
      } else if (b >= 1 && b <= 3) {
        nextB[b - 1] = true;
        if (r.isMe) nextMe = b;
      }
    }
  });

  game.bases = nextB;
  if (game.half === 'bottom') game.playerBase = nextMe;

  if (pl.isMeBatting && batter && !batter.out) {
    game.stats.h++;
  }

  if (outsCount >= 2) {
    setBanner('DOUBLE PLAY!', '漂亮策動雙殺！');
    if (!addOuts(2, '雙殺守備成功！')) { nextBatter(); enterAfterPause(1.5); }
  } else if (outsCount === 1) {
    const bName = ['本', '一', '二', '三', '本'][outBase];
    setBanner('OUT!', `${bName}壘觸殺出局！`);
    if (!addOut(`球傳${bName}壘抓到出局數！`)) { nextBatter(); enterAfterPause(1.4); }
  } else {
    const bDest = batter ? (batter.scored ? 4 : (batter.progress > 0.65 ? batter.baseTo : batter.baseFrom)) : 1;
    const hitName = bDest >= 4 ? '場內全壘打！' : (bDest === 3 ? '三壘安打！' : (bDest === 2 ? '二壘安打！' : '一壘安打！'));
    setBanner(hitName, '');
    setTicker(`安全上壘！記為${hitName}`);
    nextBatter();
    enterAfterPause(1.4);
  }
  updateGameUI();
}

function launchPlayerAtBatPitch() {
  game.subPhase = 'BAT_PITCH';
  game.pitchSwung = false;
  state.pitchT = 0;
  const picked = pickPitchType();
  game.pitchType = picked.pt;
  game.pitchKmh = picked.kmh;
  game.pitchDur = picked.pt.dur + (Math.random() * 0.04 - 0.02);

  const isStrike = Math.random() < 0.60;
  game.pitchIsStrike = isStrike;
  if (isStrike) {
    game.pitchTarget.set((Math.random() - 0.5) * 0.44, 0.62 + Math.random() * 0.56, 0.22);
  } else {
    const side = Math.random() < 0.5 ? (Math.random() > 0.5 ? 0.48 : -0.48) : (Math.random() - 0.5) * 0.6;
    const high = Math.abs(side) < 0.35 ? (Math.random() > 0.5 ? 1.52 : 0.32) : (0.5 + Math.random() * 0.8);
    game.pitchTarget.set(side, high, 0.22);
  }
  ballMesh.visible = true;
  ballMesh.position.set(0, 1.85, 18.44);
}

function swingBat() {
  if (game.subPhase !== 'BAT_PITCH' || game.pitchSwung) return;
  game.pitchSwung = true;
  const z = ballMesh.position.z;
  const err = Math.abs(z - 0.9);
  const zonePenalty = game.pitchIsStrike ? 0 : 0.72;
  const pInfo = `${game.pitchType.name} ${game.pitchKmh}km/h｜`;

  if (err + zonePenalty < 1.38) {
    const quality = 1 - (err + zonePenalty) / 1.38;
    const ev = 34 + quality * 16.5;
    const la = 2 + Math.random() * 29 + quality * 5;
    const spray = (z - 0.9) * 14 + (Math.random() * 18 - 9);
    strikeZoneMesh.visible = false;
    btnSwing.style.display = 'none';

    if (Math.abs(spray) > 45) {
      AudioFX.crack(0.65);
      if (game.strikes < 2) game.strikes++;
      setTicker(`${pInfo}${la < 10 ? '滾地界外' : '界外球'}（${game.balls}壞${game.strikes}好）`);
      launchVisualBall(ev * 0.8, la, spray, 0.6);
      game.subPhase = 'WATCH_FOUL';
      game.timer = 1.3;
    } else {
      game.stats.ab++;
      startLiveBallInPlay(ev, la, spray, 1.0, true);
    }
    updateGameUI();
  } else if (err < 2.6) {
    AudioFX.crack(0.6);
    if (game.strikes < 2) game.strikes++;
    setTicker(`${pInfo}擦棒界外（${game.balls}壞${game.strikes}好）`);
    launchVisualBall(25, 42, Math.random() > 0.5 ? 65 : -65, 0.5);
    game.subPhase = 'WATCH_FOUL';
    game.timer = 1.2;
    updateGameUI();
  } else {
    AudioFX.tone(180, 0.12);
    game.strikes++;
    if (game.strikes >= 3) {
      game.stats.ab++;
      if (!addOut(`${pInfo}揮棒落空！三振出局！`)) { nextBatter(); enterAfterPause(1.2); }
    } else {
      setTicker(`${pInfo}揮棒落空（${game.balls}壞${game.strikes}好）`);
      enterAfterPause(1.0);
    }
    updateGameUI();
  }
}

function attemptSteal() {
  if (game.subPhase !== 'OFF_SIM_WAIT' && game.subPhase !== 'OFF_SIM_PITCH') return;
  if (game.playerBase <= 0 || game.playerBase >= 3 || game.bases[game.playerBase]) return;
  btnSteal.style.display = 'none';
  game.runProgress = 0;
  game.runTargetBase = game.playerBase + 1;
  game.subPhase = 'BASE_STEAL';
  setTicker(`⚡ 發動盜壘！衝向${['', '', '二', '三'][game.runTargetBase]}壘！`);
  AudioFX.tone(540, 0.1);
}

function updateInteractiveTagUp(dt) {
  if (!game.tagBallCaught) {
    stepPhysics(state.ballPos, state.ballVel, 0.95, dt);
    ballMesh.position.copy(state.ballPos);
    ballMesh.scale.setScalar(THREE.MathUtils.clamp(camera.position.distanceTo(state.ballPos) * 0.025, 1.0, 2.5));
    ballShadow.position.set(state.ballPos.x, 0.07, state.ballPos.z);

    if (holdRun) {
      game.runProgress += 0.65 * dt;
      const cur = new THREE.Vector3().lerpVectors(BASES[3], BASES[0], game.runProgress);
      cur.y = 1.65; camera.position.copy(cur);
      if (game.runProgress > 0.16) {
        btnRun.style.display = 'none'; AudioFX.tone(150, 0.3);
        game.bases[2] = false; game.playerBase = 0;
        setBanner('提早離壘！', '還沒接殺就起跑，遭回傳三壘雙殺！');
        if (!addOuts(2, '高飛球提早離壘！回傳三壘形成雙殺！')) { nextBatter(); enterAfterPause(1.8); }
        updateGameUI(); return;
      }
    }
    lookTarget.lerp(state.ballPos, 0.2); camera.lookAt(lookTarget);
    if (state.ballPos.y <= 1.75 && state.ballVel.y < 0) {
      game.tagBallCaught = true; AudioFX.glovePop(); AudioFX.tone(620, 0.14);
      setBanner('接殺！快衝！', '按住「衝刺 / Space」滑回本壘！');
    }
  } else {
    game.tagThrowTimer -= dt;
    if (holdRun) {
      game.runProgress = Math.min(1, game.runProgress + 0.66 * dt);
      const cur = new THREE.Vector3().lerpVectors(BASES[3], BASES[0], game.runProgress);
      cur.y = 1.65 + Math.sin(performance.now() * 0.024) * 0.09;
      camera.position.copy(cur);
      lookTarget.lerp(new THREE.Vector3(0, 1.2, 0), 0.22); camera.lookAt(lookTarget);
    }
    if (game.runProgress >= 1) {
      btnRun.style.display = 'none'; AudioFX.cheer();
      game.bases[2] = false; game.playerBase = 0; addRuns(1);
      setBanner('SAFE! 得分！', '漂亮的高飛犧牲打！滑回本壘 +1 分');
      if (!addOut('高飛犧牲打成功！你滑回本壘攻下 1 分！')) { nextBatter(); enterAfterPause(1.7); }
      updateGameUI();
    } else if (game.tagThrowTimer <= 0) {
      btnRun.style.display = 'none';
      if (game.runProgress > 0.18) {
        AudioFX.tone(160, 0.28); game.bases[2] = false; game.playerBase = 0;
        setBanner('OUT! 本壘助殺！', '外野雷射肩回傳本壘觸殺出局！');
        if (!addOuts(2, '高飛球接殺＋本壘助殺！形成雙殺！')) { nextBatter(); enterAfterPause(1.8); }
      } else {
        setBanner('穩守三壘', '選擇不冒險，留在三壘');
        if (!addOut('外野高飛球接殺出局！你選擇留在三壘')) { nextBatter(); enterAfterPause(1.4); }
      }
      updateGameUI();
    }
  }
}

function updateSteal(dt) {
  const from = BASES[game.playerBase], to = BASES[game.runTargetBase];
  game.runProgress = Math.min(1, game.runProgress + 0.62 * dt);
  const cur = new THREE.Vector3().lerpVectors(from, to, game.runProgress);
  cur.y = 1.65 + Math.sin(performance.now() * 0.022) * 0.09;
  camera.position.copy(cur);
  lookTarget.lerp(new THREE.Vector3(to.x, 1.3, to.z), 0.2); camera.lookAt(lookTarget);
  if (game.runProgress >= 1) {
    const safe = Math.random() < 0.72;
    if (safe) {
      AudioFX.cheer();
      game.bases[game.playerBase - 1] = false; game.playerBase = game.runTargetBase; game.bases[game.playerBase - 1] = true;
      setBanner('SAFE!', `盜上${['', '', '二', '三'][game.playerBase]}壘成功！`);
      enterAfterPause(1.3);
    } else {
      AudioFX.tone(170, 0.25);
      game.bases[game.playerBase - 1] = false; game.playerBase = 0;
      setBanner('OUT!', '盜壘遭捕手阻殺出局！');
      if (!addOut('盜壘失敗出局！')) enterAfterPause(1.4);
    }
    updateGameUI();
  }
}

const minimap = document.getElementById('minimap');
const mctx = minimap.getContext('2d');
function drawMinimap() {
  const w = minimap.width, h = minimap.height;
  mctx.clearRect(0, 0, w, h);
  const ox = w / 2, oy = h - 18, scale = 1.2;
  mctx.beginPath(); mctx.moveTo(ox, oy);
  mctx.arc(ox, oy, 122 * scale, -Math.PI * 0.75, -Math.PI * 0.25);
  mctx.closePath();
  mctx.fillStyle = 'rgba(56, 142, 60, 0.45)'; mctx.fill();
  mctx.strokeStyle = 'rgba(255,255,255,0.45)'; mctx.lineWidth = 2; mctx.stroke();

  fielders.forEach(f => {
    if (!f.mesh.visible) return;
    mctx.fillStyle = 'rgba(144, 202, 249, 0.85)';
    mctx.beginPath(); mctx.arc(ox - f.pos.x * scale, oy - f.pos.z * scale, 3, 0, Math.PI * 2); mctx.fill();
  });

  liveRunners.forEach(r => {
    if (r.out || r.scored) return;
    const p = r.isMe && game.half === 'bottom' ? camera.position : r.mesh.position;
    mctx.fillStyle = '#ffca28';
    mctx.beginPath(); mctx.arc(ox - p.x * scale, oy - p.z * scale, 4, 0, Math.PI * 2); mctx.fill();
  });

  if (state.mode !== 'game' || game.half === 'top') {
    mctx.fillStyle = '#29b6f6';
    mctx.beginPath(); mctx.arc(ox - player.pos.x * scale, oy - player.pos.z * scale, 5, 0, Math.PI * 2); mctx.fill();
  }
  if (landingRing.visible && state.meta && state.meta.land) {
    mctx.strokeStyle = '#ffeb3b'; mctx.lineWidth = 2.5;
    mctx.beginPath(); mctx.arc(ox - state.meta.land.x * scale, oy - state.meta.land.z * scale, 6, 0, Math.PI * 2); mctx.stroke();
  }
  if (ballMesh.visible) {
    mctx.fillStyle = '#ffffff';
    mctx.beginPath(); mctx.arc(ox - ballMesh.position.x * scale, oy - ballMesh.position.z * scale, 3.5, 0, Math.PI * 2); mctx.fill();
  }
}

function updateCFMovement(dt, now) {
  if (player.diving) {
    player.diveTimer -= dt;
    const speed = 10.6 * Math.max(player.diveTimer / 0.52, 0.15);
    player.pos.addScaledVector(player.diveDir, speed * dt);
    player.pos.y = 0.72 + 0.55 * Math.sin((player.diveTimer / 0.52) * Math.PI);
    if (player.diveTimer <= 0) { player.diving = false; player.pos.y = 1.7; }
  } else {
    const input = getMoveInput();
    const maxSpeed = input.z > 0.3 ? 7.8 : 8.8;
    player.vel.lerp(input.multiplyScalar(maxSpeed), Math.min(1, dt * 8.5));
    player.pos.addScaledVector(player.vel, dt);
    player.pos.y = 1.7 + Math.sin(now * 0.018) * (player.vel.length() * 0.012);
  }
  const r = Math.hypot(player.pos.x, player.pos.z);
  if (r > wallRadius - 1.2) { player.pos.x *= (wallRadius - 1.2) / r; player.pos.z *= (wallRadius - 1.2) / r; }
  if (player.pos.z < 36) player.pos.z = 36;
  camera.position.copy(player.pos);
}

const lookTarget = new THREE.Vector3(0, 2.2, 0);
let lastTime = performance.now(), accum = 0;
const FIXED_DT = 1 / 120;

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (state.mode === 'game' && game.active) {
    if (game.subPhase === 'CHANGE_SIDES' || game.subPhase === 'PAUSE_NEXT') {
      game.timer -= dt;
      if (game.timer <= 0) enterCurrentRole();
    } else if (game.subPhase === 'DEF_WAIT' || game.subPhase === 'OFF_SIM_WAIT') {
      if (game.subPhase === 'DEF_WAIT') {
        updateCFMovement(dt, now);
        lookTarget.lerp(new THREE.Vector3(0, 1.8, 0), 0.12); camera.lookAt(lookTarget);
      }
      game.timer -= dt;
      if (game.timer <= 0) launchSimPitch(game.subPhase === 'DEF_WAIT');
    } else if (game.subPhase === 'DEF_PITCH' || game.subPhase === 'OFF_SIM_PITCH') {
      if (game.subPhase === 'DEF_PITCH') updateCFMovement(dt, now);
      state.pitchT += dt * state.speed;
      const p = Math.min(state.pitchT / game.pitchType.dur, 1);
      const pt = game.pitchType;
      ballMesh.position.set(
        pt.breakX * p * p,
        1.85 - p * 0.8 + Math.sin(p * Math.PI) * pt.arc + pt.breakY * p * p * 0.5,
        18.44 * (1 - p) + 0.3
      );
      ballMesh.scale.setScalar(game.subPhase === 'DEF_PITCH' ? 2.4 : 1.3);
      lookTarget.lerp(ballMesh.position, 0.2); camera.lookAt(lookTarget);
      if (p >= 1) resolveSimPitch(game.subPhase === 'DEF_PITCH');
    } else if (game.subPhase === 'LIVE_PLAY') {
      updateLivePlay(dt, now);
    } else if (game.subPhase === 'BAT_WAIT') {
      game.timer -= dt;
      if (game.timer <= 0) launchPlayerAtBatPitch();
    } else if (game.subPhase === 'BAT_PITCH') {
      state.pitchT += dt;
      const p = Math.min(state.pitchT / game.pitchDur, 1);
      const t = game.pitchTarget, pt = game.pitchType;
      ballMesh.position.set(
        (t.x - pt.breakX) * p + pt.breakX * p * p,
        1.85 + (t.y - 1.85 - pt.breakY) * p + pt.breakY * p * p + Math.sin(p * Math.PI) * pt.arc,
        18.44 * (1 - p) + t.z * p
      );
      ballMesh.scale.setScalar(1.15);
      if (p >= 1 && !game.pitchSwung) {
        AudioFX.glovePop();
        const pInfo = `${pt.name} ${game.pitchKmh}km/h｜`;
        if (game.pitchIsStrike) {
          game.strikes++;
          if (game.strikes >= 3) {
            game.stats.ab++;
            if (!addOut(`${pInfo}好球沒揮棒！遭到三振出局！`)) { nextBatter(); enterAfterPause(1.2); }
          } else { setTicker(`${pInfo}好球進壘（${game.balls}壞${game.strikes}好）`); enterAfterPause(0.95); }
        } else {
          game.balls++;
          if (game.balls >= 4) {
            AudioFX.cheer(); game.stats.bb++; applyWalk(true);
            setBanner('BALL FOUR!', '選到四壞球保送上一壘！');
            setTicker(`${pInfo}選球漂亮！四壞球保送上一壘`);
            nextBatter(); enterAfterPause(1.4);
          } else { setTicker(`${pInfo}壞球！選得好（${game.balls}壞${game.strikes}好）`); enterAfterPause(0.95); }
        }
        updateGameUI();
      }
    } else if (game.subPhase === 'WATCH_FOUL') {
      stepPhysics(state.ballPos, state.ballVel, 0.5, dt);
      if (state.ballPos.y < 0.11) state.ballPos.y = 0.11;
      ballMesh.position.copy(state.ballPos);
      ballShadow.position.set(state.ballPos.x, 0.07, state.ballPos.z);
      lookTarget.lerp(state.ballPos, 0.16); camera.lookAt(lookTarget);
      game.timer -= dt;
      if (game.timer <= 0) enterCurrentRole();
    } else if (game.subPhase === 'BASE_STEAL') {
      updateSteal(dt);
    } else if (game.subPhase === 'BASE_TAGUP') {
      updateInteractiveTagUp(dt);
    }
  } else if (state.mode !== 'game') {
    if (state.phase === 'PITCHING') {
      state.pitchT += dt;
      const p = Math.min(state.pitchT / 0.48, 1);
      ballMesh.position.set(0, 1.85 - p * 0.8, 18.44 * (1 - p) + 0.3);
      ballMesh.scale.setScalar(2.4);
      lookTarget.lerp(new THREE.Vector3(0, 1.6, 0), 0.15); camera.lookAt(lookTarget);
      if (p >= 1) launchPracticeBall();
    } else if (state.phase === 'IN_FLIGHT') {
      if (state.mode === 'chase') updateCFMovement(dt, now);
      accum += dt;
      while (accum >= FIXED_DT && state.phase === 'IN_FLIGHT') {
        stepPhysics(state.ballPos, state.ballVel, state.meta.spin, FIXED_DT);
        state.flightT += FIXED_DT; accum -= FIXED_DT;
        if (state.mode === 'quiz' && !state.quizChoice && state.flightT >= 1.15) {
          state.phase = 'QUIZ_WAIT'; quizControls.style.display = 'flex';
          setBanner('這顆飛球，前？後？', '立刻選擇！'); break;
        }
        if (state.mode === 'chase') {
          const horiz = Math.hypot(state.ballPos.x - player.pos.x, state.ballPos.z - player.pos.z);
          if (horiz <= (player.diving ? 2.85 : 2.15) && state.ballPos.y <= 2.65 && state.ballPos.y >= 0.15 && state.ballVel.y < 0) {
            AudioFX.glovePop(); AudioFX.tone(660, 0.22);
            finishPracticePlay(true, player.diving ? '美技撲接接殺！' : '穩穩接殺出局！', `落點偏差 ${horiz.toFixed(2)} 公尺`, '#66bb6a'); break;
          }
        }
        if (state.ballPos.y <= 0.11) {
          state.ballPos.y = 0.11; AudioFX.thud();
          if (state.mode === 'quiz') {
            const correct = state.meta.deltaZ < 0 ? 'front' : 'back';
            const ok = state.quizChoice === correct;
            AudioFX.tone(ok ? 720 : 180, 0.22);
            finishPracticePlay(ok, ok ? '判斷正確！' : '判斷失誤！', `正確方向：${correct === 'front' ? '往前衝（前）' : '往後退（後）'}`, ok ? '#66bb6a' : '#ef5350');
          } else {
            const miss = Math.hypot(state.ballPos.x - player.pos.x, state.ballPos.z - player.pos.z);
            finishPracticePlay(false, state.ballPos.z > player.pos.z + 2 ? '越過頭頂長打！' : '落地安打！', `落地距離差 ${miss.toFixed(1)} 公尺`, '#ef5350');
          }
          break;
        }
      }
      ballMesh.position.copy(state.ballPos);
      ballMesh.scale.setScalar(THREE.MathUtils.clamp(camera.position.distanceTo(state.ballPos) * 0.026, 1.0, 2.8));
      ballShadow.position.set(state.ballPos.x, 0.07, state.ballPos.z);
      if (state.mode === 'quiz' && state.quizChoice) { trailPts.push(state.ballPos.clone()); trailGeo.setFromPoints(trailPts); }
      lookTarget.lerp(state.ballPos, 0.22); camera.lookAt(lookTarget);
    } else if (state.phase === 'QUIZ_WAIT') {
      camera.lookAt(lookTarget);
    }
  }

  drawMinimap();
  renderer.render(scene, camera);
}

switchMode('game');
requestAnimationFrame(animate);
</script>
</body>
</html>
