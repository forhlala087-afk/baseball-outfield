<!DOCTYPE html>
<html lang="zh-TW">
<head>

<script>
  (() => {
    const c = document.createElement('canvas');
    c.width = c.height = 512;
    const g = c.getContext('2d');
    g.fillStyle = '#14452f';
    g.fillRect(0, 0, 512, 512);
    g.font = '320px sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText('⚾', 256, 276);
    const icon = c.toDataURL('image/png');
    const addLink = (rel, href) => {
      const l = document.createElement('link');
      l.rel = rel; l.href = href;
      document.head.appendChild(l);
    };
    addLink('icon', icon);
    addLink('apple-touch-icon', icon);
    const manifest = {
      name: '外野飛球 3D',
      short_name: '外野飛球',
      display: 'standalone',
      background_color: '#0b1622',
      theme_color: '#0b1622',
      start_url: location.href,
      icons: [{ src: icon, sizes: '512x512', type: 'image/png' }]
    };
    addLink('manifest', 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest)));
  })();
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1622; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; color: #fff; touch-action: none; user-select: none; }
  #canvas-wrap { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  #hud-top {
    position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 6px;

  }
  .panel {

  .base-sq.me { background: #29b6f6; border-color: #fff; box-shadow: 0 0 8px #29b6f6; }
  #b1 { right: 4px; top: 14px; }
  #b2 { left: 15px; top: 3px; }
  #b3 { left: 4px; top: 14px; }

  .bso-row { display: flex; gap: 10px; margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 11px; align-items: center; }

  #action-bar {
    position: fixed; bottom: max(28px, env(safe-area-inset-bottom) + 16px); left: 50%; transform: translateX(-50%);

  }
  .act-btn:active { transform: scale(0.95); }
  .act-btn.swing { background: linear-gradient(135deg, #e53935, #b71c1c); }
  .act-btn.run { background: linear-gradient(135deg, #fb8c00, #e65100); }

  #touch-controls { position: fixed; inset: 0; pointer-events: none; z-index: 13; }

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const AudioFX = (() => {
  let ctx = null;
  function ensure() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
  }
  function crack(power = 1) {
    ensure();
    const now = ctx.currentTime;
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.14, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.018));
    const noise = ctx.createBufferSource();
    noise.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass'; filter.frequency.value = 1400 + power * 500; filter.Q.value = 1.4;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.85 * power, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
    noise.connect(filter).connect(gain).connect(ctx.destination);
    noise.start(now);
    const osc = ctx.createOscillator(), og = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(520 + power * 180, now);
    osc.frequency.exponentialRampToValueAtTime(140, now + 0.06);
    og.gain.setValueAtTime(0.45 * power, now);
    og.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
    osc.connect(og).connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.07);
  }
  function glovePop() {
    ensure();
    const now = ctx.currentTime, osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(210, now);
    osc.frequency.exponentialRampToValueAtTime(55, now + 0.09);
    g.gain.setValueAtTime(0.7, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc.connect(g).connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.1);
  }
  function thud() {
    ensure();
    const now = ctx.currentTime, osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(110, now);
    osc.frequency.exponentialRampToValueAtTime(38, now + 0.12);
    g.gain.setValueAtTime(0.48, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
    osc.connect(g).connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.13);
  }
  function tone(freq, dur = 0.15) {
    ensure();
    const now = ctx.currentTime, osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(0.2, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(g).connect(ctx.destination);
    osc.start(now); osc.stop(now + dur);
  }
  function cheer() {
    tone(523, 0.14);
    setTimeout(() => tone(659, 0.14), 90);
    setTimeout(() => tone(784, 0.25), 180);
  }
  return { crack, glovePop, thud, tone, cheer };
})();

const wrap = document.getElementById('canvas-wrap');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x4b86c6);
scene.fog = new THREE.FogExp2(0x6da1d4, 0.0021);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
wrap.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xdff2ff, 0x2e5a27, 0.88));
const sun = new THREE.DirectionalLight(0xfff8e7, 0.9);
sun.position.set(50, 90, -30);
scene.add(sun);

function createGrassTexture() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const g = c.getContext('2d');
  for (let i = 0; i < 16; i++) {
    g.fillStyle = i % 2 === 0 ? '#2f7a32' : '#388a3a';
    g.fillRect(0, i * 32, 512, 32);
  }
  for (let i = 0; i < 5000; i++) {
    g.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.04)';
    g.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(16, 16);
  return tex;
}

function createCrowdTexture() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#243447'; g.fillRect(0, 0, 512, 128);
  const colors = ['#cfd8dc', '#90caf9', '#ef9a9a', '#ffe082', '#ffffff', '#546e7a', '#1e88e5'];
  for (let y = 6; y < 124; y += 8) {
    g.fillStyle = '#1b2838'; g.fillRect(0, y + 4, 512, 2);
    for (let x = 2; x < 512; x += 6) {
      if (Math.random() > 0.25) {
        g.fillStyle = colors[Math.floor(Math.random() * colors.length)];
        g.fillRect(x, y, 4, 5);
      }
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping; tex.repeat.set(14, 1);
  return tex;
}

const fieldMesh = new THREE.Mesh(
  new THREE.CircleGeometry(155, 64),
  new THREE.MeshLambertMaterial({ map: createGrassTexture() })
);
fieldMesh.rotation.x = -Math.PI / 2;
scene.add(fieldMesh);

const warningTrack = new THREE.Mesh(
  new THREE.RingGeometry(117, 123, 64, 1, Math.PI * 0.2, Math.PI * 0.6),
  new THREE.MeshLambertMaterial({ color: 0x8d5b3c })
);
warningTrack.rotation.x = -Math.PI / 2; warningTrack.rotation.z = -Math.PI / 2;
warningTrack.position.y = 0.02;
scene.add(warningTrack);

const infieldDirt = new THREE.Mesh(
  new THREE.CircleGeometry(30, 48),
  new THREE.MeshLambertMaterial({ color: 0xb68657 })
);
infieldDirt.rotation.x = -Math.PI / 2; infieldDirt.position.set(0, 0.03, 19);
scene.add(infieldDirt);

const infieldGrass = new THREE.Mesh(
  new THREE.PlaneGeometry(25, 25),
  new THREE.MeshLambertMaterial({ color: 0x358237 })
);
infieldGrass.rotation.x = -Math.PI / 2; infieldGrass.rotation.z = Math.PI / 4;
infieldGrass.position.set(0, 0.05, 19.4);
scene.add(infieldGrass);

const mound = new THREE.Mesh(
  new THREE.CylinderGeometry(2.2, 2.7, 0.25, 24),
  new THREE.MeshLambertMaterial({ color: 0xa87648 })
);
mound.position.set(0, 0.12, 18.44);
scene.add(mound);

const BASES = [
  new THREE.Vector3(0, 0, 0),
  new THREE.Vector3(-19.4, 0, 19.4),
  new THREE.Vector3(0, 0, 38.8),
  new THREE.Vector3(19.4, 0, 19.4)

const joy = { active: false, dx: 0, dy: 0, id: null };
const joyZone = document.getElementById('joy-zone');
const joyKnob = document.getElementById('joy-knob');

function updateJoy(cx, cy) {
  const rect = joyZone.getBoundingClientRect();
  const maxR = rect.width * 0.38;
  let dx = cx - (rect.left + rect.width / 2);
  let dy = cy - (rect.top + rect.height / 2);
  const len = Math.hypot(dx, dy);
  if (len > maxR) { dx = dx / len * maxR; dy = dy / len * maxR; }
  joy.dx = dx / maxR; joy.dy = dy / maxR;
  joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
}
joyZone.addEventListener('pointerdown', e => { joy.active = true; joy.id = e.pointerId; joyZone.setPointerCapture(e.pointerId); updateJoy(e.clientX, e.clientY); });
joyZone.addEventListener('pointermove', e => { if (joy.active && e.pointerId === joy.id) updateJoy(e.clientX, e.clientY); });
function endJoy() { joy.active = false; joy.dx = 0; joy.dy = 0; joyKnob.style.transform = 'translate(0px, 0px)'; }
joyZone.addEventListener('pointerup', endJoy);

function stepPhysics(pos, vel, spin, dt) {
  const speed = vel.length();
  const drag = 0.0046 * speed;
  vel.x -= drag * vel.x * dt;
  vel.y -= (9.81 + drag * vel.y) * dt;
  vel.z -= drag * vel.z * dt;
  vel.y += spin * speed * 0.0014 * dt;
  pos.addScaledVector(vel, dt);
}

function simulateHit(ev, laDeg, sprayDeg, spin) {
  const la = THREE.MathUtils.degToRad(laDeg);
  const sp = THREE.MathUtils.degToRad(sprayDeg);
  const pos = new THREE.Vector3(0, 1.05, 0.3);
  const vel = new THREE.Vector3(ev * Math.cos(la) * Math.sin(sp), ev * Math.sin(la), ev * Math.cos(la) * Math.cos(sp));
  const dt = 1 / 120;
  let t = 0, maxH = 0;
  while (pos.y > 0.1 && t < 10) {
    stepPhysics(pos, vel, spin, dt);
    if (pos.y > maxH) maxH = pos.y;
    t += dt;
  }
  return { land: pos.clone(), hang: t, maxH };
}

function generatePlayableBall(narrow = false) {
  for (let tries = 0; tries < 80; tries++) {
    const ev = 38 + Math.random() * 10.5;
    const la = 19 + Math.random() * 28;
    const spray = narrow ? (Math.random() * 10 - 5) : (Math.random() * 24 - 12);
    const spin = 0.8 + Math.random() * 1.1;
    const sim = simulateHit(ev, la, spray, spin);
    const dist = Math.hypot(sim.land.x, sim.land.z);
    const deltaZ = sim.land.z - START_POS.z;
    if (narrow) {
      if (dist > 64 && dist < 118 && Math.abs(deltaZ) > 5.5 && Math.abs(deltaZ) < 25) return { ev, la, spray, spin, ...sim, dist, deltaZ };
    } else {
      if (dist > 62 && dist < 120 && Math.abs(sim.land.x) < 28) return { ev, la, spray, spin, ...sim, dist, deltaZ };
    }
  }
  const sim = simulateHit(43, 30, 0, 1.2);
  return { ev: 43, la: 30, spray: 0, spin: 1.2, ...sim, dist: sim.land.z, deltaZ: sim.land.z - START_POS.z };
}

function getMoveInput() {
  let x = 0, z = 0;
  if (keys['KeyW'] || keys['ArrowUp']) z -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) z += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) x -= 1;

  if (joy.active) { x += joy.dx; z += joy.dy; }

  return v;
}

function addRuns(n) {
  if (n <= 0) return;
  if (game.half === 'top') game.awayScore += n;
  else game.homeScore += n;
}

function advanceRunners(numBases, isWalk = false, isMeBatting = false) {
  let scored = 0;
  if (isWalk) {
    if (game.bases[0] && game.bases[1] && game.bases[2]) {
      scored++;
      if (game.half === 'bottom' && game.playerBase === 3) game.playerBase = 0;
    }
    if (game.bases[0] && game.bases[1]) {
      game.bases[2] = true;
      if (game.half === 'bottom' && game.playerBase === 2) game.playerBase = 3;
    }
    if (game.bases[0]) {
      game.bases[1] = true;
      if (game.half === 'bottom' && game.playerBase === 1) game.playerBase = 2;
    }
    game.bases[0] = true;
    if (isMeBatting) game.playerBase = 1;
  } else {
    const nextBases = [false, false, false];
    let nextMe = 0;
    for (let i = 2; i >= 0; i--) {
      if (game.bases[i]) {
        const dest = i + 1 + numBases;
        const wasMe = (game.half === 'bottom' && game.playerBase === i + 1);
        if (dest >= 4) {
          scored++;
          if (wasMe) setTicker('你跑回本壘得分！');
        } else {
          nextBases[dest - 1] = true;
          if (wasMe) nextMe = dest;
        }
      }
    }
    if (numBases >= 4) {
      scored++;
    } else if (numBases > 0) {
      nextBases[numBases - 1] = true;
      if (isMeBatting) nextMe = numBases;
    }
    game.bases = nextBases;
    if (game.half === 'bottom') game.playerBase = nextMe;
  }
  addRuns(scored);
  if (isMeBatting) game.stats.rbi += scored;
  return scored;
}

function nextBatter() {
  game.balls = 0; game.strikes = 0;
  if (game.half === 'top') game.awayOrder = (game.awayOrder % 9) + 1;
  else game.homeOrder = (game.homeOrder % 9) + 1;
}

function addOuts(count, msg) {
  game.outs += count;
  setTicker(msg);
  if (game.outs >= 3) {
    game.outs = 0; game.balls = 0; game.strikes = 0;
    game.bases = [false, false, false];
    game.playerBase = 0;
    if (game.half === 'top') game.awayOrder = (game.awayOrder % 9) + 1;
    else game.homeOrder = (game.homeOrder % 9) + 1;

    if (game.half === 'bottom' && game.inning >= 9) {
      endFullGame();
      return true;
    }
    if (game.half === 'top') {
      game.half = 'bottom';
      if (game.inning === 9 && game.homeScore > game.awayScore) {
        endFullGame();
        return true;
      }
      setBanner(`${game.inning}局下半`, '三出局攻守交換｜換我方進攻！');
    } else {
      game.half = 'top';
      game.inning++;
      setBanner(`${game.inning}局上半`, '三出局攻守交換｜前往中外野守備！');
    }
    game.subPhase = 'CHANGE_SIDES';
    game.timer = 2.2;
    hideAllActionUI();
    updateGameUI();
    return true;
  }
  return false;
}

function addOut(msg) { return addOuts(1, msg); }

  game.playerBase = 0;
  game.stats = { ab: 0, h: 0, hr: 0, bb: 0, rbi: 0, po: 0 };
  ticker.style.display = 'block';
  setBanner('1局上半', '先發 3 棒中外野手，就守備位置！');
  game.subPhase = 'CHANGE_SIDES';
  game.timer = 1.6;
  updateGameUI();
}

function enterCurrentRole() {
  hideAllActionUI();
  ballMesh.visible = false;
  ballShadow.visible = false;
  batterMesh.visible = true;
  setBanner('', '');
  updateGameUI();

  if (game.half === 'top') {
    resetPlayerCF();
    touchControls.style.display = 'block';
    game.subPhase = 'DEF_WAIT';
    game.timer = 1.35 / state.speed;
    setTicker(`客隊 ${game.awayOrder} 棒打擊中｜你在中外野待命`);
  } else {
    if (game.playerBase > 0) {
      const bPos = BASES[game.playerBase];
      camera.position.set(bPos.x, 1.65, bPos.z);
      lookTarget.set(0, 1.4, 10);
      camera.lookAt(lookTarget);
      actionBar.style.display = 'flex';
      const canSteal = game.playerBase < 3 && !game.bases[game.playerBase];
      btnSteal.style.display = canSteal ? 'block' : 'none';
      game.subPhase = 'OFF_SIM_WAIT';
      game.timer = 1.5 / state.speed;
      setTicker(`你在${['', '一', '二', '三'][game.playerBase]}壘｜隊友 ${game.homeOrder} 棒打擊中`);
    } else if (game.homeOrder === 3) {
      batterMesh.visible = false;
      camera.position.copy(BATTER_POS);
      lookTarget.set(0, 1.1, 18.44);
      camera.lookAt(lookTarget);
      strikeZoneMesh.visible = true;
      actionBar.style.display = 'flex';
      btnSwing.style.display = 'block';
      game.subPhase = 'BAT_WAIT';
      game.timer = 1.25;
      setTicker('輪到你了（第 3 棒）！盯緊投手球路準備揮棒');
    } else {
      const isOnDeck = game.homeOrder === 2;
      camera.position.copy(isOnDeck ? ONDECK_POS : DUGOUT_POS);
      lookTarget.set(0, 1.4, 15);
      camera.lookAt(lookTarget);
      game.subPhase = 'OFF_SIM_WAIT';
      game.timer = 1.35 / state.speed;
      setTicker(isOnDeck ? '打擊準備區熱身中（下一棒就是你！）' : `休息室觀戰｜我方 ${game.homeOrder} 棒打擊中`);
    }
  }
}

function pickPitchType() {
  const pt = PITCH_TYPES[Math.floor(Math.random() * PITCH_TYPES.length)];
  const kmh = Math.round(pt.minKmh + Math.random() * (pt.maxKmh - pt.minKmh));
  return { pt, kmh };
}

function launchSimPitch(isDefense) {
  game.subPhase = isDefense ? 'DEF_PITCH' : 'OFF_SIM_PITCH';
  state.pitchT = 0;
  const picked = pickPitchType();
  game.pitchType = picked.pt;
  game.pitchKmh = picked.kmh;
  ballMesh.visible = true;
  ballMesh.position.set(0, 1.85, 18.44);

  const r = Math.random();
  if (r < 0.24) game.simResult = 'BALL';
  else if (r < 0.42) game.simResult = 'STRIKE_LOOK';
  else if (r < 0.54) game.simResult = 'STRIKE_SWING';
  else if (r < 0.63) game.simResult = 'FOUL_FLY';
  else if (r < 0.70) game.simResult = 'FOUL_GROUND';
  else {
    const b = Math.random();
    if (isDefense) {
      if (b < 0.26) game.simResult = 'CF_BALL';
      else if (b < 0.50) game.simResult = 'INFIELD_OUT';
      else if (b < 0.70) game.simResult = 'CORNER_OUT';
      else if (b < 0.82) game.simResult = 'AWAY_GROUND_HIT';
      else if (b < 0.95) game.simResult = 'CORNER_HIT';
      else game.simResult = 'AWAY_HR';
    } else {
      if (b < 0.36) game.simResult = 'TEAM_GROUND_OUT';
      else if (b < 0.68) game.simResult = 'TEAM_FLY_OUT';
      else if (b < 0.80) game.simResult = 'TEAM_GROUND_HIT';
      else if (b < 0.89) game.simResult = 'TEAM_1B';
      else if (b < 0.95) game.simResult = 'TEAM_2B';
      else game.simResult = 'TEAM_HR';
    }
  }
}

function resolveSimPitch(isDefense) {
  const res = game.simResult;
  const pInfo = `${game.pitchType.name} ${game.pitchKmh}km/h｜`;

  if (res === 'BALL') {
    AudioFX.glovePop();
    game.balls++;
    if (game.balls >= 4) {
      setTicker(`${pInfo}四壞球保送！打者上一壘`);
      advanceRunners(1, true, false);
      nextBatter();
    } else setTicker(`${pInfo}壞球（${game.balls}壞${game.strikes}好）`);
    enterAfterPause(1.0);
  } else if (res === 'STRIKE_LOOK' || res === 'STRIKE_SWING') {
    AudioFX.glovePop();
    game.strikes++;
    const label = res === 'STRIKE_LOOK' ? '好球進壘' : '揮棒落空';
    if (game.strikes >= 3) {
      AudioFX.tone(320, 0.2);
      if (!addOut(`${pInfo}${label}！三振出局！`)) {
        nextBatter();
        enterAfterPause(1.1);
      }
    } else {
      setTicker(`${pInfo}${label}（${game.balls}壞${game.strikes}好）`);
      enterAfterPause(0.95);
    }
  } else if (res === 'FOUL_FLY' || res === 'FOUL_GROUND') {
    AudioFX.crack(0.7);
    if (game.strikes < 2) game.strikes++;
    const isGr = res === 'FOUL_GROUND';
    setTicker(`${pInfo}${isGr ? '滾地界外' : '界外飛球'}（${game.balls}壞${game.strikes}好）`);
    launchVisualBall(isGr ? 30 : 32, isGr ? 4 : 34, (Math.random() > 0.5 ? 1 : -1) * (54 + Math.random() * 18), 0.5);
    game.subPhase = 'WATCH_BALL';
    game.timer = 1.35 / state.speed;
  } else if (res === 'CF_BALL') {
    state.meta = generatePlayableBall(false);
    const m = state.meta;
    launchVisualBall(m.ev, m.la, m.spray, m.spin);
    AudioFX.crack(THREE.MathUtils.clamp((m.ev - 36) / 12, 0.65, 1.25));
    if (state.showMarker) {
      landingRing.position.set(m.land.x, 0.08, m.land.z);
      landingRing.visible = true;
    }
    setTicker('⚡ 打向中外野！快追球！');
    setBanner('中外野飛球！', '跑位接殺！');
    setTimeout(() => { if (game.subPhase === 'DEF_CF_PLAY') setBanner('', ''); }, 900);
    game.subPhase = 'DEF_CF_PLAY';
  } else if (res === 'INFIELD_OUT' || res === 'TEAM_GROUND_OUT') {
    AudioFX.crack(0.8);
    launchVisualBall(28, 4, Math.random() * 48 - 24, 0.8);
    const canDP = game.bases[0] && game.outs < 2 && Math.random() < 0.48;
    if (canDP) {
      game.bases[0] = false;
      if (!isDefense && game.playerBase === 1) game.playerBase = 0;
      setBanner('DOUBLE PLAY!', '6-4-3 雙殺打！');
      if (!addOuts(2, '內野滾地球！策動漂亮雙殺打！')) {
        nextBatter();
        game.subPhase = 'WATCH_BALL';
        game.timer = 1.7 / state.speed;
      }
    } else {
      if (!addOut('內野滾地球遭到刺殺出局！')) {
        nextBatter();
        game.subPhase = 'WATCH_BALL';
        game.timer = 1.6 / state.speed;
      }
    }
  } else if (res === 'CORNER_OUT' || res === 'TEAM_FLY_OUT') {
    AudioFX.crack(0.85);
    const spray = res === 'CORNER_OUT' ? (Math.random() > 0.5 ? 28 : -28) : (Math.random() * 52 - 26);
    if (!isDefense && game.playerBase === 3 && game.outs < 2) {
      startInteractiveTagUp(spray);
      return;
    }
    launchVisualBall(38, 34, spray, 0.9);
    const canSac = game.bases[2] && game.outs < 2 && Math.random() < 0.68;
    if (canSac) {
      game.bases[2] = false;
      addRuns(1);
      if (!addOut('外野高飛犧牲打！三壘跑者滑回本壘得分！')) {
        nextBatter();
        game.subPhase = 'WATCH_BALL';
        game.timer = 1.8 / state.speed;
      }
    } else {
      if (!addOut('外野高飛球遭到接殺出局！')) {
        nextBatter();
        game.subPhase = 'WATCH_BALL';
        game.timer = 1.65 / state.speed;
      }
    }
  } else if (res === 'AWAY_GROUND_HIT' || res === 'CORNER_HIT' || res === 'AWAY_HR') {
    AudioFX.crack(1.1);
    const isHR = res === 'AWAY_HR';
    const isGr = res === 'AWAY_GROUND_HIT';
    const spray = isGr ? (Math.random() * 44 - 22) : (Math.random() > 0.5 ? 1 : -1) * (24 + Math.random() * 14);
    launchVisualBall(isHR ? 49 : (isGr ? 37 : 41), isHR ? 30 : (isGr ? 3 : 14), spray, 0.9);
    const nb = isHR ? 4 : (isGr ? 1 : (Math.random() < 0.65 ? 1 : 2));
    const sc = advanceRunners(nb, false, false);
    const hitLabel = isHR ? '客隊全壘打！' : (isGr ? '客隊滾地穿越安打！' : (nb === 2 ? '客隊二壘安打！' : '客隊安打！'));
    setTicker(`${hitLabel}${sc > 0 ? ` 失 ${sc} 分` : ''}`);
    nextBatter();
    game.subPhase = 'WATCH_BALL';
    game.timer = 1.95 / state.speed;
  } else if (res === 'TEAM_GROUND_HIT' || res === 'TEAM_1B' || res === 'TEAM_2B' || res === 'TEAM_HR') {
    AudioFX.crack(1.1);
    const isGr = res === 'TEAM_GROUND_HIT';
    const nb = res === 'TEAM_HR' ? 4 : (res === 'TEAM_2B' ? 2 : 1);
    launchVisualBall(nb === 4 ? 50 : (isGr ? 37 : 42), nb === 4 ? 30 : (isGr ? 3 : 16), Math.random() * 44 - 22, 0.9);
    if (game.playerBase > 0 && nb < 4) {
      startInteractiveBaserunning(nb, isGr);
    } else {
      const sc = advanceRunners(nb, false, false);
      if (nb === 4) AudioFX.cheer();
      const hitLabel = nb === 4 ? '全壘打！' : (isGr ? '滾地穿越安打！' : (nb === 2 ? '二壘安打！' : '外野安打！'));
      setTicker(`隊友擊出${hitLabel}${sc > 0 ? ` 得 ${sc} 分！` : ''}`);
      nextBatter();
      game.subPhase = 'WATCH_BALL';
      game.timer = 1.95 / state.speed;
    }
  }
  updateGameUI();
}

function launchVisualBall(ev, laDeg, sprayDeg, spin) {
  const la = THREE.MathUtils.degToRad(laDeg);
  const sp = THREE.MathUtils.degToRad(sprayDeg);
  state.ballPos.set(0, 1.05, 0.3);
  state.ballVel.set(ev * Math.cos(la) * Math.sin(sp), ev * Math.sin(la), ev * Math.cos(la) * Math.cos(sp));
  state.meta = { spin };
  ballMesh.visible = true;
  ballShadow.visible = true;
}

function enterAfterPause(sec) {
  game.subPhase = 'PAUSE_NEXT';
  game.timer = sec / state.speed;
  updateGameUI();
}

function launchPlayerAtBatPitch() {
  game.subPhase = 'BAT_PITCH';
  game.pitchSwung = false;
  state.pitchT = 0;
  const picked = pickPitchType();
  game.pitchType = picked.pt;
  game.pitchKmh = picked.kmh;
  game.pitchDur = picked.pt.dur + (Math.random() * 0.04 - 0.02);

  const isStrike = Math.random() < 0.60;
  game.pitchIsStrike = isStrike;
  if (isStrike) {
    game.pitchTarget.set((Math.random() - 0.5) * 0.44, 0.62 + Math.random() * 0.56, 0.22);
  } else {
    const side = Math.random() < 0.5 ? (Math.random() > 0.5 ? 0.48 : -0.48) : (Math.random() - 0.5) * 0.6;
    const high = Math.abs(side) < 0.35 ? (Math.random() > 0.5 ? 1.52 : 0.32) : (0.5 + Math.random() * 0.8);
    game.pitchTarget.set(side, high, 0.22);
  }
  ballMesh.visible = true;
  ballMesh.position.set(0, 1.85, 18.44);
}

function swingBat() {
  if (game.subPhase !== 'BAT_PITCH' || game.pitchSwung) return;
  game.pitchSwung = true;
  const z = ballMesh.position.z;
  const err = Math.abs(z - 0.9);
  const zonePenalty = game.pitchIsStrike ? 0 : 0.72;
  const pInfo = `${game.pitchType.name} ${game.pitchKmh}km/h｜`;

  if (err + zonePenalty < 1.38) {
    const quality = 1 - (err + zonePenalty) / 1.38;
    AudioFX.crack(0.85 + quality * 0.45);
    const ev = 35 + quality * 15.5;
    const la = 2 + Math.random() * 28 + quality * 5;
    const spray = (z - 0.9) * 14 + (Math.random() * 18 - 9);
    const sim = simulateHit(ev, la, spray, 1.0);
    const dist = Math.hypot(sim.land.x, sim.land.z);
    launchVisualBall(ev, la, spray, 1.0);
    strikeZoneMesh.visible = false;
    btnSwing.style.display = 'none';
    game.stats.ab++;

    if (Math.abs(spray) > 45) {
      game.stats.ab--;
      if (game.strikes < 2) game.strikes++;
      setTicker(`${pInfo}${la < 10 ? '滾地界外' : '界外球'}（${game.balls}壞${game.strikes}好）`);
    } else if (dist >= 122) {
      AudioFX.cheer();
      game.stats.h++; game.stats.hr++;
      const sc = advanceRunners(4, false, true);
      setBanner('HOME RUN!!', `特大號全壘打！飛行距離 ${dist.toFixed(0)} 公尺（+${sc} 分）`);
      setTicker(`${pInfo}你轟出全壘打！攻下 ${sc} 分！`);
      nextBatter();
    } else if (la < 11) {
      const through = quality > 0.56 || Math.random() < 0.34;
      if (through) {
        AudioFX.cheer();
        game.stats.h++;
        const sc = advanceRunners(1, false, true);
        setBanner('滾地穿越安打！', sc > 0 ? `帶有 ${sc} 分打點！` : '強勁滾地穿出內野上壘！');
        setTicker(`${pInfo}你擊出滾地穿越安打！${sc > 0 ? ` 貢獻 ${sc} 分打點！` : ''}`);
        nextBatter();
      } else if (game.bases[0] && game.outs < 2 && Math.random() < 0.45) {
        game.bases[0] = false;
        setBanner('DOUBLE PLAY!', '內野滾地球雙殺打！');
        if (!addOuts(2, `${pInfo}內野滾地球遭到雙殺！`)) nextBatter();
      } else {
        if (!addOut(`${pInfo}內野滾地球遭到刺殺出局！`)) nextBatter();
      }
    } else if (la > 25 && dist < 104 && Math.random() < 0.64) {
      if (game.bases[2] && game.outs < 2 && dist > 72) {
        game.bases[2] = false;
        addRuns(1);
        game.stats.ab--;
        game.stats.rbi++;
        setBanner('高飛犧牲打！', '三壘跑者滑回本壘！+1 打點');
        if (!addOut(`${pInfo}你擊出高飛犧牲打！送回三壘跑者！`)) nextBatter();
      } else {
        if (!addOut(`${pInfo}外野高飛球遭到接殺出局！`)) nextBatter();
      }
    } else {
      AudioFX.cheer();
      game.stats.h++;
      const nb = dist > 105 ? 3 : (dist > 82 ? 2 : 1);
      const sc = advanceRunners(nb, false, true);
      const label = nb === 3 ? '三壘安打！' : (nb === 2 ? '二壘安打！' : '外野安打！');
      setBanner(label, sc > 0 ? `帶有 ${sc} 分打點！上壘準備跑壘` : '漂亮安打上壘！');
      setTicker(`${pInfo}你擊出${label}${sc > 0 ? ` 貢獻 ${sc} 分打點！` : ''}`);
      nextBatter();
    }
    if (game.subPhase !== 'CHANGE_SIDES' && game.subPhase !== 'OVER') {
      game.subPhase = 'WATCH_BALL';
      game.timer = 2.05;
    }
    updateGameUI();
  } else if (err < 2.6) {
    AudioFX.crack(0.6);
    if (game.strikes < 2) game.strikes++;
    setTicker(`${pInfo}擦棒界外（${game.balls}壞${game.strikes}好）`);
    launchVisualBall(25, 42, Math.random() > 0.5 ? 65 : -65, 0.5);
    game.subPhase = 'WATCH_BALL';
    game.timer = 1.2;
    updateGameUI();
  } else {
    AudioFX.tone(180, 0.12);
    game.strikes++;
    if (game.strikes >= 3) {
      game.stats.ab++;
      if (!addOut(`${pInfo}揮棒落空！三振出局！`)) {
        nextBatter();
        enterAfterPause(1.2);
      }
    } else {
      setTicker(`${pInfo}揮棒落空（${game.balls}壞${game.strikes}好）`);
      enterAfterPause(1.0);
    }
    updateGameUI();
  }
}

function attemptSteal() {
  if (game.subPhase !== 'OFF_SIM_WAIT' && game.subPhase !== 'OFF_SIM_PITCH') return;
  if (game.playerBase <= 0 || game.playerBase >= 3 || game.bases[game.playerBase]) return;
  btnSteal.style.display = 'none';
  game.runProgress = 0;
  game.runTargetBase = game.playerBase + 1;
  game.subPhase = 'BASE_STEAL';
  setTicker(`⚡ 發動盜壘！衝向${['', '', '二', '三'][game.runTargetBase]}壘！`);
  AudioFX.tone(540, 0.1);
}

function startInteractiveBaserunning(hitBases, isGround = false) {
  game.subPhase = 'BASE_RUN';
  game.runHitBases = hitBases;
  game.runInitialBases = [...game.bases];
  game.runInitialPlayerBase = game.playerBase;
  game.runProgress = 0;
  game.runTargetBase = game.playerBase + 1;
  game.runSafeTimeout = 2.6 + hitBases * 0.9;
  holdRun = false;
  btnSteal.style.display = 'none';
  btnRun.style.display = 'block';
  const label = isGround ? '滾地穿越安打' : (hitBases === 2 ? '二壘安打' : '外野安打');
  setBanner('隊友安打！', '按住「衝刺 / Space」往下一壘衝！');
  setTicker(`隊友擊出${label}！按住衝刺跑壘！`);
}

function finalizeInteractiveBaserunning(playerFinalBase, playerOut = false) {
  btnRun.style.display = 'none';
  const initB = game.runInitialBases;
  const initMe = game.runInitialPlayerBase;
  const hitB = game.runHitBases;
  const meAdvanced = playerOut ? Math.max(0, game.runTargetBase - 1 - initMe) : (playerFinalBase - initMe);
  const leadStep = Math.max(hitB, meAdvanced);

  const nextB = [false, false, false];
  let scored = 0;
  let leadOutAtHome = false;

  for (let i = 2; i >= 0; i--) {
    if (!initB[i] || i + 1 === initMe) continue;
    const baseNum = i + 1;
    const step = baseNum > initMe ? leadStep : hitB;
    const dest = baseNum + step;
    if (dest >= 4) {
      if (!playerOut && meAdvanced > hitB && Math.random() < 0.35) {
        leadOutAtHome = true;
      } else {
        scored++;
      }
    } else {
      nextB[dest - 1] = true;
    }
  }

  let batterDest = hitB;
  if (!playerOut && playerFinalBase >= 1 && playerFinalBase <= 3) {
    nextB[playerFinalBase - 1] = true;
    if (batterDest === playerFinalBase && batterDest > 1) batterDest = 1;
  }
  if (batterDest >= 1 && batterDest <= 3) nextB[batterDest - 1] = true;

  if (!playerOut && playerFinalBase >= 4) scored++;
  game.bases = nextB;
  game.playerBase = (!playerOut && playerFinalBase >= 1 && playerFinalBase <= 3) ? playerFinalBase : 0;
  addRuns(scored);

  const bName = ['', '一', '二', '三'][batterDest] + '壘';
  if (playerOut) {
    AudioFX.tone(160, 0.25);
    setBanner('OUT!', '外野回傳球到！觸殺出局！');
    if (!addOut(`搶壘遭到觸殺出局！隊友站上${bName}${scored > 0 ? `（前位跑者得 ${scored} 分）` : ''}`)) {
      nextBatter();
      enterAfterPause(1.6);
    }
  } else if (leadOutAtHome) {
    AudioFX.tone(240, 0.2);
    setBanner('SAFE!（本壘OUT）', `對方回傳本壘觸殺前位跑者！你安全上${['', '一', '二', '三'][playerFinalBase]}壘`);
    if (!addOut(`前位跑者本壘遭觸殺！你安全上${['', '一', '二', '三'][playerFinalBase]}壘，隊友上${bName}`)) {
      nextBatter();
      enterAfterPause(1.8);
    }
  } else if (playerFinalBase >= 4) {
    AudioFX.cheer();
    setBanner('SCORE!!', `滑回本壘！這球共攻下 ${scored} 分`);
    setTicker(`你跑回本壘得分！隊友站上${bName}（共 +${scored} 分）`);
    nextBatter();
    enterAfterPause(1.6);
  } else {
    setBanner('SAFE!', `安全上到${['', '一', '二', '三'][playerFinalBase]}壘`);
    setTicker(`你站上${['', '一', '二', '三'][playerFinalBase]}壘、隊友上${bName}${scored > 0 ? `｜前位跑者得分 (+${scored})` : ''}`);
    nextBatter();
    enterAfterPause(1.5);
  }
  updateGameUI();
}

function startInteractiveTagUp(spray) {
  game.subPhase = 'BASE_TAGUP';
  game.tagBallCaught = false;
  game.tagThrowTimer = 2.05;
  game.runProgress = 0;
  holdRun = false;
  launchVisualBall(39, 36, spray, 0.95);
  btnSteal.style.display = 'none';
  btnRun.style.display = 'block';
  setBanner('高飛犧牲打機會！', '轉頭看球！等外野手「接殺瞬間」再按住衝刺！');
  setTicker('隊友擊出外野高飛球！你在三壘準備 Tag-up！');
}

function updateInteractiveTagUp(dt) {
  if (!game.tagBallCaught) {
    stepPhysics(state.ballPos, state.ballVel, 0.95, dt);
    ballMesh.position.copy(state.ballPos);
    ballMesh.scale.setScalar(THREE.MathUtils.clamp(camera.position.distanceTo(state.ballPos) * 0.025, 1.0, 2.5));
    ballShadow.position.set(state.ballPos.x, 0.07, state.ballPos.z);

    if (holdRun) {
      game.runProgress += 0.65 * dt;
      const cur = new THREE.Vector3().lerpVectors(BASES[3], BASES[0], game.runProgress);
      cur.y = 1.65;
      camera.position.copy(cur);
      if (game.runProgress > 0.16) {
        btnRun.style.display = 'none';
        AudioFX.tone(150, 0.3);
        game.bases[2] = false;
        game.playerBase = 0;
        setBanner('提早離壘！', '還沒接殺就起跑，遭回傳三壘雙殺！');
        if (!addOuts(2, '高飛球提早離壘！回傳三壘形成雙殺！')) {
          nextBatter();
          enterAfterPause(1.8);
        }
        updateGameUI();
        return;
      }
    }
    lookTarget.lerp(state.ballPos, 0.2);
    camera.lookAt(lookTarget);

    if (state.ballPos.y <= 1.75 && state.ballVel.y < 0) {
      game.tagBallCaught = true;
      AudioFX.glovePop();
      AudioFX.tone(620, 0.14);
      setBanner('接殺！快衝！', '按住「衝刺 / Space」滑回本壘！');
      setTicker('外野手接殺出局！現在起跑衝本壘！');
    }
  } else {
    game.tagThrowTimer -= dt;
    if (holdRun) {
      game.runProgress = Math.min(1, game.runProgress + 0.66 * dt);
      const cur = new THREE.Vector3().lerpVectors(BASES[3], BASES[0], game.runProgress);
      cur.y = 1.65 + Math.sin(performance.now() * 0.024) * 0.09;
      camera.position.copy(cur);
      lookTarget.lerp(new THREE.Vector3(0, 1.2, 0), 0.22);
      camera.lookAt(lookTarget);
    }
    if (game.runProgress >= 1) {
      btnRun.style.display = 'none';
      AudioFX.cheer();
      game.bases[2] = false;
      game.playerBase = 0;
      addRuns(1);
      setBanner('SAFE! 得分！', '漂亮的高飛犧牲打！滑回本壘 +1 分');
      if (!addOut('高飛犧牲打成功！你滑回本壘攻下 1 分！')) {
        nextBatter();
        enterAfterPause(1.7);
      }
      updateGameUI();
    } else if (game.tagThrowTimer <= 0) {
      btnRun.style.display = 'none';
      if (game.runProgress > 0.18) {
        AudioFX.tone(160, 0.28);
        game.bases[2] = false;
        game.playerBase = 0;
        setBanner('OUT! 本壘助殺！', '外野雷射肩回傳本壘觸殺出局！');
        if (!addOuts(2, '高飛球接殺＋本壘助殺！形成雙殺！')) {
          nextBatter();
          enterAfterPause(1.8);
        }
      } else {
        setBanner('穩守三壘', '選擇不冒險，留在三壘');
        if (!addOut('外野高飛球接殺出局！你選擇留在三壘')) {
          nextBatter();
          enterAfterPause(1.4);
        }
      }
      updateGameUI();
    }
  }
}

function updateBaserunning(dt) {
  const from = BASES[game.playerBase];
  const to = BASES[game.runTargetBase % 4];
  const speed = game.subPhase === 'BASE_STEAL' ? 0.62 : (holdRun ? 0.72 : 0.08);
  game.runProgress = Math.min(1, game.runProgress + speed * dt);

  const cur = new THREE.Vector3().lerpVectors(from, to, game.runProgress);
  cur.y = 1.65 + (speed > 0.2 ? Math.sin(performance.now() * 0.022) * 0.09 : 0);
  camera.position.copy(cur);
  lookTarget.lerp(new THREE.Vector3(to.x, 1.3, to.z), 0.2);
  camera.lookAt(lookTarget);

  if (game.subPhase === 'BASE_STEAL') {
    if (game.runProgress >= 1) {
      const safe = Math.random() < 0.72;
      if (safe) {
        AudioFX.cheer();
        game.bases[game.playerBase - 1] = false;
        game.playerBase = game.runTargetBase;
        game.bases[game.playerBase - 1] = true;
        setBanner('SAFE!', `盜上${['', '', '二', '三'][game.playerBase]}壘成功！`);
        enterAfterPause(1.3);
      } else {
        AudioFX.tone(170, 0.25);
        game.bases[game.playerBase - 1] = false;
        game.playerBase = 0;
        setBanner('OUT!', '盜壘遭捕手阻殺出局！');
        if (!addOut('盜壘失敗出局！')) enterAfterPause(1.4);
      }
      updateGameUI();
    }
    return;
  }

  game.runSafeTimeout -= dt;
  if (game.runProgress >= 1) {
    if (game.runTargetBase >= 4) {
      finalizeInteractiveBaserunning(4, false);
      return;
    }
    game.playerBase = game.runTargetBase;
    AudioFX.tone(600, 0.12);
    if (holdRun && game.runSafeTimeout > 0.35) {
      game.runTargetBase = game.playerBase + 1;
      game.runProgress = 0;
      setBanner('繼續衝！', `挑戰直闖${game.runTargetBase === 4 ? '本壘' : '三壘'}！`);
    } else {
      finalizeInteractiveBaserunning(game.playerBase, false);
    }
  } else if (game.runSafeTimeout <= 0) {
    if (game.runProgress > 0.22) {
      finalizeInteractiveBaserunning(0, true);
    } else {
      const minForced = Math.min(4, game.runInitialPlayerBase + game.runHitBases);
      finalizeInteractiveBaserunning(Math.max(game.playerBase, minForced), false);
    }
  }
}

function updatePracticeScoreUI() {
  document.getElementById('stat-ok').textContent = state.ok;
  document.getElementById('stat-total').textContent = state.total;
  document.getElementById('stat-streak').textContent = state.streak;
}

function startPracticePitch() {
  resultCard.style.display = 'none';
  startWrap.style.display = 'none';
  quizControls.style.display = 'none';
  resetPlayerCF();
  batterMesh.visible = true;
  state.meta = generatePlayableBall(state.mode === 'quiz');
  state.phase = 'PITCHING';
  state.pitchT = 0; state.flightT = 0; state.quizChoice = null;
  trailPts.length = 0; trailGeo.setFromPoints([]);
  ballMesh.visible = true; ballMesh.position.set(0, 1.85, 18.44);
  ballShadow.visible = false; landingRing.visible = false;
  setBanner('', '投球中...');
}

function launchPracticeBall() {
  const m = state.meta;
  launchVisualBall(m.ev, m.la, m.spray, m.spin);
  state.meta = m;
  AudioFX.crack(THREE.MathUtils.clamp((m.ev - 36) / 12, 0.55, 1.25));
  state.phase = 'IN_FLIGHT';
  if (state.showMarker && state.mode === 'chase') {
    landingRing.position.set(m.land.x, 0.08, m.land.z);
    landingRing.visible = true;
  }
  setBanner('', state.mode === 'quiz' ? '看球！準備判斷前還是後...' : '');
}

function submitQuiz(choice) {
  if (state.phase !== 'QUIZ_WAIT') return;
  state.quizChoice = choice;
  quizControls.style.display = 'none';
  setBanner(choice === 'front' ? '你選：往前衝！' : '你選：往後退！', '揭曉真實落點...');
  landingRing.position.set(state.meta.land.x, 0.08, state.meta.land.z);
  landingRing.visible = true;
  state.phase = 'IN_FLIGHT';
}

function finishPracticePlay(outcome, title, sub, color) {
  state.phase = 'RESULT';
  state.total++;
  if (outcome) { state.ok++; state.streak++; } else state.streak = 0;
  updatePracticeScoreUI();
  const m = state.meta;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-title').style.color = color;
  document.getElementById('result-sub').textContent = sub;
  document.getElementById('st-ev').textContent = `${(m.ev * 3.6).toFixed(1)} km/h`;
  document.getElementById('st-la').textContent = `${m.la.toFixed(1)}°`;
  document.getElementById('st-dist').textContent = `${m.dist.toFixed(1)} m`;
  document.getElementById('st-hang').textContent = `${m.hang.toFixed(2)} s`;
  document.getElementById('st-delta').textContent = m.deltaZ < 0
    ? `站位前方 ${Math.abs(m.deltaZ).toFixed(1)} 公尺（往前衝）`
    : `站位後方 ${Math.abs(m.deltaZ).toFixed(1)} 公尺（往後退）`;
  document.getElementById('btn-next').textContent = '下一球（Space）';
  setBanner('', '');
  resultCard.style.display = 'block';
}

function switchMode(newMode) {
  state.mode = newMode;
  game.active = false;
  state.phase = 'IDLE';
  hideAllActionUI();
  resultCard.style.display = 'none';
  quizControls.style.display = 'none';
  startWrap.style.display = 'block';

    gameBug.style.display = 'block';
    practiceScore.style.display = 'none';
    ticker.style.display = 'none';
    document.getElementById('btn-start').textContent = 'PLAY BALL！（Space）';
    setBanner('3棒 中外野手', '完整九局第一人稱比賽｜守備・休息室・打擊・跑壘');
    resetPlayerCF();
    updateGameUI();
  } else {
    gameBug.style.display = 'none';
    practiceScore.style.display = 'flex';
    ticker.style.display = 'none';
    document.getElementById('btn-start').textContent = '投球（Space）';
    if (newMode === 'chase') {
      touchControls.style.display = 'block';
      setBanner('實戰追接模式', '靠視線與聲音判斷落點，跑位接殺飛球');

      setBanner('這顆飛球，前？後？', '擊球後 1.15 秒瞬間判斷往前衝還是往後退');
    }
    resetPlayerCF();
  }
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;

});

const minimap = document.getElementById('minimap');
const mctx = minimap.getContext('2d');
function drawMinimap() {
  const w = minimap.width, h = minimap.height;
  mctx.clearRect(0, 0, w, h);
  const ox = w / 2, oy = h - 16, scale = 1.12;
  mctx.beginPath();
  mctx.moveTo(ox, oy);
  mctx.arc(ox, oy, 122 * scale, -Math.PI * 0.75, -Math.PI * 0.25);
  mctx.closePath();
  mctx.fillStyle = 'rgba(56, 142, 60, 0.45)'; mctx.fill();
  mctx.strokeStyle = 'rgba(255,255,255,0.45)'; mctx.lineWidth = 2; mctx.stroke();

  const px = ox - player.pos.x * scale, pz = oy - player.pos.z * scale;
  if (state.mode !== 'game' || game.half === 'top') {
    mctx.fillStyle = '#29b6f6';
    mctx.beginPath(); mctx.arc(px, pz, 5, 0, Math.PI * 2); mctx.fill();
  }
  if (landingRing.visible && state.meta && state.meta.land) {
    mctx.strokeStyle = '#ffeb3b'; mctx.lineWidth = 2.5;
    mctx.beginPath(); mctx.arc(ox - state.meta.land.x * scale, oy - state.meta.land.z * scale, 6, 0, Math.PI * 2); mctx.stroke();
  }
  if (ballMesh.visible) {
    mctx.fillStyle = '#ffffff';
    mctx.beginPath(); mctx.arc(ox - ballMesh.position.x * scale, oy - ballMesh.position.z * scale, 3.5, 0, Math.PI * 2); mctx.fill();
  }
}

function updateCFMovement(dt, now) {
  if (player.diving) {
    player.diveTimer -= dt;
    const speed = 10.6 * Math.max(player.diveTimer / 0.52, 0.15);
    player.pos.addScaledVector(player.diveDir, speed * dt);
    player.pos.y = 0.72 + 0.55 * Math.sin((player.diveTimer / 0.52) * Math.PI);
    if (player.diveTimer <= 0) { player.diving = false; player.pos.y = 1.7; }
  } else {
    const input = getMoveInput();
    const maxSpeed = input.z > 0.3 ? 7.6 : 8.6;
    player.vel.lerp(input.multiplyScalar(maxSpeed), Math.min(1, dt * 8.5));
    player.pos.addScaledVector(player.vel, dt);
    player.pos.y = 1.7 + Math.sin(now * 0.018) * (player.vel.length() * 0.012);
  }
  const r = Math.hypot(player.pos.x, player.pos.z);
  if (r > wallRadius - 1.2) { player.pos.x *= (wallRadius - 1.2) / r; player.pos.z *= (wallRadius - 1.2) / r; }
  if (player.pos.z < 36) player.pos.z = 36;
  camera.position.copy(player.pos);
}

const lookTarget = new THREE.Vector3(0, 2.2, 0);
let lastTime = performance.now(), accum = 0;
const FIXED_DT = 1 / 120;

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (state.mode === 'game' && game.active) {
    if (game.subPhase === 'CHANGE_SIDES' || game.subPhase === 'PAUSE_NEXT') {
      game.timer -= dt;
      if (game.timer <= 0) enterCurrentRole();
    } else if (game.subPhase === 'DEF_WAIT' || game.subPhase === 'OFF_SIM_WAIT') {
      if (game.subPhase === 'DEF_WAIT') {
        updateCFMovement(dt, now);
        lookTarget.lerp(new THREE.Vector3(0, 1.8, 0), 0.12);
        camera.lookAt(lookTarget);
      }
      game.timer -= dt;
      if (game.timer <= 0) launchSimPitch(game.subPhase === 'DEF_WAIT');
    } else if (game.subPhase === 'DEF_PITCH' || game.subPhase === 'OFF_SIM_PITCH') {
      if (game.subPhase === 'DEF_PITCH') updateCFMovement(dt, now);
      state.pitchT += dt * state.speed;
      const p = Math.min(state.pitchT / game.pitchType.dur, 1);
      const pt = game.pitchType;
      ballMesh.position.set(
        pt.breakX * p * p,
        1.85 - p * 0.8 + Math.sin(p * Math.PI) * pt.arc + pt.breakY * p * p * 0.5,
        18.44 * (1 - p) + 0.3
      );
      ballMesh.scale.setScalar(game.subPhase === 'DEF_PITCH' ? 2.4 : 1.3);
      lookTarget.lerp(ballMesh.position, 0.2);
      camera.lookAt(lookTarget);
      if (p >= 1) resolveSimPitch(game.subPhase === 'DEF_PITCH');
    } else if (game.subPhase === 'DEF_CF_PLAY') {
      updateCFMovement(dt, now);
      accum += dt;
      while (accum >= FIXED_DT && game.subPhase === 'DEF_CF_PLAY') {
        stepPhysics(state.ballPos, state.ballVel, state.meta.spin, FIXED_DT);
        accum -= FIXED_DT;
        const horiz = Math.hypot(state.ballPos.x - player.pos.x, state.ballPos.z - player.pos.z);
        const reach = player.diving ? 2.85 : 2.15;
        if (horiz <= reach && state.ballPos.y <= 2.65 && state.ballPos.y >= 0.15 && state.ballVel.y < 0) {
          AudioFX.glovePop(); AudioFX.cheer();
          game.stats.po++;
          landingRing.visible = false;
          const isSac = game.bases[2] && game.outs < 2 && player.pos.z > 78 && Math.random() < 0.65;
          if (isSac) {
            game.bases[2] = false;
            addRuns(1);
            setBanner('接殺（高飛犧牲打）', '三壘跑者趁傳滑回本壘失 1 分');
            if (!addOut('中外野深遠飛球接殺！但三壘跑者跑回本壘得分')) {
              nextBatter();
              enterAfterPause(1.6);
            }
          } else {
            setBanner(player.diving ? '美技撲接！' : '接殺出局！', '');
            if (!addOut(player.diving ? '中外野五星級撲接接殺！' : '中外野飛球穩穩接殺出局！')) {
              nextBatter();
              enterAfterPause(1.5);
            }
          }
          break;
        }
        if (state.ballPos.y <= 0.11) {
          state.ballPos.y = 0.11;
          AudioFX.thud();
          landingRing.visible = false;
          const miss = Math.hypot(state.ballPos.x - player.pos.x, state.ballPos.z - player.pos.z);
          const nb = state.ballPos.z > player.pos.z + 3 || miss > 12 ? 2 : 1;
          const sc = advanceRunners(nb, false, false);
          setBanner(nb === 2 ? '長打落地！' : '安打落地！', `距離差 ${miss.toFixed(1)} 公尺${sc > 0 ? `｜失 ${sc} 分` : ''}`);
          setTicker(`中外野${nb === 2 ? '二壘安打' : '一壘安打'}！${sc > 0 ? ` 客隊得 ${sc} 分` : ''}`);
          nextBatter();
          enterAfterPause(1.7);
          break;
        }
      }
      ballMesh.position.copy(state.ballPos);
      ballMesh.scale.setScalar(THREE.MathUtils.clamp(camera.position.distanceTo(state.ballPos) * 0.026, 1.0, 2.8));
      ballShadow.position.set(state.ballPos.x, 0.07, state.ballPos.z);
      lookTarget.lerp(state.ballPos, 0.22);
      camera.lookAt(lookTarget);
    } else if (game.subPhase === 'BAT_WAIT') {
      game.timer -= dt;
      if (game.timer <= 0) launchPlayerAtBatPitch();
    } else if (game.subPhase === 'BAT_PITCH') {
      state.pitchT += dt;
      const p = Math.min(state.pitchT / game.pitchDur, 1);
      const t = game.pitchTarget;
      const pt = game.pitchType;
      const bx = (t.x - pt.breakX) * p + pt.breakX * p * p;
      const by = 1.85 + (t.y - 1.85 - pt.breakY) * p + pt.breakY * p * p + Math.sin(p * Math.PI) * pt.arc;
      const bz = 18.44 * (1 - p) + t.z * p;
      ballMesh.position.set(bx, by, bz);
      ballMesh.scale.setScalar(1.15);
      if (p >= 1) {
        if (!game.pitchSwung) {
          AudioFX.glovePop();
          const pInfo = `${pt.name} ${game.pitchKmh}km/h｜`;
          if (game.pitchIsStrike) {
            game.strikes++;
            if (game.strikes >= 3) {
              game.stats.ab++;
              if (!addOut(`${pInfo}好球沒揮棒！遭到三振出局！`)) { nextBatter(); enterAfterPause(1.2); }
            } else { setTicker(`${pInfo}好球進壘（${game.balls}壞${game.strikes}好）`); enterAfterPause(0.95); }
          } else {
            game.balls++;
            if (game.balls >= 4) {
              AudioFX.cheer();
              game.stats.bb++;
              advanceRunners(1, true, true);
              setBanner('BALL FOUR!', '選到四壞球保送上一壘！');
              setTicker(`${pInfo}選球漂亮！四壞球保送上一壘`);
              nextBatter();
              enterAfterPause(1.4);
            } else { setTicker(`${pInfo}壞球！選得好（${game.balls}壞${game.strikes}好）`); enterAfterPause(0.95); }
          }
          updateGameUI();
        }
      }
    } else if (game.subPhase === 'WATCH_BALL') {
      if (state.ballVel.lengthSq() > 0.2) {
        stepPhysics(state.ballPos, state.ballVel, state.meta ? state.meta.spin : 0.8, dt);
        if (state.ballPos.y <= 0.11) {
          state.ballPos.y = 0.11;
          if (Math.abs(state.ballVel.y) > 1.2) {
            state.ballVel.y = Math.abs(state.ballVel.y) * 0.42;
            state.ballVel.x *= 0.85;
            state.ballVel.z *= 0.85;
          } else {
            state.ballVel.y = 0;
            state.ballVel.x *= 0.96;
            state.ballVel.z *= 0.96;
          }
        }
        ballMesh.position.copy(state.ballPos);
        ballMesh.scale.setScalar(THREE.MathUtils.clamp(camera.position.distanceTo(state.ballPos) * 0.024, 1.0, 2.5));
        ballShadow.position.set(state.ballPos.x, 0.07, state.ballPos.z);
        lookTarget.lerp(state.ballPos, 0.16);
        camera.lookAt(lookTarget);
      }
      game.timer -= dt;
      if (game.timer <= 0) enterCurrentRole();
    } else if (game.subPhase === 'BASE_RUN' || game.subPhase === 'BASE_STEAL') {
      updateBaserunning(dt);
    } else if (game.subPhase === 'BASE_TAGUP') {
      updateInteractiveTagUp(dt);
    }
  } else if (state.mode !== 'game') {
    if (state.phase === 'PITCHING') {
      state.pitchT += dt;
      const p = Math.min(state.pitchT / 0.48, 1);
      ballMesh.position.set(0, 1.85 - p * 0.8, 18.44 * (1 - p) + 0.3);
      ballMesh.scale.setScalar(2.4);
      lookTarget.lerp(new THREE.Vector3(0, 1.6, 0), 0.15);
      camera.lookAt(lookTarget);
      if (p >= 1) launchPracticeBall();
    } else if (state.phase === 'IN_FLIGHT') {
      if (state.mode === 'chase') updateCFMovement(dt, now);
      accum += dt;
      while (accum >= FIXED_DT && state.phase === 'IN_FLIGHT') {
        stepPhysics(state.ballPos, state.ballVel, state.meta.spin, FIXED_DT);
        state.flightT += FIXED_DT;
        accum -= FIXED_DT;
        if (state.mode === 'quiz' && !state.quizChoice && state.flightT >= 1.15) {
          state.phase = 'QUIZ_WAIT';
          quizControls.style.display = 'flex';
          setBanner('這顆飛球，前？後？', '立刻選擇！');
          break;
        }
        if (state.mode === 'chase') {
          const horiz = Math.hypot(state.ballPos.x - player.pos.x, state.ballPos.z - player.pos.z);
          const reach = player.diving ? 2.85 : 2.15;
          if (horiz <= reach && state.ballPos.y <= 2.65 && state.ballPos.y >= 0.15 && state.ballVel.y < 0) {
            AudioFX.glovePop(); AudioFX.tone(660, 0.22);
            finishPracticePlay(true, player.diving ? '美技撲接接殺！' : '穩穩接殺出局！', `落點偏差 ${horiz.toFixed(2)} 公尺`, '#66bb6a');
            break;
          }
        }
        if (state.ballPos.y <= 0.11) {
          state.ballPos.y = 0.11;
          AudioFX.thud();
          if (state.mode === 'quiz') {
            const correct = state.meta.deltaZ < 0 ? 'front' : 'back';
            const ok = state.quizChoice === correct;
            AudioFX.tone(ok ? 720 : 180, 0.22);
            finishPracticePlay(ok, ok ? '判斷正確！' : '判斷失誤！', `正確方向：${correct === 'front' ? '往前衝（前）' : '往後退（後）'}`, ok ? '#66bb6a' : '#ef5350');
          } else {
            const miss = Math.hypot(state.ballPos.x - player.pos.x, state.ballPos.z - player.pos.z);
            finishPracticePlay(false, state.ballPos.z > player.pos.z + 2 ? '越過頭頂長打！' : '落地安打！', `落地距離差 ${miss.toFixed(1)} 公尺`, '#ef5350');
          }
          break;
        }
      }
      ballMesh.position.copy(state.ballPos);
      ballMesh.scale.setScalar(THREE.MathUtils.clamp(camera.position.distanceTo(state.ballPos) * 0.026, 1.0, 2.8));
      ballShadow.position.set(state.ballPos.x, 0.07, state.ballPos.z);
      if (state.mode === 'quiz' && state.quizChoice) {
        trailPts.push(state.ballPos.clone());
        trailGeo.setFromPoints(trailPts);
      }
      lookTarget.lerp(state.ballPos, 0.22);
      camera.lookAt(lookTarget);
    } else if (state.phase === 'QUIZ_WAIT') {
      camera.lookAt(lookTarget);
    }
  }

  drawMinimap();
  renderer.render(scene, camera);
}

switchMode('game');
requestAnimationFrame(animate);
</script>
</body>
</html>
