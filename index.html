<script>
  (() => {
    const c = document.createElement('canvas');
    c.width = c.height = 512;
    const g = c.getContext('2d');
    g.fillStyle = '#14452f';
    g.fillRect(0, 0, 512, 512);
    g.font = '320px sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText('⚾', 256, 276);
    const icon = c.toDataURL('image/png');
    const addLink = (rel, href) => {
      const l = document.createElement('link');
      l.rel = rel; l.href = href;
      document.head.appendChild(l);
    };
    addLink('icon', icon);
    addLink('apple-touch-icon', icon);
    const manifest = {
      name: '外野飛球 3D',
      short_name: '外野飛球',
      display: 'standalone',
      background_color: '#0b1622',
      theme_color: '#0b1622',
      start_url: location.href,
      icons: [{ src: icon, sizes: '512x512', type: 'image/png' }]
    };
    addLink('manifest', 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest)));
  })();
</script>

<script>
const AudioFX = (() => {
  let ctx = null;
  function ensure() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
  }
  function crack(power = 1) {
    ensure();
    const now = ctx.currentTime;
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.14, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.018));
    const noise = ctx.createBufferSource();
    noise.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass'; filter.frequency.value = 1400 + power * 500; filter.Q.value = 1.4;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.85 * power, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
    noise.connect(filter).connect(gain).connect(ctx.destination);
    noise.start(now);
    const osc = ctx.createOscillator(), og = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(520 + power * 180, now);
    osc.frequency.exponentialRampToValueAtTime(140, now + 0.06);
    og.gain.setValueAtTime(0.45 * power, now);
    og.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
    osc.connect(og).connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.07);
  }
  function glovePop() {
    ensure();
    const now = ctx.currentTime, osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(210, now);
    osc.frequency.exponentialRampToValueAtTime(55, now + 0.09);
    g.gain.setValueAtTime(0.7, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc.connect(g).connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.1);
  }
  function thud() {
    ensure();
    const now = ctx.currentTime, osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(110, now);
    osc.frequency.exponentialRampToValueAtTime(38, now + 0.12);
    g.gain.setValueAtTime(0.48, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
    osc.connect(g).connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.13);
  }
  function tone(freq, dur = 0.15) {
    ensure();
    const now = ctx.currentTime, osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(0.2, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(g).connect(ctx.destination);
    osc.start(now); osc.stop(now + dur);
  }
  function cheer() {
    tone(523, 0.14);
    setTimeout(() => tone(659, 0.14), 90);
    setTimeout(() => tone(784, 0.25), 180);
  }
  return { crack, glovePop, thud, tone, cheer };

function createGrassTexture() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const g = c.getContext('2d');
  for (let i = 0; i < 16; i++) {
    g.fillStyle = i % 2 === 0 ? '#2f7a32' : '#388a3a';
    g.fillRect(0, i * 32, 512, 32);
  }
  for (let i = 0; i < 5000; i++) {
    g.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.04)';
    g.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(16, 16);
  return tex;
}

function createCrowdTexture() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#243447'; g.fillRect(0, 0, 512, 128);
  const colors = ['#cfd8dc', '#90caf9', '#ef9a9a', '#ffe082', '#ffffff', '#546e7a', '#1e88e5'];
  for (let y = 6; y < 124; y += 8) {
    g.fillStyle = '#1b2838'; g.fillRect(0, y + 4, 512, 2);
    for (let x = 2; x < 512; x += 6) {
      if (Math.random() > 0.25) {
        g.fillStyle = colors[Math.floor(Math.random() * colors.length)];
        g.fillRect(x, y, 4, 5);
      }
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping; tex.repeat.set(14, 1);
  return tex;
}

const joy = { active: false, dx: 0, dy: 0, id: null };
const joyZone = document.getElementById('joy-zone');
const joyKnob = document.getElementById('joy-knob');

function updateJoy(cx, cy) {
  const rect = joyZone.getBoundingClientRect();
  const maxR = rect.width * 0.38;
  let dx = cx - (rect.left + rect.width / 2);
  let dy = cy - (rect.top + rect.height / 2);
  const len = Math.hypot(dx, dy);
  if (len > maxR) { dx = dx / len * maxR; dy = dy / len * maxR; }
  joy.dx = dx / maxR; joy.dy = dy / maxR;
  joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
}
joyZone.addEventListener('pointerdown', e => { joy.active = true; joy.id = e.pointerId; joyZone.setPointerCapture(e.pointerId); updateJoy(e.clientX, e.clientY); });
joyZone.addEventListener('pointermove', e => { if (joy.active && e.pointerId === joy.id) updateJoy(e.clientX, e.clientY); });
function endJoy() { joy.active = false; joy.dx = 0; joy.dy = 0; joyKnob.style.transform = 'translate(0px, 0px)'; }
joyZone.addEventListener('pointerup', endJoy);
joyZone.addEventListener('pointercancel', endJoy);

  document.getElementById('sc-inn').textContent = `${game.inning}${game.half === 'top' ? '上' : '下'}`;
  const order = game.half === 'top' ? game.awayOrder : game.homeOrder;
  const isMeBat = isPlayerOffense() && order === game.playerOrder;
  document.getElementById('sc-batter').textContent = isPlayerDefense() ? `對手 ${order}棒` : (isMeBat ? `我 ${game.playerOrder}棒(你)` : `我方 ${order}棒`);

  for (let i = 0; i < 3; i++) {
    const el = document.getElementById(`b${i + 1}`);
    el.className = 'base-sq';
    if (isPlayerOffense() && game.playerBase === i + 1) el.classList.add('me');
    else if (game.bases[i]) el.classList.add('on');
  }
  for (let i = 0; i < 3; i++) document.getElementById(`db${i}`).className = 'dot' + (i < game.balls ? ' b' : '');
  for (let i = 0; i < 2; i++) document.getElementById(`ds${i}`).className = 'dot' + (i < game.strikes ? ' s' : '');
  for (let i = 0; i < 2; i++) document.getElementById(`do${i}`).className = 'dot' + (i < game.outs ? ' o' : '');

  const badge = document.getElementById('role-badge');
  badge.className = 'role-badge';
  const prevOrder = game.playerOrder === 1 ? 9 : game.playerOrder - 1;
  if (isPlayerFielding()) badge.textContent = `${POS_MAP[game.playerPos].name}守備`;
  else if (isPlayerDefense()) { badge.textContent = '休息室觀戰（DH）'; badge.classList.add('dug'); }
  else if (game.playerBase > 0) { badge.textContent = `${['', '一', '二', '三'][game.playerBase]}壘跑者`; badge.classList.add('run'); }
  else if (getMyOrder() === game.playerOrder) { badge.textContent = `打擊區（${game.playerOrder}棒）`; badge.classList.add('bat'); }
  else if (getMyOrder() === prevOrder) { badge.textContent = '打擊準備區'; badge.classList.add('bat'); }
  else { badge.textContent = '休息室觀戰'; badge.classList.add('dug'); }

  const s = game.stats;
  document.getElementById('my-stats').textContent = game.playerPos === 'DH'
    ? `${s.ab}-${s.h} | ${s.hr}HR | ${s.rbi}打點`
    : `${s.ab}-${s.h} | ${s.hr}HR | ${s.po}接殺`;
  syncStaticRunners();
}

function stepPhysics(pos, vel, spin, dt) {
  const speed = vel.length();
  const drag = 0.0046 * speed;
  vel.x -= drag * vel.x * dt;
  vel.y -= (9.81 + drag * vel.y) * dt;
  vel.z -= drag * vel.z * dt;
  vel.y += spin * speed * 0.0014 * dt;
  pos.addScaledVector(vel, dt);
}

function simulateHit(ev, laDeg, sprayDeg, spin) {
  const la = THREE.MathUtils.degToRad(laDeg);
  const sp = THREE.MathUtils.degToRad(sprayDeg);
  const pos = new THREE.Vector3(0, 1.05, 0.3);
  const vel = new THREE.Vector3(ev * Math.cos(la) * Math.sin(sp), ev * Math.sin(la), ev * Math.cos(la) * Math.cos(sp));
  const dt = 1 / 120;
  let t = 0, maxH = 0;
  while (pos.y > 0.1 && t < 10) {
    stepPhysics(pos, vel, spin, dt);
    if (pos.y > maxH) maxH = pos.y;
    t += dt;
  }
  return { land: pos.clone(), hang: t, maxH };
}

function generatePlayableBall(narrow = false) {
  for (let tries = 0; tries < 80; tries++) {
    const ev = 38 + Math.random() * 10.5;
    const la = 19 + Math.random() * 28;
    const spray = narrow ? (Math.random() * 10 - 5) : (Math.random() * 24 - 12);
    const spin = 0.8 + Math.random() * 1.1;
    const sim = simulateHit(ev, la, spray, spin);
    const dist = Math.hypot(sim.land.x, sim.land.z);
    const deltaZ = sim.land.z - START_POS.z;
    if (narrow) {
      if (dist > 64 && dist < 118 && Math.abs(deltaZ) > 5.5 && Math.abs(deltaZ) < 25) return { ev, la, spray, spin, ...sim, dist, deltaZ };
    } else {
      if (dist > 62 && dist < 120 && Math.abs(sim.land.x) < 28) return { ev, la, spray, spin, ...sim, dist, deltaZ };
    }
  }
  const sim = simulateHit(43, 30, 0, 1.2);
  return { ev: 43, la: 30, spray: 0, spin: 1.2, ...sim, dist: sim.land.z, deltaZ: sim.land.z - START_POS.z };
}

function getMoveInput() {
  let x = 0, y = 0;
  if (keys['KeyW'] || keys['ArrowUp']) y -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) y += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) x -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) x += 1;
  if (joy.active) { x += joy.dx; y += joy.dy; }
  const len = Math.hypot(x, y);
  if (len > 1) { x /= len; y /= len; }
  const forward = new THREE.Vector3();
  camera.getWorldDirection(forward);
  forward.y = 0;
  if (forward.lengthSq() > 0.0001) forward.normalize();
  else forward.set(0, 0, -1);
  const right = new THREE.Vector3(-forward.z, 0, forward.x);
  return new THREE.Vector3().addScaledVector(forward, -y).addScaledVector(right, x);
}

function triggerDive() {
  if (player.diving) return;
  const dir = getMoveInput();
  if (dir.lengthSq() < 0.05) dir.set(state.ballPos.x - player.pos.x, 0, state.ballPos.z - player.pos.z);
  dir.y = 0;
  if (dir.lengthSq() > 0.001) dir.normalize();
  player.diving = true; player.diveTimer = 0.52; player.diveDir.copy(dir);
  AudioFX.tone(180, 0.08);
}

function handleDefenseAction() {
  if (!game.play) return;
  if (player.hasBall) {
    if (POS_MAP[game.playerPos].isIF) {
      setBanner('請選擇傳球壘包！', '按 一 / 二 / 三 / 本（或鍵盤 1~4）');
    } else {
      throwBallFromCF(0, true);
    }
  } else if (game.play.landed && !game.play.fielded) {
    const d = Math.hypot(state.ballPos.x - player.pos.x, state.ballPos.z - player.pos.z);
    if (d < 4.0) pickUpBallCF();
  } else if (!game.play.landed) {
    triggerDive();
  }
}

function pickUpBallCF() {
  if (!game.play || game.play.fielded) return;
  game.play.fielded = true;
  game.play.fielderId = game.playerPos;
  player.hasBall = true;
  AudioFX.glovePop();
  setBanner('撿到球了！', game.playerPos === '1B'
    ? '可自踩一壘，或按 一 / 二 / 三 / 本 傳球！'
    : (POS_MAP[game.playerPos].isIF
      ? '按 一 / 二 / 三 / 本（或數字鍵 1~4）傳球！'
      : '按 一 / 二 / 三 / 本 直傳，或中間「轉傳」！'));
  updateDiveBtnState();
}

function getBestThrowTargetBase(forPlayerSS = false) {
  if (forPlayerSS && isPlayerIF() && !(game.play && game.play.isRelayThrow)) {
    if (game.bases[0] && game.outs < 2 && !game.play.dpCoverDone) return 2;
    return 1;
  }
  let leadTarget = 2;
  liveRunners.forEach(r => {
    if (!r.out && !r.scored && !r.retreating) {
      if (r.baseTo > leadTarget) leadTarget = r.baseTo;
    }
  });
  return Math.min(4, Math.max(2, leadTarget));
}
function getCutoffFielder(fromPos) {
  let best = null, bestDist = Infinity;
  fielders.forEach(f => {
    if (f.type !== 'IF' || !f.mesh.visible) return;
    const d = Math.hypot(f.pos.x - fromPos.x, f.pos.z - fromPos.z);
    if (d < bestDist) { bestDist = d; best = f; }
  });
  if (isPlayerIF()) {
    const pd = Math.hypot(player.pos.x - fromPos.x, player.pos.z - fromPos.z);
    if (pd < bestDist) {
      return { id: `${game.playerPos}(你)`, pos: player.pos, isPlayer: true };
    }
  }
  return best || getFielderById('2B');
}
function getRunnerProgressTo(tb) {
  let maxP = -1;
  liveRunners.forEach(r => {
    if (!r.out && !r.scored && !r.stopped && !r.retreating && r.baseTo === tb && r.progress > 0.02) {
      if (r.progress > maxP) maxP = r.progress;
    }
  });
  return maxP;
}
function hasRunnerMovingTo(tb) {
  const p = getRunnerProgressTo(tb);
  return p >= 0 && p <= 0.75;
}
function getBaseCoverFielder(tb, excludeId = '') {
  if (tb === 4) return { id: 'C', pos: catcherMesh.position, isCatcher: true };
  const basePos = BASES[tb % 4];
  let best = null, bestDist = 16;
  fielders.forEach(f => {
    if (f.type !== 'IF' || !f.mesh.visible || f.id === excludeId) return;
    const d = Math.hypot(f.pos.x - basePos.x, f.pos.z - basePos.z);
    if (d < bestDist) { bestDist = d; best = f; }
  });
  if (tb === 1 && excludeId !== 'P') {
    const pd = Math.hypot(pitcherMesh.position.x - basePos.x, pitcherMesh.position.z - basePos.z);
    if (pd < bestDist) { bestDist = pd; best = { id: 'P', pos: pitcherMesh.position, mesh: pitcherMesh }; }
  }
  if (isPlayerIF() && excludeId !== 'PLAYER') {
    const myD = Math.hypot(player.pos.x - basePos.x, player.pos.z - basePos.z);
    if (myD < bestDist) {
      bestDist = myD;
      best = { id: `${game.playerPos}(你)`, pos: player.pos, isPlayer: true };
    }
  }
  return best;
}

function throwBallFromCF(manualBase = 0, forceCutoff = false) {
  if (!game.play) return;
  const pl = game.play;
  if (!forceCutoff && manualBase === 1 && game.playerPos === '1B') {
    const cover1B = getBaseCoverFielder(1, 'PLAYER');
    const myDist1B = Math.hypot(player.pos.x - BASES[1].x, player.pos.z - BASES[1].z);
    const coverDist1B = cover1B ? Math.hypot(cover1B.pos.x - BASES[1].x, cover1B.pos.z - BASES[1].z) : Infinity;
    const isCovering1B = cover1B && (cover1B.id === 'P' || (cover1B.id === '2B' && pl.tag === '軟弱滾地') || coverDist1B < 8);
    if (!player.hasBall) {
      if (!isCovering1B || myDist1B <= coverDist1B) {
        pl.autoRun1B = true;
      }
      return;
    }
    if (!isCovering1B || myDist1B <= coverDist1B) {
      pl.autoRun1B = true;
      pl.waitingEnd = false;
      pl.endCooldown = 0;
      return;
    }
  }
  if (!player.hasBall) return;
  pl.autoRun1B = false;
  player.hasBall = false;
  pl.waitingEnd = false;
  pl.endCooldown = 0;
  pl.playerCoverBase = 0;
  pl.throwDelay = 0.22;
  pl.fielderRef = null;
  pl.pendingFromPlayer = true;

  if (forceCutoff || manualBase === 0) {
    const cutoff = getCutoffFielder(player.pos);
    const targetBase = getBestThrowTargetBase(false);
    pl.relayActive = true;
    pl.cutoffFielder = cutoff;
    pl.relayFinalBase = targetBase;
    pl.pendingThrowTargetPos = cutoff.pos.clone().setY(1.4);
    pl.pendingThrowTargetBase = -1;
    setBanner(`轉傳 ${cutoff.id}`, '');
  } else {
    const targetBase = manualBase;
    const bName = ['本壘', '一壘', '二壘', '三壘', '本壘'][targetBase];
    const cover = getBaseCoverFielder(targetBase, 'PLAYER');
    pl.relayActive = false;
    pl.throwTargetFielder = cover;
    pl.pendingThrowTargetPos = cover ? cover.pos.clone().setY(1.35) : BASES[targetBase % 4].clone().setY(1.2);
    pl.pendingThrowTargetBase = targetBase;
    if (POS_MAP[game.playerPos].isIF && targetBase === 2 && game.bases[0] && game.outs < 2 && !pl.dpCoverDone && !pl.flyCaught) {
      pl.dpSecondThrow = true;
      pl.fielderId = game.playerPos;
    }
    setBanner(`傳${bName}！`, '');
  }
  updateDiveBtnState();
}

  player.pos.copy(getPlayerStartPos());

function addRuns(n) {
  if (n <= 0) return;
  if (game.half === 'top') game.awayScore += n;
  else game.homeScore += n;
}

function nextBatter() {
  game.balls = 0; game.strikes = 0;
  if (game.half === 'top') game.awayOrder = (game.awayOrder % 9) + 1;
  else game.homeOrder = (game.homeOrder % 9) + 1;
}

function addOuts(count, msg) {
  game.outs += count;
  setTicker(msg);
  if (game.outs >= 3) {
    game.outs = 0; game.balls = 0; game.strikes = 0;
    game.bases = [false, false, false];
    game.playerBase = 0;
    clearLiveRunners();
    if (game.half === 'top') game.awayOrder = (game.awayOrder % 9) + 1;
    else game.homeOrder = (game.homeOrder % 9) + 1;

    if (game.half === 'bottom' && game.inning >= 9) { endFullGame(); return true; }
    if (game.half === 'top') {
      game.half = 'bottom';
      if (game.inning === 9 && game.homeScore > game.awayScore) { endFullGame(); return true; }
      setBanner(`${game.inning}局下半`, isPlayerFielding() ? `三出局攻守交換｜前往${POS_MAP[game.playerPos].name}守備！` : (isPlayerDefense() ? '三出局攻守交換｜回休息室觀戰！' : '三出局攻守交換｜換我方進攻！'));
    } else {
      game.half = 'top';
      game.inning++;
      setBanner(`${game.inning}局上半`, isPlayerFielding() ? `三出局攻守交換｜前往${POS_MAP[game.playerPos].name}守備！` : (isPlayerDefense() ? '三出局攻守交換｜回休息室觀戰！' : '三出局攻守交換｜換我方進攻！'));
    }
    game.subPhase = 'CHANGE_SIDES';
    game.timer = 2.2;
    hideAllActionUI();
    updateGameUI();
    return true;
  }
  return false;
}
function addOut(msg) { return addOuts(1, msg); }

function endFullGame() {
  game.active = false; game.subPhase = 'OVER';
  hideAllActionUI(); clearLiveRunners();
  const myScore = game.playerSide === 'home' ? game.homeScore : game.awayScore;
  const oppScore = game.playerSide === 'home' ? game.awayScore : game.homeScore;
  const win = myScore > oppScore;
  const tie = myScore === oppScore;
  document.getElementById('result-title').textContent = win ? '比賽勝利！' : (tie ? '握手言和' : '惜敗收場');
  document.getElementById('result-title').style.color = win ? '#66bb6a' : (tie ? '#ffca28' : '#ef5350');
  document.getElementById('result-sub').textContent = `終場比數 客隊 ${game.awayScore} : ${game.homeScore} 主隊（你是${game.playerSide === 'home' ? '主隊' : '客隊'}）`;
  const s = game.stats;
  document.getElementById('st-ev').textContent = `${s.ab} 打數 ${s.h} 安打`;
  document.getElementById('st-la').textContent = `${s.hr} 支全壘打`;
  document.getElementById('st-dist').textContent = `${s.rbi} 打點 / ${s.bb} 保送`;
  document.getElementById('st-hang').textContent = `${s.po} 次接殺`;
  document.getElementById('st-delta').textContent = `打擊率 ${s.ab > 0 ? (s.h / s.ab).toFixed(3) : '.000'}`;
  document.getElementById('btn-next').textContent = '再打一場（Space）';
  resultCard.style.display = 'block';
  updateGameUI();
}

function enterCurrentRole() {
  hideAllActionUI();
  clearLiveRunners();
  game.play = null;
  player.hasBall = false;
  ballMesh.visible = false; ballShadow.visible = false;
  batterMesh.visible = true;
  setBanner('', '');
  updateDiveBtnState();

  if (isPlayerDefense() && game.playerPos === 'DH') {
    resetFielders(false, 0x1565c0);
    camera.position.copy(DUGOUT_POS);
    lookTarget.set(0, 1.4, 15);
    camera.lookAt(lookTarget);
    game.subPhase = 'OFF_SIM_WAIT';
    game.timer = 1.35 / state.speed;
    setTicker(`對手 ${getOppOrder()} 棒打擊中｜你在休息室觀戰（DH）`);
  } else if (isPlayerDefense()) {
    resetFielders(true, 0x1565c0);
    resetPlayerCF();
    touchControls.style.display = 'block';
    game.subPhase = 'DEF_WAIT';
    game.timer = 1.35 / state.speed;
    setTicker(`對手 ${getOppOrder()} 棒打擊中｜你在${POS_MAP[game.playerPos].name}待命`);
  } else {
    resetFielders(false, 0xc62828);
    if (game.playerBase > 0) {
      const bPos = BASES[game.playerBase];
      camera.position.set(bPos.x, 1.65, bPos.z);
      lookTarget.set(0, 1.4, 10);
      camera.lookAt(lookTarget);
      actionBar.style.display = 'flex';

      game.subPhase = 'OFF_SIM_WAIT';
      game.timer = 1.5 / state.speed;
      setTicker(`你在${['', '一', '二', '三'][game.playerBase]}壘｜隊友 ${getMyOrder()} 棒打擊中`);
    } else if (getMyOrder() === game.playerOrder) {
      batterMesh.visible = false;
      camera.position.copy(getBatterCamPos());
      lookTarget.set(0, 1.1, 18.44);
      camera.lookAt(lookTarget);
      strikeZoneMesh.visible = true;
      actionBar.style.display = 'flex';
      btnSwing.style.display = 'block';
      game.subPhase = 'BAT_WAIT';
      game.timer = 1.25;
      setTicker(`輪到你了（第 ${game.playerOrder} 棒・${game.playerHand === 'L' ? '左打' : '右打'}）！盯緊投手準備揮棒`);
    } else {
      const prevOrder = game.playerOrder === 1 ? 9 : game.playerOrder - 1;
      const isOnDeck = getMyOrder() === prevOrder;
      camera.position.copy(isOnDeck ? ONDECK_POS : DUGOUT_POS);
      lookTarget.set(0, 1.4, 15);
      camera.lookAt(lookTarget);
      game.subPhase = 'OFF_SIM_WAIT';
      game.timer = 1.35 / state.speed;
      setTicker(isOnDeck ? '打擊準備區熱身中（下一棒就是你！）' : `休息室觀戰｜我方 ${getMyOrder()} 棒打擊中`);
    }
  }
  updateGameUI();
}

function pickPitchType() {
  const pt = PITCH_TYPES[Math.floor(Math.random() * PITCH_TYPES.length)];
  const kmh = Math.round(pt.minKmh + Math.random() * (pt.maxKmh - pt.minKmh));
  return { pt, kmh };
}

function launchSimPitch(isDefense) {
  game.subPhase = isDefense ? 'DEF_PITCH' : 'OFF_SIM_PITCH';
  state.pitchT = 0;
  const picked = pickPitchType();
  game.pitchType = picked.pt;
  game.pitchKmh = picked.kmh;
  ballMesh.visible = true;
  ballMesh.position.set(0, 1.85, 18.44);

  const r = Math.random();
  if (r < 0.24) game.simResult = 'BALL';
  else if (r < 0.42) game.simResult = 'STRIKE_LOOK';
  else if (r < 0.54) game.simResult = 'STRIKE_SWING';
  else if (r < 0.62) game.simResult = 'FOUL_FLY';
  else if (r < 0.69) game.simResult = 'FOUL_GROUND';
  else game.simResult = 'IN_PLAY';
}

function generateBattedBallParams() {
  const r = Math.random();
  const isIF = isPlayerIF();
  const isSS = isIF && game.playerPos === 'SS';
  const is1B = isIF && game.playerPos === '1B';
  const isOF = isPlayerFielding() && !POS_MAP[game.playerPos].isIF;

  // 內野高飛球（界內高飛 or 界外高飛）
  if (r < (isIF ? 0.11 : 0.05)) {
    const isFoulPop = Math.random() < 0.38;
    const foulSign = is1B && Math.random() < 0.65 ? -1 : (Math.random() > 0.5 ? 1 : -1);
    const spray = isFoulPop ? foulSign * (52 + Math.random() * 14) : (Math.random() * 44 - 22);
    return { ev: 20 + Math.random() * 6, la: 62 + Math.random() * 14, spray, spin: 0.4, tag: isFoulPop ? '內野界外高飛' : '內野高飛' };
  }
  // 一／三壘方向強勁滾地球（可抓雙殺）
  if (r < (isIF ? 0.23 : 0.14)) {
    const sign = is1B ? (Math.random() < 0.6 ? -1 : 1) : (Math.random() < 0.5 ? -1 : 1);
    return { ev: 38 + Math.random() * 7, la: 2 + Math.random() * 4, spray: sign * (26 + Math.random() * 13), spin: 0.25, tag: '強勁滾地' };
  }
  // 一／三壘方向軟弱滾地球（需往前衝處理、二壘手補位一壘）
  if (r < (isIF ? 0.31 : 0.20)) {
    const sign = is1B ? (Math.random() < 0.65 ? -1 : 1) : (Math.random() < 0.5 ? -1 : 1);
    return { ev: 18 + Math.random() * 6, la: 1 + Math.random() * 4, spray: sign * (22 + Math.random() * 15), spin: 0.2, tag: '軟弱滾地' };
  }
  // 一般內野滾地球（守內野時機率拉高）
  if (r < (isIF ? 0.55 : (isOF ? 0.26 : 0.35))) {
    const spray = isSS && Math.random() < 0.6
      ? (4 + Math.random() * 24)
      : (Math.random() * 56 - 28);
    return { ev: 30 + Math.random() * 13, la: 2 + Math.random() * 6, spray, spin: 0.3, tag: '' };
  }
  // 內外野中間三不管地帶飛球
  if (r < (isIF ? 0.64 : 0.44)) {
    let spray = Math.random() * 58 - 29;
    if (isSS && Math.random() < 0.55) spray = 4 + Math.random() * 20;
    else if (is1B && Math.random() < 0.45) spray = -(8 + Math.random() * 22);
    return { ev: 26 + Math.random() * 5.5, la: 33 + Math.random() * 11, spray, spin: 0.75, tag: '三不管' };
  }
  // 車布邊安打
  if (r < (isIF ? 0.68 : 0.49)) {
    const sign = Math.random() > 0.5 ? 1 : -1;
    return { ev: 44 + Math.random() * 6, la: 1 + Math.random() * 3, spray: sign * (42.8 + Math.random() * 1.8), spin: 0.15, tag: '車布邊' };
  }
  // 平飛球
  if (r < (isIF ? 0.76 : 0.59)) {
    let spray = Math.random() * 72 - 36;
    if (isSS && Math.random() < 0.45) spray = 6 + Math.random() * 20;
    else if (is1B && Math.random() < 0.4) spray = -(14 + Math.random() * 22);
    return { ev: 36 + Math.random() * 9, la: 10 + Math.random() * 9, spray, spin: 0.9, tag: '' };
  }
  // 刁鑽找洞飛球（拉高一點仰角，變成五五波拚行進間接殺）
  if (r < (isIF ? 0.82 : 0.68)) {
    const sign = Math.random() < 0.5 ? 1 : -1;
    let spray = sign * (Math.random() < 0.65 ? (10 + Math.random() * 7) : (32 + Math.random() * 7));
    if (isOF && Math.random() < 0.55) {
      if (game.playerPos === 'CF') spray = sign * (10 + Math.random() * 7);
      else if (game.playerPos === 'LF') spray = Math.random() < 0.5 ? (10 + Math.random() * 7) : (32 + Math.random() * 7);
      else if (game.playerPos === 'RF') spray = Math.random() < 0.5 ? -(10 + Math.random() * 7) : -(32 + Math.random() * 7);
    }
    return { ev: 35 + Math.random() * 6.5, la: 18 + Math.random() * 11, spray, spin: 0.95, tag: '找洞飛球' };
  }
  // 越過頭頂深遠飛球／警戒區長打（偶爾警戒區接殺、偶爾越頂撞牆）
  if (r < (isIF ? 0.87 : 0.75)) {
    let spray = Math.random() * 72 - 36;
    if (isOF && Math.random() < 0.55) {
      if (game.playerPos === 'CF') spray = Math.random() * 30 - 15;
      else if (game.playerPos === 'LF') spray = 12 + Math.random() * 24;
      else if (game.playerPos === 'RF') spray = -(12 + Math.random() * 24);
    }
    return { ev: 42.5 + Math.random() * 4.5, la: 21 + Math.random() * 8.5, spray, spin: 0.95, tag: '越頂長打' };
  }
  // 一般外野高飛球（壓低初速上限，維持穩定接殺與跑動接殺）
  if (r < 0.975) {
    let spray = Math.random() * 74 - 37;
    if (isOF && Math.random() < 0.55) {
      if (game.playerPos === 'CF') spray = Math.random() * 26 - 13;
      else if (game.playerPos === 'LF') spray = 12 + Math.random() * 25;
      else if (game.playerPos === 'RF') spray = -(12 + Math.random() * 25);
    }
    return { ev: 34.5 + Math.random() * 7.5, la: 28 + Math.random() * 17, spray, spin: 1.05, tag: '' };
  }
  // 全壘打級（降至 2.5%）
  return { ev: 49 + Math.random() * 4.5, la: 26 + Math.random() * 9, spray: Math.random() * 68 - 34, spin: 1.2, tag: '' };
}
function spawnLiveRunners(isMeBatting) {
  clearLiveRunners();
  const color = isPlayerDefense() ? 0xc62828 : 0x1565c0;
  for (let i = 2; i >= 0; i--) {
    if (game.bases[i]) {
      const isMe = (isPlayerOffense() && game.playerBase === i + 1);
      const isForced = (i === 0) || (i === 1 && game.bases[0]) || (i === 2 && game.bases[0] && game.bases[1]);
      const m = createPlayerSilhouette(BASES[i + 1].x, BASES[i + 1].z, color);
      if (isMe) m.visible = false;
      liveRunners.push({
        mesh: m, baseFrom: i + 1, baseTo: i + 2, progress: 0,
        speed: 0.25 + Math.random() * 0.03, isBatter: false, isMe,
        isForced, leftEarly: false, out: false, scored: false, stopped: false, retreating: false
      });
    }
  }
  const bm = createPlayerSilhouette(0, 0, color);
  if (isMeBatting) bm.visible = false;
  liveRunners.push({
    mesh: bm, baseFrom: 0, baseTo: 1, progress: 0,
    speed: 0.26, isBatter: true, isMe: isMeBatting,
    isForced: true, leftEarly: false, out: false, scored: false, stopped: false, retreating: false
  });
  syncStaticRunners();
}

function startLiveBallInPlay(ev, la, spray, spin, isMeBatting = false, tag = '') {
  const sim = simulateHit(ev, la, spray, spin);
  launchVisualBall(ev, la, spray, spin);
  state.meta = { ev, la, spray, spin, ...sim };
  AudioFX.crack(THREE.MathUtils.clamp((ev - 30) / 16, 0.65, 1.3));

  if (isPlayerFielding() && state.showMarker && la > 12) {
    landingRing.position.set(sim.land.x, 0.08, sim.land.z);
    landingRing.visible = true;
  }

  if (isPlayerOffense() && !isMeBatting && game.playerBase === 3 && game.outs < 2 && la > 20 && Math.hypot(sim.land.x, sim.land.z) > 62 && Math.hypot(sim.land.x, sim.land.z) < wallRadius) {
    startInteractiveTagUp(spray);
    return;
  }

  spawnLiveRunners(isMeBatting);
  batterMesh.visible = false;

  if (isPlayerOffense() && (game.playerBase > 0 || isMeBatting)) {
    btnSteal.style.display = 'none';
    btnRun.textContent = '🏃 按住衝刺（放開回壘）';
    btnRun.style.display = 'block';
    holdRun = false;
  }
  game.play = {
    isMeBatting, ev, la, spray, tag,
    landed: false, fielded: false, fielderId: null, fielderRef: null,
    isHR: false, hrTimer: 0,
    throwDelay: 0, pendingFromPlayer: false, pendingThrowTargetPos: null, pendingThrowTargetBase: 1,
    throwActive: false, throwFrom: null, throwTo: null, throwTargetBase: 1, throwT: 0, throwDur: 0.7,
    relayActive: false, cutoffFielder: null, relayFinalBase: 2,
    dpSecondThrow: false, elapsed: 0, resolved: false
  };
  game.subPhase = 'LIVE_PLAY';
  if (tag === '車布邊') {
    setTicker('⚡ 車布邊強襲球！貼著邊線滾過去！');
  } else if (isPlayerFielding() && game.playerPos === 'CF' && Math.abs(spray) < 16 && Math.hypot(sim.land.x, sim.land.z) > 55) {
    setTicker('⚡ 打向中外野！快追球！');
  } else {
    setTicker(la < 11 ? '滾地球打進場內！' : '高飛球打向空中！');
  }
  updateDiveBtnState();
}

function launchFoulFly(pInfo) {
  AudioFX.crack(0.68);
  if (game.strikes < 2) game.strikes++;
  const dirRoll = Math.random();
  let spray, la, ev, label;
  if (dirRoll < 0.35) {
    spray = 165 + Math.random() * 30; la = 50 + Math.random() * 20; ev = 22 + Math.random() * 8;
    label = '本壘後方界外飛球';
  } else if (dirRoll < 0.68) {
    spray = Math.random() > 0.5 ? (110 + Math.random() * 45) : (205 + Math.random() * 45);
    la = 42 + Math.random() * 20; ev = 26 + Math.random() * 8;
    label = '斜後方界外飛球';
  } else {
    spray = (Math.random() > 0.5 ? 1 : -1) * (54 + Math.random() * 22);
    la = 34 + Math.random() * 14; ev = 32;
    label = '界外飛球';
  }
  setTicker(`${pInfo}${label}（${game.balls}壞${game.strikes}好）`);
  launchVisualBall(ev, la, spray, 0.5);
  game.subPhase = 'WATCH_FOUL';
  game.timer = 1.4 / state.speed;
}

function resolveSimPitch(isDefense) {
  const res = game.simResult;
  const pInfo = `${game.pitchType.name} ${game.pitchKmh}km/h｜`;

  if (res === 'BALL') {
    AudioFX.glovePop();
    game.balls++;
    if (game.balls >= 4) {
      setTicker(`${pInfo}四壞球保送！打者上一壘`);
      applyWalk(false); nextBatter();
    } else setTicker(`${pInfo}壞球（${game.balls}壞${game.strikes}好）`);
    enterAfterPause(1.0);
  } else if (res === 'STRIKE_LOOK' || res === 'STRIKE_SWING') {
    AudioFX.glovePop();
    game.strikes++;
    const label = res === 'STRIKE_LOOK' ? '好球進壘' : '揮棒落空';
    if (game.strikes >= 3) {
      AudioFX.tone(320, 0.2);
      if (!addOut(`${pInfo}${label}！三振出局！`)) { nextBatter(); enterAfterPause(1.1); }
    } else {
      setTicker(`${pInfo}${label}（${game.balls}壞${game.strikes}好）`);
      enterAfterPause(0.95);
    }
  } else if (res === 'FOUL_FLY') {
    launchFoulFly(pInfo);
  } else if (res === 'FOUL_GROUND') {
    AudioFX.crack(0.7);
    if (game.strikes < 2) game.strikes++;
    setTicker(`${pInfo}滾地界外（${game.balls}壞${game.strikes}好）`);
    launchVisualBall(30, 4, (Math.random() > 0.5 ? 1 : -1) * (54 + Math.random() * 18), 0.4);
    game.subPhase = 'WATCH_FOUL';
    game.timer = 1.35 / state.speed;
  } else {
    const p = generateBattedBallParams();
    startLiveBallInPlay(p.ev, p.la, p.spray, p.spin, false, p.tag);
  }
  updateGameUI();
}

function applyWalk(isMeBatting) {
  let scored = 0;
  if (game.bases[0] && game.bases[1] && game.bases[2]) {
    scored++;
    if (isPlayerOffense() && game.playerBase === 3) game.playerBase = 0;
  }
  if (game.bases[0] && game.bases[1]) {
    game.bases[2] = true;
    if (isPlayerOffense() && game.playerBase === 2) game.playerBase = 3;
  }
  if (game.bases[0]) {
    game.bases[1] = true;
    if (isPlayerOffense() && game.playerBase === 1) game.playerBase = 2;
  }
  game.bases[0] = true;
  if (isMeBatting) game.playerBase = 1;
  addRuns(scored);
  if (isMeBatting) game.stats.rbi += scored;
}

function launchVisualBall(ev, laDeg, sprayDeg, spin) {
  const la = THREE.MathUtils.degToRad(laDeg);
  const sp = THREE.MathUtils.degToRad(sprayDeg);
  state.ballPos.set(0, 1.05, 0.3);
  state.ballVel.set(ev * Math.cos(la) * Math.sin(sp), ev * Math.sin(la), ev * Math.cos(la) * Math.cos(sp));
  ballMesh.visible = true;
  ballShadow.visible = true;
}

function enterAfterPause(sec) {
  game.subPhase = 'PAUSE_NEXT';
  game.timer = sec / state.speed;
  updateGameUI();
}

function moveObjToward(objPos, targetPos, speed, dt) {
  const dx = targetPos.x - objPos.x, dz = targetPos.z - objPos.z;
  const d = Math.hypot(dx, dz);
  if (d > 0.15) {
    const step = Math.min(d, speed * dt);
    objPos.x += (dx / d) * step;
    objPos.z += (dz / d) * step;
  }
}

function updateFieldersAndCoverage(dt) {
  const pl = game.play;
  const isCornerLine = pl.tag === '車布邊';
  const ballInOutfield = isCornerLine || state.ballPos.z > 46 || state.meta.land.z > 50;
  const cutoffId = (isCornerLine ? pl.spray >= 0 : state.ballPos.x >= 0) ? 'SS' : '2B';
  const isCornerCutoff = isCornerLine || (ballInOutfield && Math.abs(state.ballPos.x) > 30);
  const cutPos = isCornerCutoff
    ? new THREE.Vector3(
        (cutoffId === 'SS' ? 1 : -1) * THREE.MathUtils.clamp(Math.abs(state.ballPos.x) * 0.62, 26, 40),
        0,
        THREE.MathUtils.clamp(state.ballPos.z * 0.78, 44, 58)
      )
    : new THREE.Vector3(THREE.MathUtils.clamp(state.ballPos.x * 0.48, -22, 22), 0, 52);

  let primaryChaser = null;
  let bloopIF = null, bloopOF = null;

  if (!pl.fielded) {
    if (pl.tag === '三不管' && !pl.landed) {
      let bestIF = Infinity, bestOF = Infinity;
      fielders.forEach(f => {
        if (!f.mesh.visible) return;
        const d = Math.hypot(state.meta.land.x - f.pos.x, state.meta.land.z - f.pos.z);
        if (f.type === 'IF' && d < 28 && d < bestIF) { bestIF = d; bloopIF = f; }
        if (f.type === 'OF' && d < 42 && d < bestOF) { bestOF = d; bloopOF = f; }
      });
    } else {
      let bestDist = Infinity;
      fielders.forEach(f => {
        if (!f.mesh.visible) return;
        if (pl.tag === '車布邊' && f.type === 'IF') return;
        const t = (!pl.landed && f.type === 'OF') ? state.meta.land : state.ballPos;
        const maxRange = f.type === 'IF' ? (pl.tag === '軟弱滾地' ? 20 : 15) : 52;
        if (Math.hypot(t.x - f.home.x, t.z - f.home.z) < maxRange) {
          const d = Math.hypot(t.x - f.pos.x, t.z - f.pos.z);
          if (d < bestDist) { bestDist = d; primaryChaser = f; }
        }
      });
    }
  }

  const f1B = getFielderById('1B');
  const isPlayer1B = isPlayerFielding() && game.playerPos === '1B';
  const player1BDistBag = Math.hypot(player.pos.x - BASES[1].x, player.pos.z - BASES[1].z);
  const ballTo1BSide = pl.la < 12 && (pl.spray < -16 || state.ballPos.x < -10);
  const firstBaseOffBag = isPlayer1B
    ? ((pl.tag === '軟弱滾地' && pl.spray < 0) || (pl.fielderId === '1B' && player1BDistBag > 4.5) || (!pl.fielded && ballTo1BSide && player1BDistBag > 8.5))
    : ((primaryChaser === f1B || pl.fielderId === '1B') || Math.hypot(f1B.pos.x - BASES[1].x, f1B.pos.z - BASES[1].z) > 4.5);
  if (pl.selfCoverBase && pl.fielderRef && pl.fielderRef.id === 'P') {
    moveObjToward(pitcherMesh.position, BASES[pl.selfCoverBase % 4], 7.4, dt);
  } else if (firstBaseOffBag) {
    const pTarget = pl.tag === '軟弱滾地' ? new THREE.Vector3(-23, 0, 23) : BASES[1];
    moveObjToward(pitcherMesh.position, pTarget, 7.4, dt);
  }
  fielders.forEach(f => {
    if (!f.mesh.visible) return;
    if (f === pl.fielderRef && pl.throwDelay > 0) return;

    if (pl.selfCoverBase && f === pl.fielderRef) {
      moveObjToward(f.pos, BASES[pl.selfCoverBase % 4], f.speed, dt);
    } else if (!pl.fielded && (f === primaryChaser || f === bloopIF || f === bloopOF)) {
      const target = (!pl.landed && (f.type === 'OF' || pl.tag === '三不管')) ? state.meta.land : state.ballPos;
      if (!(f.type === 'OF' && !pl.landed && pl.elapsed < 0.22)) {
        let chaseSpd = f.speed;
        if (f.type === 'OF' && !pl.landed) {
          if (target.z > f.pos.z + 2) chaseSpd *= 0.90;
          else if (Math.abs(target.x - f.pos.x) > 8) chaseSpd *= 0.95;
        }
        moveObjToward(f.pos, target, chaseSpd, dt);
      }
    } else if (f.id === '1B') {
      moveObjToward(f.pos, BASES[1], f.speed, dt);
    } else if (f.id === '3B') {
      moveObjToward(f.pos, BASES[3], f.speed, dt);
    } else if (f.id === '2B') {
      if (pl.tag === '軟弱滾地' && firstBaseOffBag) {
        moveObjToward(f.pos, BASES[1], f.speed, dt);
      } else if (ballInOutfield && cutoffId === '2B') {
        moveObjToward(f.pos, cutPos, f.speed, dt);
      } else if (!ballInOutfield && (pl.spray < -16 || pl.fielderId === '1B')) {
        moveObjToward(f.pos, new THREE.Vector3(-12, 0, 31), f.speed, dt);
      } else {
        moveObjToward(f.pos, BASES[2], f.speed, dt);
      }
    } else if (f.id === 'SS') {
      if (ballInOutfield && cutoffId === 'SS') {
        moveObjToward(f.pos, cutPos, f.speed, dt);
      } else {
        moveObjToward(f.pos, BASES[2], f.speed, dt);
      }
    }
    f.mesh.position.set(f.pos.x, 0, f.pos.z);
  });
}

function updateLivePlay(dt, now) {
  const pl = game.play;
  if (!pl) return;
  pl.elapsed += dt;

  if (isPlayerFielding()) updateCFMovement(dt, now);

  if (!pl.isHR) updateFieldersAndCoverage(dt);

  if (pl.isHR) {
    if (pl.hrTimer > 0) pl.hrTimer -= dt;
    if (state.ballPos.y > 0.15) {
      stepPhysics(state.ballPos, state.ballVel, state.meta.spin, dt);
      if (state.ballPos.y <= 0.15) state.ballPos.y = 0.15;
      ballMesh.position.copy(state.ballPos);
      ballMesh.scale.setScalar(THREE.MathUtils.clamp(camera.position.distanceTo(state.ballPos) * 0.025, 1.0, 2.8));
    }
  } else if (pl.throwDelay > 0) {
    pl.throwDelay -= dt;
    if (pl.pendingFromPlayer) {
      ballMesh.position.set(player.pos.x, player.pos.y - 0.15, player.pos.z - 0.35);
    } else if (pl.fielderRef) {
      ballMesh.position.set(pl.fielderRef.pos.x, 1.45, pl.fielderRef.pos.z);
    }
    ballShadow.position.set(ballMesh.position.x, 0.07, ballMesh.position.z);

    if (pl.throwDelay <= 0) {
      pl.throwActive = true;
      pl.throwFrom = ballMesh.position.clone();
      pl.throwTo = pl.relayActive && pl.cutoffFielder
        ? pl.cutoffFielder.pos.clone().setY(1.4)
        : (pl.throwTargetFielder ? pl.throwTargetFielder.pos.clone().setY(1.35) : pl.pendingThrowTargetPos.clone());
      pl.throwTargetBase = pl.pendingThrowTargetBase;
      pl.throwT = 0;
      const throwDist = pl.throwFrom.distanceTo(pl.throwTo);
      pl.throwDur = Math.max(0.42, throwDist / 32 + Math.max(0, throwDist - 40) * 0.014);
      pl.throwArc = Math.max(1.2, throwDist * 0.085);
      pl.pendingFromPlayer = false;
      AudioFX.tone(520, 0.08);
    }
  } else if (!pl.fielded && !pl.throwActive) {
    stepPhysics(state.ballPos, state.ballVel, state.meta.spin, dt);

    const distFromHome = Math.hypot(state.ballPos.x, state.ballPos.z);
    if (!pl.landed && distFromHome >= wallRadius && state.ballPos.y > 3.1 && Math.abs(Math.atan2(state.ballPos.x, state.ballPos.z)) < Math.PI * 0.25) {
      pl.isHR = true;
      pl.hrTimer = 1.5;
      landingRing.visible = false;
      btnRun.textContent = '🏃 按住衝刺（放開慢跑繞壘）';
      liveRunners.forEach(r => {
        if (!r.out && !r.scored) {
          r.stopped = false;
          r.retreating = false;
          r.leadGrace = 0;
          if (r.baseTo <= r.baseFrom) r.baseTo = r.baseFrom + 1;
        }
      });
      AudioFX.cheer();
      setBanner('HOME RUN!!', `飛出全壘打牆！飛行距離 ${Math.round(distFromHome + 10)} 公尺`);
      setTicker(pl.isMeBatting ? '你轟出特大號全壘打！' : `${isPlayerDefense() ? '對手' : '隊友'}轟出全壘打！`);
      return;
    }
    if (distFromHome >= wallRadius - 0.5 && state.ballPos.y <= 3.1) {
      const nx = state.ballPos.x / distFromHome, nz = state.ballPos.z / distFromHome;
      state.ballPos.x = nx * (wallRadius - 0.6);
      state.ballPos.z = nz * (wallRadius - 0.6);
      state.ballVel.x *= -0.45;
      state.ballVel.z *= -0.45;
      pl.landed = true;
      AudioFX.thud();
      updateDiveBtnState();
    }

    if (state.ballPos.y <= 0.11) {
      state.ballPos.y = 0.11;
      if (!pl.landed) {
        pl.landed = true;
        AudioFX.thud();
        if (pl.tag === '內野界外高飛') {
          pl.resolved = true;
          if (game.strikes < 2) game.strikes++;
          setBanner('界外球！', '內野界外高飛球落地');
          setTicker(`內野界外高飛落地（${game.balls}壞${game.strikes}好）`);
          enterAfterPause(1.2);
          return;
        }
        updateDiveBtnState();
      }
      if (Math.abs(state.ballVel.y) > 1.2) {
        state.ballVel.y = Math.abs(state.ballVel.y) * 0.42;
        state.ballVel.x *= 0.86;
        state.ballVel.z *= 0.86;
      } else {
        state.ballVel.y = 0;
        const fric = Math.pow(0.55, dt);
        state.ballVel.x *= fric;
        state.ballVel.z *= fric;
      }
    }

    ballMesh.position.copy(state.ballPos);
    ballShadow.position.set(state.ballPos.x, 0.07, state.ballPos.z);
    ballMesh.scale.setScalar(THREE.MathUtils.clamp(camera.position.distanceTo(state.ballPos) * 0.026, 1.0, 2.8));

    if (isPlayerFielding()) {
      const horiz = Math.hypot(state.ballPos.x - player.pos.x, state.ballPos.z - player.pos.z);
      const canCatch = POS_MAP[game.playerPos].isIF ? true : (state.ballVel.y < 0);
      if (!pl.landed && horiz <= (player.diving ? 2.85 : 2.15) && state.ballPos.y <= 2.65 && state.ballPos.y >= 0.15 && canCatch) {
        handleFlyOut(game.playerPos, true);
        return;
      }
      if (pl.landed && horiz <= 2.4) {
        pickUpBallCF();
      }
    }

    fielders.forEach(f => {
      if (!f.mesh.visible || pl.fielded) return;
      const bDist = Math.hypot(state.ballPos.x - f.pos.x, state.ballPos.z - f.pos.z);
      if (!pl.landed && bDist <= f.reach && state.ballPos.y <= 2.6 && state.ballPos.y >= 0.15 && state.ballVel.y < 0) {
        handleFlyOut(f.id, false);
      } else if (pl.landed && bDist <= (f.type === 'IF' ? 1.8 : 2.2) && state.ballPos.y < 1.6) {
        if (pl.tag === '車布邊' && f.type === 'IF') return;
        handleAIFieldGroundBall(f);
      }
    });
  } else if (player.hasBall) {
    ballMesh.position.set(player.pos.x, 0.9, player.pos.z);
    ballShadow.position.set(player.pos.x, 0.07, player.pos.z);
    if (isPlayerIF()) {
      let stepBase = pl.playerCoverBase || 0;
      if (!stepBase && game.playerPos === '1B' && !pl.flyCaught && !pl.selfStepped1B) {
        const batterTo1B = liveRunners.some(r => !r.out && !r.scored && !r.retreating && r.baseTo === 1 && r.progress > 0.05 && r.progress < 0.99);
        if (batterTo1B) stepBase = 1;
      }
      if (stepBase) {
        const bPos = BASES[stepBase % 4];
        if (Math.hypot(player.pos.x - bPos.x, player.pos.z - bPos.z) < 1.35) {
          AudioFX.glovePop();
          pl.playerCoverBase = 0;
          pl.autoRun1B = false;
          if (stepBase === 1) pl.selfStepped1B = true;
          pl.throwTargetBase = stepBase;
          pl.throwTargetFielder = { id: `${game.playerPos}(你)`, pos: player.pos, isPlayer: true, steppedBag: true };
          player.hasBall = false;
          resolveThrowArrival();
          return;
        }
      }
    }
  } else if (pl.selfCoverBase && pl.fielderRef) {
    ballMesh.position.set(pl.fielderRef.pos.x, 1.35, pl.fielderRef.pos.z);
    ballShadow.position.set(ballMesh.position.x, 0.07, ballMesh.position.z);
    const bPos = BASES[pl.selfCoverBase % 4];
    if (Math.hypot(pl.fielderRef.pos.x - bPos.x, pl.fielderRef.pos.z - bPos.z) < 0.65) {
      AudioFX.glovePop();
      const tb = pl.selfCoverBase;
      pl.selfCoverBase = 0;
      pl.throwTargetBase = tb;
      pl.throwTargetFielder = pl.fielderRef;
      resolveThrowArrival();
      return;
    }
  } else if (pl.throwActive) {
    if (pl.throwTargetFielder && pl.throwTargetFielder.pos) {
      pl.throwTo.set(pl.throwTargetFielder.pos.x, 1.35, pl.throwTargetFielder.pos.z);
    }
    pl.throwT += dt;
    const p = Math.min(1, pl.throwT / pl.throwDur);
    ballMesh.position.lerpVectors(pl.throwFrom, pl.throwTo, p);
    ballMesh.position.y += Math.sin(p * Math.PI) * (pl.throwArc || 1.4);
    ballShadow.position.set(ballMesh.position.x, 0.07, ballMesh.position.z);
    if (p >= 1) {
      AudioFX.glovePop();
      resolveThrowArrival();
      return;
    }
  } else if (pl.fielded && pl.fielderRef && pl.fielderRef.pos) {
    ballMesh.position.set(pl.fielderRef.pos.x, 1.35, pl.fielderRef.pos.z);
    ballShadow.position.set(ballMesh.position.x, 0.07, ballMesh.position.z);
  }

  let anyMoving = false;
  liveRunners.forEach((r, idx) => {
    if (r.out || r.scored) return;

    if (r.startBase === undefined) r.startBase = r.baseFrom;
    const isAirFly = !pl.isHR && game.outs < 2 && !pl.landed && !pl.flyCaught && pl.la > 8;
    const forcedNow = !pl.flyCaught && r.isForced && (pl.landed || game.outs === 2);

    // 檢查後面有沒有跑者正在往自己原本的壘包衝（被後位跑者推著走）
    const pushedByTrailer = liveRunners.slice(idx + 1).some(tr =>
      !tr.out && !tr.scored && !tr.retreating &&
      ((tr.baseTo === r.baseFrom && ((tr.isForced && !pl.flyCaught) || tr.progress > 0.5)) || tr.baseFrom >= r.baseFrom)
    );

    // 提前抓前位跑者，確認前方目標壘包有沒有被停壘／回壘的前位跑者擋住
    const leadRunner = liveRunners.slice(0, idx).reverse().find(lr => !lr.out && !lr.scored);
    const nextTargetBase = r.stopped ? (r.baseFrom + 1) : r.baseTo;
    const leadHoldingBag = leadRunner && (leadRunner.stopped || leadRunner.retreating || (leadRunner.isMe && isPlayerOffense() && !holdRun && leadRunner.progress < 0.15));
    const blockedByLead = !!(leadHoldingBag && leadRunner.baseFrom <= nextTargetBase);

    if (r.stopped) {
      if (r.baseFrom < 4 && !pl.flyNoThrow && !blockedByLead && (pushedByTrailer || (r.isMe && isPlayerOffense() && holdRun) || (!r.isMe && !pl.flyCaught && !pl.fielded && !pl.throwActive && !isAirFly))) {
        r.stopped = false;
        r.baseTo = r.baseFrom + 1;
      } else {
        return;
      }
    }

    // 玩家在一、二壘遇外野飛球：未按衝刺前先跑出約 1/3，視線鎖定在球上方便判斷
    if (isAirFly && r.isMe && isPlayerOffense() && !r.isBatter && (r.baseFrom === 1 || r.baseFrom === 2) && state.meta && state.meta.land.z > 42 && !r.manualControl) {
      if (holdRun) {
        r.manualControl = true;
        r.leadGrace = 0;
      } else {
        r.leadGrace = 0.45;
        const movingOut = r.progress < 0.33;
        if (movingOut) r.progress = Math.min(0.33, r.progress + 0.26 * dt);
        const cur = new THREE.Vector3().lerpVectors(BASES[r.baseFrom % 4], BASES[r.baseTo % 4], r.progress);
        cur.y = 1.65 + (movingOut ? Math.sin(now * 0.02) * 0.06 : 0);
        camera.position.copy(cur);
        lookTarget.lerp(ballMesh.position, 0.22);
        camera.lookAt(lookTarget);
        anyMoving = true;
        return;
      }
    }

    // 未滿兩出局的空中飛球／平飛球：夠深遠想 Tag-up 的二三壘跑者留在壘包等接殺，其餘先跑出去約 1/3 判斷
    if (isAirFly && !r.isBatter && !r.isMe) {
      const wantTagUp = r.baseFrom >= 2 && pl.la >= 20 && state.meta && state.meta.land.z >= 82;
      if (!wantTagUp && r.progress < 0.33) {
        r.progress = Math.min(0.33, r.progress + r.speed * 0.85 * dt);
        const cur = new THREE.Vector3().lerpVectors(BASES[r.baseFrom % 4], BASES[r.baseTo % 4], r.progress);
        cur.y = Math.abs(Math.sin(now * 0.018)) * 0.14;
        r.mesh.position.copy(cur);
        anyMoving = true;
      }
      return;
    }

    // 接殺後：跑出去 1/3 的會自動回壘；留在壘包的二三壘深遠飛球才會 Tag-up 推進，否則留壘
    if (pl.flyCaught && !r.isMe && !r.leftEarly && !pushedByTrailer && !r.retreating) {
      if (r.baseFrom < 2 || state.ballPos.z < 82 || pl.la < 20) { r.stopped = true; return; }
    }

    // 落地後保留短暫反應時間，讓玩家看到球落地再按衝刺，不會瞬間往回拉
    if (r.isMe && isPlayerOffense() && r.leadGrace > 0) {
      if (holdRun || forcedNow || pl.flyCaught) {
        if (holdRun) r.manualControl = true;
        r.leadGrace = 0;
      } else {
        r.leadGrace = Math.max(0, r.leadGrace - dt);
      }
    }

    // 球落地安打（或滾穿到外野）時，原本壘包往前推進這一個壘包直接衝；繞過該壘包想拚下一壘時，反方向長傳改看 1/3，其餘看 1/2
    const commitFirstBase = !r.isMe && r.baseFrom === r.startBase && pl.landed && !pl.flyCaught && (pl.la > 8 || state.ballPos.z > 40);
    let retreatThreshold = 0.5;
    if (pl.landed && !pl.flyCaught && state.ballPos.z > 42 && r.baseTo >= 2 && r.baseTo <= 4) {
      const fromP = BASES[r.baseFrom % 4];
      const toP = BASES[r.baseTo % 4];
      const runX = toP.x - fromP.x, runZ = toP.z - fromP.z;
      const ballX = state.ballPos.x - fromP.x, ballZ = state.ballPos.z - fromP.z;
      const dot = (runX * ballX + runZ * ballZ) / ((Math.hypot(runX, runZ) || 1) * (Math.hypot(ballX, ballZ) || 1));
      const throwDist = Math.hypot(state.ballPos.x - toP.x, state.ballPos.z - toP.z);
      if (dot < -0.45 && throwDist > 55) retreatThreshold = 1 / 3;
    }
    if (!pl.isHR && r.baseFrom >= 1 && !r.retreating && !forcedNow && !pushedByTrailer) {
      if (r.isMe && isPlayerOffense()) {
        if (!holdRun && !(r.leadGrace > 0) && r.progress > 0.03 && r.progress < 0.5) r.retreating = true;
      } else if (!pl.flyCaught) {
        if (blockedByLead) {
          r.retreating = true;
        } else if (!commitFirstBase && (pl.fielded || pl.throwActive) && r.progress < retreatThreshold) {
          r.retreating = true;
        }
      }
    }

    if (r.retreating) {
      if ((pushedByTrailer && !blockedByLead) || (r.isMe && isPlayerOffense() && holdRun && !r.leftEarly)) {
        r.retreating = false;
      } else {
        r.progress -= r.speed * 1.25 * dt;
        const cur = new THREE.Vector3().lerpVectors(BASES[r.baseFrom % 4], BASES[r.baseTo % 4], Math.max(0, r.progress));
        if (r.isMe && isPlayerOffense()) {
          cur.y = 1.65;
          camera.position.copy(cur);
          const backLook = BASES[r.baseFrom % 4].clone().setY(1.2).lerp(ballMesh.position, 0.35);
          lookTarget.lerp(backLook, 0.2);
          camera.lookAt(lookTarget);
        } else {
          cur.y = Math.abs(Math.sin(now * 0.02)) * 0.14;
          r.mesh.position.copy(cur);
        }
        anyMoving = true;
        if (r.progress <= 0) {
          r.progress = 0; r.retreating = false; r.leftEarly = false; r.baseTo = r.baseFrom; r.stopped = true;
          if (!r.isMe) r.mesh.position.copy(BASES[r.baseFrom]);
        }
        return;
      }
    }

    // 避免後位跑者超車前位跑者
    let speedScale = 1.0;
    if (leadRunner) {
      const myTotal = r.baseFrom + r.progress;
      const leadTotal = leadRunner.baseFrom + leadRunner.progress;
      if (leadTotal - myTotal < 0.25) speedScale = 0.0;
    }

    if (r.isMe && isPlayerOffense()) {
      const twoOutAutoRun = game.outs === 2 && !pl.landed && !pl.fielded;
      const spd = (pl.isHR
        ? (holdRun ? 0.34 : 0.20)
        : ((r.baseFrom === 0 || forcedNow || twoOutAutoRun || holdRun) ? 0.32 : 0.0)) * speedScale;
      r.progress += spd * dt;
      const cur = new THREE.Vector3().lerpVectors(BASES[r.baseFrom % 4], BASES[r.baseTo % 4], Math.min(1, r.progress));
      cur.y = 1.65 + (spd > 0 ? Math.sin(now * 0.022) * 0.08 : 0);
      camera.position.copy(cur);
      const baseLook = BASES[r.baseTo % 4].clone().setY(1.3);
      const runDir = baseLook.clone().sub(cur).normalize();
      const ballDir = ballMesh.position.clone().sub(cur).normalize();
      const gaze = (pl.isHR && pl.hrTimer <= 0)
        ? baseLook
        : ((spd === 0 && r.leadGrace > 0)
          ? ballMesh.position
          : (runDir.dot(ballDir) > -0.25 ? baseLook.clone().lerp(ballMesh.position, 0.55) : baseLook));
      lookTarget.lerp(gaze, 0.16);
      camera.lookAt(lookTarget);
      if (spd > 0 || r.leadGrace > 0) anyMoving = true;
    } else {
      const aiSpd = pl.isHR
        ? Math.max(r.speed, 0.28) * (state.speed === 2 && !liveRunners.some(x => x.isMe && isPlayerOffense()) ? 1.6 : 1.0)
        : r.speed;
      r.progress += aiSpd * speedScale * dt;
      const cur = new THREE.Vector3().lerpVectors(BASES[r.baseFrom % 4], BASES[r.baseTo % 4], Math.min(1, r.progress));
      cur.y = Math.abs(Math.sin(now * 0.018)) * 0.14;
      r.mesh.position.copy(cur);
      anyMoving = true;
    }

    if (r.progress >= 1) {
      r.baseFrom = r.baseTo;
      r.isForced = false;
      r.progress = 0;
      if (r.baseFrom >= 4) {
        r.scored = true; r.mesh.visible = false;
        if (r.isMe && isPlayerOffense()) btnRun.style.display = 'none';
        addRuns(1);
        if (pl.isMeBatting) game.stats.rbi++;
        AudioFX.tone(660, 0.15);
        updateGameUI();
      } else {
        const ballLive = !pl.fielded && !pl.throwActive;
        const canStretch = pl.isHR || (!pl.flyCaught && (pushedByTrailer || (r.isMe && holdRun) || (!r.isMe && ballLive && r.baseFrom < 4)));
        if (canStretch) r.baseTo = r.baseFrom + 1;
        else { r.stopped = true; r.mesh.position.copy(BASES[r.baseFrom]); }
      }
    }
  });

  if (pl.isHR) {
    const meStillRunning = liveRunners.some(r => r.isMe && isPlayerOffense() && !r.scored && !r.out);
    if (!meStillRunning) {
      let watchPos = ballMesh.position;
      if (pl.hrTimer <= 0) {
        const lastR = liveRunners.slice().reverse().find(r => !r.out && !r.scored);
        watchPos = lastR ? lastR.mesh.position.clone().setY(1.4) : new THREE.Vector3(0, 1.2, 0);
      }
      lookTarget.lerp(watchPos, 0.16);
      camera.lookAt(lookTarget);
    }
    if (liveRunners.every(r => r.out || r.scored) || pl.elapsed > 40) {
      finishLivePlayHR();
    }
    return;
  }
  if (isPlayerDefense() && (player.hasBall || pl.pendingFromPlayer)) {
    let aim = new THREE.Vector3(0, 1.4, 22);
    if (pl.pendingFromPlayer && pl.pendingThrowTargetPos) {
      aim.copy(pl.pendingThrowTargetPos);
    } else if (pl.playerCoverBase && game.playerPos !== '1B') {
      const b = BASES[pl.playerCoverBase % 4];
      aim.set(b.x, 1.1, b.z);
    } else if (POS_MAP[game.playerPos].isIF) {
      const tb = getBestThrowTargetBase(true);
      if (game.playerPos === '1B' && tb === 1) {
        aim.set(0, 1.35, 18.44);
      } else {
        const tPos = BASES[tb % 4];
        if (Math.hypot(player.pos.x - tPos.x, player.pos.z - tPos.z) > 3.5) aim.set(tPos.x, 1.3, tPos.z);
        else if (Math.hypot(player.pos.x - BASES[1].x, player.pos.z - BASES[1].z) > 3.5) aim.set(BASES[1].x, 1.3, BASES[1].z);
        else aim.set(0, 1.3, 18.44);
      }
    }
    lookTarget.lerp(aim, 0.16);
    camera.lookAt(lookTarget);
  } else if (isPlayerDefense() || !(isPlayerOffense() && (game.playerBase > 0 || pl.isMeBatting))) {
    lookTarget.lerp(ballMesh.position, 0.2);
    camera.lookAt(lookTarget);
  }
  const totalOutsNow = game.outs + liveRunners.filter(r => r.out).length;
  if (pl.elapsed > 18) {
    finalizeLivePlay(pl.lastGotOut, pl.lastOutBase || 1);
  } else if (pl.fielded && !pl.throwActive && pl.throwDelay <= 0 && !pl.selfCoverBase && !pl.playerCoverBase) {
    if (totalOutsNow >= 3) {
      finalizeLivePlay(pl.lastGotOut, pl.lastOutBase || 1);
    } else if (!anyMoving) {
      if (!pl.waitingEnd) {
        pl.waitingEnd = true;
        pl.endCooldown = 1.5;
      } else {
        pl.endCooldown -= dt;
        if (pl.endCooldown <= 0) finalizeLivePlay(pl.lastGotOut, pl.lastOutBase || 1);
      }
    }
  }
}

function handleFlyOut(fielderId, isPlayerCF) {
  const pl = game.play;
  pl.fielded = true;
  pl.flyCaught = true;
  pl.fielderId = fielderId;
  pl.fielderRef = !isPlayerCF ? getFielderById(fielderId) : null;
  if (pl.fielderRef) {
    ballMesh.position.set(pl.fielderRef.pos.x, 1.35, pl.fielderRef.pos.z);
    ballShadow.position.set(pl.fielderRef.pos.x, 0.07, pl.fielderRef.pos.z);
  }
  AudioFX.glovePop();
  if (isPlayerCF) { AudioFX.cheer(); game.stats.po++; }
  landingRing.visible = false;

  const batter = liveRunners.find(r => r.isBatter);
  if (batter) { batter.out = true; batter.mesh.visible = false; }

  const onBase = liveRunners.filter(r => !r.isBatter && !r.out);
  // 已經三出局就直接結束
  if (game.outs + 1 >= 3) {
    pl.resolved = true;
    btnRun.style.display = 'none';
    setBanner(isPlayerCF && player.diving ? '美技撲接！' : '接殺出局！', '');
    if (!addOut(`${fielderId} 飛球接殺出局！`)) { nextBatter(); enterAfterPause(1.4); }
    updateGameUI();
    return;
  }

  const meRunning = isPlayerOffense() && game.playerBase > 0;
  let targetBase = 0;
  onBase.forEach(r => {
    if (r.isMe && r.progress > 0.08) {
      r.leftEarly = true;
      r.retreating = true;
      if (r.manualControl) targetBase = r.baseFrom;
    }else if (!r.isMe && r.progress > 0.02) {
      r.retreating = true;
    } else if (r.baseFrom >= 2 && state.ballPos.z >= 82 && pl.la >= 20) {
      targetBase = Math.max(targetBase, r.baseTo);
    } else if (r.isMe && r.baseFrom >= 2) {
      targetBase = Math.max(targetBase, r.baseTo);
    }
  });

  if (isPlayerCF) {
    player.hasBall = true;
    pl.waitingEnd = true;
    pl.endCooldown = 1.5;
    setBanner(player.diving ? '美技撲接！' : '接殺出局！', '');
    setTicker(`${fielderId} 接殺出局！`);
    updateDiveBtnState();
    updateGameUI();
    return;
  }

  if (targetBase === 0) {
    btnRun.style.display = 'none';
    pl.flyNoThrow = true;
    pl.waitingEnd = true;
    pl.endCooldown = 1.5;
    onBase.forEach(r => { if (!r.retreating) r.stopped = true; });
    setBanner('接殺出局！', '');
    setTicker(`${fielderId} 接殺出局！`);
    updateGameUI();
    return;
  }

  const f = getFielderById(fielderId);
  const cover = getBaseCoverFielder(targetBase, fielderId);
  pl.fielderRef = f;
  pl.throwDelay = 0.38;
  pl.relayActive = false;
  pl.throwTargetFielder = cover;
  pl.pendingThrowTargetPos = cover ? cover.pos.clone().setY(1.35) : BASES[targetBase % 4].clone().setY(1.2);
  pl.pendingThrowTargetBase = targetBase;
  setBanner('接殺出局！', meRunning ? '可按住衝刺拚推進，提早離壘快回壘！' : '');
  setTicker(`${fielderId} 接殺，回傳${['本', '一', '二', '三', '本'][targetBase]}壘！`);
  updateGameUI();
}
function handleAIFieldGroundBall(f) {
  const pl = game.play;
  pl.fielded = true;
  pl.fielderId = f.id;
  pl.fielderRef = f;
  AudioFX.glovePop();

  const isInfield = f.type === 'IF';
  if (isInfield) {
    const batterRunning1B = liveRunners.some(r => r.isBatter && !r.out && !r.scored && r.baseTo === 1 && !r.stopped);
    let targetBase = 0;
    let isDPAttempt = false;

    if (pl.tag === '軟弱滾地') {
      if (game.outs < 2) {
        const leadForced = liveRunners.find(r =>
          !r.isBatter && !r.out && !r.scored && !r.stopped && !r.retreating &&
          r.isForced && r.progress < 0.75 && getBaseCoverFielder(r.baseTo, f.id)
        );
        if (leadForced) targetBase = leadForced.baseTo;
      }
      if (targetBase === 0 && batterRunning1B) targetBase = 1;
    } else {
      const forceAt2B = game.outs < 2 && liveRunners.some(r => !r.out && !r.scored && r.isForced && r.baseTo === 2);
      if (forceAt2B && batterRunning1B) {
        targetBase = 2;
        isDPAttempt = true;
      } else if (batterRunning1B) {
        targetBase = 1;
      }
    }

    if (targetBase === 0) {
      // 打者已經踩過一壘（例如沖天炮落地），改抓還在往前衝的領先跑者
      let leadAdv = 0;
      liveRunners.forEach(r => {
        if (!r.out && !r.scored && !r.stopped && !r.retreating && (r.isForced || r.progress > 0.12) && r.baseTo > leadAdv) {
          leadAdv = r.baseTo;
        }
      });
      targetBase = leadAdv;
    }

    if (targetBase === 0) {
      pl.throwDelay = 0;
      pl.waitingEnd = true;
      pl.endCooldown = 1.5;
      setTicker(`${f.id} 持球牽制`);
      return;
    }

    // 一壘或二壘方向滾地球要抓二壘時，若玩家游擊手還沒補位就改傳一壘
    if (targetBase === 2 && (f.id === '1B' || f.id === '2B') && isPlayerDefense() && game.playerPos === 'SS') {
      const ssDist2B = Math.hypot(player.pos.x - BASES[2].x, player.pos.z - BASES[2].z);
      if (ssDist2B > 7.5) {
        targetBase = 1;
        isDPAttempt = false;
      }
    }
    if (f.id === '1B' && targetBase === 1 && pl.tag !== '軟弱滾地') {
      pl.throwDelay = 0;
      pl.selfCoverBase = 1;
      setTicker('1B 接球自踩一壘');
    } else {
      const cover = getBaseCoverFielder(targetBase, f.id);
      if (!cover) {
        pl.throwDelay = 0;
        pl.waitingEnd = true;
        pl.endCooldown = 1.5;
        setTicker(`${f.id} 持球牽制`);
        return;
      }
      pl.throwDelay = 0.38;
      if (isDPAttempt && targetBase === 2) pl.dpSecondThrow = true;
      pl.relayActive = false;
      pl.throwTargetFielder = cover;
      pl.pendingThrowTargetPos = cover.pos.clone().setY(1.35);
      pl.pendingThrowTargetBase = targetBase;
      setTicker(`${f.id} 傳${['本', '一', '二', '三', '本'][targetBase]}壘！`);
    }
  } else {
    pl.throwDelay = 0.44;
    const targetBase = getBestThrowTargetBase(false);
    const bName = ['本', '一', '二', '三', '本'][targetBase];
    const prog = getRunnerProgressTo(targetBase);
    const canDirectThrow = prog >= 0.25 && prog <= 0.75 && f.pos.z <= 84;
    const wantRelayOut = prog >= 0 && prog <= 0.75;
    const cover = canDirectThrow ? getBaseCoverFielder(targetBase, f.id) : null;
    if (!canDirectThrow || !cover) {
      const cutoff = getCutoffFielder(f.pos);
      pl.relayActive = true;
      pl.cutoffFielder = cutoff;
      pl.relayFinalBase = targetBase;
      pl.pendingThrowTargetPos = cutoff.pos.clone().setY(1.4);
      pl.pendingThrowTargetBase = -1;
      setTicker(wantRelayOut ? `${f.id} 傳給 ${cutoff.id} 轉傳${bName}壘` : `${f.id} 回傳 ${cutoff.id}`);
    } else {
      pl.relayActive = false;
      pl.throwTargetFielder = cover;
      pl.pendingThrowTargetPos = cover.pos.clone().setY(1.35);
      pl.pendingThrowTargetBase = targetBase;
      setTicker(`${f.id} 直傳${bName}壘！`);
    }
  }
}

function resolveThrowArrival() {
  const pl = game.play;
  pl.throwActive = false;

  if (pl.relayActive) {
    pl.relayActive = false;
    const tb = getBestThrowTargetBase(false);
    if (pl.cutoffFielder.isPlayer) {
      pl.isRelayThrow = true;
      pl.fielderRef = null;
      player.hasBall = true;
      pl.waitingEnd = true;
      pl.endCooldown = 1.5;
      const bName = ['本', '一', '二', '三', '本'][tb];
      setBanner('接到轉傳球！', hasRunnerMovingTo(tb) ? `傳${bName}壘！` : '');
      updateDiveBtnState();
      return;
    }
    if (!hasRunnerMovingTo(tb)) {
      pl.fielderRef = pl.cutoffFielder;
      setTicker(`${pl.cutoffFielder.id} 接到回傳球`);
      pl.waitingEnd = true;
      pl.endCooldown = 1.5;
      return;
    }
    const bName = ['本', '一', '二', '三', '本'][tb];
    const cover = getBaseCoverFielder(tb, pl.cutoffFielder.id);
    if (!cover) {
      pl.fielderRef = pl.cutoffFielder;
      setTicker(`${pl.cutoffFielder.id} 持球牽制`);
      pl.waitingEnd = true;
      pl.endCooldown = 1.5;
      return;
    }
    pl.fielderRef = pl.cutoffFielder;
    pl.throwDelay = 0.32;
    pl.throwTargetFielder = cover;
    pl.pendingThrowTargetPos = cover.pos.clone().setY(1.35);
    pl.pendingThrowTargetBase = tb;
    setTicker(`${pl.cutoffFielder.id} 轉傳${bName}壘！`);
    return;
  }

  const tb = pl.throwTargetBase;
  const cover = pl.throwTargetFielder;
  pl.throwTargetFielder = null;
  pl.fielderRef = (cover && !cover.isPlayer) ? cover : null;

  if (cover && cover.isPlayer && !cover.steppedBag) {
    const distToBag = Math.hypot(player.pos.x - BASES[tb % 4].x, player.pos.z - BASES[tb % 4].z);
    if (distToBag > 1.5) {
      player.hasBall = true;
      pl.playerCoverBase = tb;
      const bName = ['本', '一', '二', '三', '本'][tb];
      setBanner('接到傳球！', `快跑去踩${bName}壘包抓出局！`);
      updateDiveBtnState();
      return;
    }
  } else if (cover && !cover.isCatcher && !cover.isPlayer && tb >= 1 && tb <= 3) {
    const distToBag = Math.hypot(cover.pos.x - BASES[tb % 4].x, cover.pos.z - BASES[tb % 4].z);
    if (distToBag > 1.2) {
      pl.fielderRef = cover;
      pl.selfCoverBase = tb;
      const bName = ['本', '一', '二', '三', '本'][tb];
      setTicker(`${cover.id} 接到傳球，快步踩向${bName}壘包！`);
      return;
    }
  }

  let gotOut = false;
  liveRunners.forEach(r => {
    if (r.out || r.scored) return;
    const isForcePlay = r.isForced && !pl.flyCaught;
    const minProg = isForcePlay ? 0.05 : 0.5;
    const caughtAdvancing = !r.retreating && r.baseTo === tb && r.progress > minProg && r.progress < 0.99;
    const caughtOffBase = r.leftEarly && r.baseFrom === tb && r.progress > 0.05;
    if (caughtAdvancing || caughtOffBase) {
      r.out = true;
      r.mesh.visible = false;
      gotOut = true;
    } else if (!r.retreating && r.baseTo === tb && r.progress <= minProg) {
      r.retreating = true;
    }
  });

  if (gotOut) {
    pl.lastGotOut = true;
    pl.lastOutBase = tb;
  }

  const totalOutsNow = game.outs + liveRunners.filter(r => r.out).length;
  if (totalOutsNow >= 3) {
    finalizeLivePlay(pl.lastGotOut, pl.lastOutBase || tb);
    return;
  }

  if (cover && cover.isPlayer) {
    pl.dpSecondThrow = false;
    pl.dpCoverDone = true;
    player.hasBall = true;
    pl.waitingEnd = true;
    pl.endCooldown = 1.5;
    const bName = ['本', '一', '二', '三', '本'][tb];
    setBanner(gotOut ? `${bName}壘封殺！` : '接到傳球！', '');
    updateDiveBtnState();
    return;
  }

  if (pl.dpSecondThrow && tb === 2 && gotOut) {
    pl.dpSecondThrow = false;
    const cover2B = (cover && !cover.isPlayer) ? cover : getFielderById((pl.fielderId === 'SS' || pl.fielderId === '3B') ? '2B' : 'SS');
    const cover1B = getBaseCoverFielder(1, cover2B.id);
    if (cover1B) {
      pl.fielderRef = cover2B;
      pl.throwDelay = 0.28;
      pl.throwTargetFielder = cover1B;
      pl.pendingThrowTargetPos = cover1B.pos.clone().setY(1.35);
      pl.pendingThrowTargetBase = 1;
      setTicker('二壘封殺！轉傳一壘拚雙殺！');
      return;
    }
  }

  const advancing = liveRunners.filter(r => !r.out && !r.scored && !r.stopped && !r.retreating && r.progress > 0.1 && r.baseTo !== tb);
  if (advancing.length > 0 && (pl.extraThrows || 0) < 2) {
    const nextTb = advancing[0].baseTo;
    const nextCover = getBaseCoverFielder(nextTb, '');
    if (nextCover) {
      pl.extraThrows = (pl.extraThrows || 0) + 1;
      const fromName = ['本', '一', '二', '三', '本'][tb];
      const toName = ['本', '一', '二', '三', '本'][nextTb];
      pl.fielderRef = { pos: BASES[tb % 4] };
      pl.throwDelay = 0.32;
      pl.throwTargetFielder = nextCover;
      pl.pendingThrowTargetPos = nextCover.pos.clone().setY(1.35);
      pl.pendingThrowTargetBase = nextTb;
      setTicker(`${fromName}壘轉傳${toName}壘！`);
      return;
    }
  }

  if (gotOut) {
    const bName = ['本', '一', '二', '三', '本'][tb];
    setTicker(`${bName}壘出局！`);
  }
  pl.waitingEnd = true;
  pl.endCooldown = 1.5;
}

function finishLivePlayHR() {
  const pl = game.play;
  if (!pl || pl.resolved) return;
  pl.resolved = true;
  btnRun.style.display = 'none';
  liveRunners.forEach(r => {
    if (!r.out && !r.scored) {
      r.scored = true;
      addRuns(1);
      if (pl.isMeBatting) game.stats.rbi++;
    }
  });
  game.bases = [false, false, false];
  game.playerBase = 0;
  if (pl.isMeBatting) { game.stats.h++; game.stats.hr++; }
  nextBatter();
  enterAfterPause(1.4);
  updateGameUI();
}

function finalizeLivePlay(gotOut = false, outBase = 1) {
  const pl = game.play;
  if (!pl || pl.resolved) return;
  pl.resolved = true;
  btnRun.style.display = 'none';
  landingRing.visible = false;

  const outsCount = liveRunners.filter(r => r.out).length;
  const batter = liveRunners.find(r => r.isBatter);
  const nextB = [false, false, false];
  let nextMe = 0;

  liveRunners.forEach(r => {
    if (!r.out && !r.scored) {
      let b = (!r.retreating && r.progress > 0.65) ? r.baseTo : r.baseFrom;
      while (b >= 1 && b <= 3 && nextB[b - 1]) b--;
      if (b >= 4) {
        addRuns(1);
        if (pl.isMeBatting) game.stats.rbi++;
      } else if (b >= 1 && b <= 3) {
        nextB[b - 1] = true;
        if (r.isMe) nextMe = b;
      }
    }
  });

  game.bases = nextB;
  if (isPlayerOffense()) game.playerBase = nextMe;
  if (pl.isMeBatting && batter && !batter.out) game.stats.h++;

  if (outsCount >= 2) {
    setBanner('DOUBLE PLAY!', '');
    if (!addOuts(2, '雙殺！')) { nextBatter(); enterAfterPause(1.5); }
  } else if (outsCount === 1) {
    if (pl.flyCaught) {
      setBanner('接殺出局！', '');
      if (!addOut('接殺出局！')) { nextBatter(); enterAfterPause(1.4); }
    } else {
      const bName = ['本', '一', '二', '三', '本'][outBase];
      setBanner('OUT!', `${bName}壘出局`); if (!addOut(`${bName}壘出局！`)) { nextBatter(); enterAfterPause(1.4); }
    }
  } else {
    const bDest = batter ? (batter.scored ? 4 : ((!batter.retreating && batter.progress > 0.65) ? batter.baseTo : batter.baseFrom)) : 1;
    const prefix = pl.tag === '車布邊' ? '車布邊' : '';
    const hitName = bDest >= 4 ? '場內全壘打！' : (bDest === 3 ? `${prefix}三壘安打！` : (bDest === 2 ? `${prefix}二壘安打！` : `${prefix}一壘安打！`));
    setBanner(hitName, '');
    setTicker(`安全上壘！${hitName}`);
    nextBatter();
    enterAfterPause(1.4);
  }
  updateGameUI();
}

function launchPlayerAtBatPitch() {
  game.subPhase = 'BAT_PITCH';
  game.pitchSwung = false;
  state.pitchT = 0;
  const picked = pickPitchType();
  game.pitchType = picked.pt;
  game.pitchKmh = picked.kmh;
  game.pitchDur = picked.pt.dur + (Math.random() * 0.04 - 0.02);

  const isStrike = Math.random() < 0.60;
  game.pitchIsStrike = isStrike;
  if (isStrike) {
    game.pitchTarget.set((Math.random() - 0.5) * 0.44, 0.62 + Math.random() * 0.56, 0.22);
  } else {
    const side = Math.random() < 0.5 ? (Math.random() > 0.5 ? 0.48 : -0.48) : (Math.random() - 0.5) * 0.6;
    const high = Math.abs(side) < 0.35 ? (Math.random() > 0.5 ? 1.52 : 0.32) : (0.5 + Math.random() * 0.8);
    game.pitchTarget.set(side, high, 0.22);
  }
  ballMesh.visible = true;
  ballMesh.position.set(0, 1.85, 18.44);
}

function swingBat() {
  if (game.subPhase !== 'BAT_PITCH' || game.pitchSwung) return;
  game.pitchSwung = true;
  const z = ballMesh.position.z;
  const err = Math.abs(z - 0.9);
  const zonePenalty = game.pitchIsStrike ? 0 : 0.72;
  const pInfo = `${game.pitchType.name} ${game.pitchKmh}km/h｜`;

  if (err + zonePenalty < 1.38) {
    const quality = 1 - (err + zonePenalty) / 1.38;
    const ev = 34 + quality * 16.5;
    const la = 2 + Math.random() * 29 + quality * 5;
    const spray = (z - 0.9) * 14 + (Math.random() * 18 - 9);
    strikeZoneMesh.visible = false;
    btnSwing.style.display = 'none';

    if (Math.abs(spray) > 45) {
      if (la < 10) {
        AudioFX.crack(0.65);
        if (game.strikes < 2) game.strikes++;
        setTicker(`${pInfo}滾地界外（${game.balls}壞${game.strikes}好）`);
        launchVisualBall(ev * 0.8, la, spray, 0.5);
        game.subPhase = 'WATCH_FOUL';
        game.timer = 1.3;
      } else {
        launchFoulFly(pInfo);
      }
    } else {
      game.stats.ab++;
      const tag = (Math.abs(spray) > 40 && la < 10) ? '車布邊' : '';
      startLiveBallInPlay(ev, la, spray, 1.0, true, tag);
    }
    updateGameUI();
  } else if (err < 2.6) {
    launchFoulFly(pInfo);
    updateGameUI();
  } else {
    AudioFX.tone(180, 0.12);
    game.strikes++;
    if (game.strikes >= 3) {
      game.stats.ab++;
      if (!addOut(`${pInfo}揮棒落空！三振出局！`)) { nextBatter(); enterAfterPause(1.2); }
    } else {
      setTicker(`${pInfo}揮棒落空（${game.balls}壞${game.strikes}好）`);
      enterAfterPause(1.0);
    }
    updateGameUI();
  }
}

function attemptSteal() {
  if (game.subPhase !== 'OFF_SIM_WAIT' && game.subPhase !== 'OFF_SIM_PITCH') return;
  if (game.playerBase <= 0 || game.playerBase >= 3 || game.bases[game.playerBase]) return;
  btnSteal.style.display = 'none';
  game.runProgress = 0;
  game.runTargetBase = game.playerBase + 1;
  game.subPhase = 'BASE_STEAL';
  setTicker(`⚡ 發動盜壘！衝向${['', '', '二', '三'][game.runTargetBase]}壘！`);
  AudioFX.tone(540, 0.1);
}

function startInteractiveTagUp(spray) {
  game.subPhase = 'BASE_TAGUP';
  game.tagBallCaught = false;
  game.tagThrowTimer = 2.05;
  game.runProgress = 0;
  holdRun = false;
  launchVisualBall(39, 36, spray, 0.95);
  btnSteal.style.display = 'none';
  btnRun.textContent = '🏃 按住衝刺（等接殺起跑）';
  btnRun.style.display = 'block';
  setBanner('高飛犧牲打機會！', '轉頭看球！等外野手「接殺瞬間」再按住衝刺！');
  setTicker('隊友擊出外野高飛球！你在三壘準備 Tag-up！');
}

function updateInteractiveTagUp(dt) {
  if (!game.tagBallCaught) {
    stepPhysics(state.ballPos, state.ballVel, 0.95, dt);
    ballMesh.position.copy(state.ballPos);
    ballMesh.scale.setScalar(THREE.MathUtils.clamp(camera.position.distanceTo(state.ballPos) * 0.025, 1.0, 2.5));
    ballShadow.position.set(state.ballPos.x, 0.07, state.ballPos.z);

    if (holdRun) {
      game.runProgress += 0.65 * dt;
      const cur = new THREE.Vector3().lerpVectors(BASES[3], BASES[0], game.runProgress);
      cur.y = 1.65; camera.position.copy(cur);
      if (game.runProgress > 0.16) {
        btnRun.style.display = 'none'; AudioFX.tone(150, 0.3);
        game.bases[2] = false; game.playerBase = 0;
        setBanner('提早離壘！', '還沒接殺就起跑，遭回傳三壘雙殺！');
        if (!addOuts(2, '高飛球提早離壘！回傳三壘形成雙殺！')) { nextBatter(); enterAfterPause(1.8); }
        updateGameUI(); return;
      }
    }
    lookTarget.lerp(state.ballPos, 0.2); camera.lookAt(lookTarget);
    if (state.ballPos.y <= 1.75 && state.ballVel.y < 0) {
      game.tagBallCaught = true; AudioFX.glovePop(); AudioFX.tone(620, 0.14);
      setBanner('接殺！快衝！', '按住「衝刺 / Space」滑回本壘！');
    }
  } else {
    game.tagThrowTimer -= dt;
    if (holdRun) {
      game.runProgress = Math.min(1, game.runProgress + 0.66 * dt);
      const cur = new THREE.Vector3().lerpVectors(BASES[3], BASES[0], game.runProgress);
      cur.y = 1.65 + Math.sin(performance.now() * 0.024) * 0.09;
      camera.position.copy(cur);
      lookTarget.lerp(new THREE.Vector3(0, 1.2, 0), 0.22); camera.lookAt(lookTarget);
    }
    if (game.runProgress >= 1) {
      btnRun.style.display = 'none'; AudioFX.cheer();
      game.bases[2] = false; game.playerBase = 0; addRuns(1);
      setBanner('SAFE! 得分！', '漂亮的高飛犧牲打！滑回本壘 +1 分');
      if (!addOut('高飛犧牲打成功！你滑回本壘攻下 1 分！')) { nextBatter(); enterAfterPause(1.7); }
      updateGameUI();
    } else if (game.tagThrowTimer <= 0) {
      btnRun.style.display = 'none';
      if (game.runProgress > 0.18) {
        AudioFX.tone(160, 0.28); game.bases[2] = false; game.playerBase = 0;
        setBanner('OUT! 本壘助殺！', '外野雷射肩回傳本壘觸殺出局！');
        if (!addOuts(2, '高飛球接殺＋本壘助殺！形成雙殺！')) { nextBatter(); enterAfterPause(1.8); }
      } else {
        setBanner('穩守三壘', '選擇不冒險，留在三壘');
        if (!addOut('外野高飛球接殺出局！你選擇留在三壘')) { nextBatter(); enterAfterPause(1.4); }
      }
      updateGameUI();
    }
  }
}

function updateSteal(dt) {
  const from = BASES[game.playerBase], to = BASES[game.runTargetBase];
  game.runProgress = Math.min(1, game.runProgress + 0.62 * dt);
  const cur = new THREE.Vector3().lerpVectors(from, to, game.runProgress);
  cur.y = 1.65 + Math.sin(performance.now() * 0.022) * 0.09;
  camera.position.copy(cur);
  lookTarget.lerp(new THREE.Vector3(to.x, 1.3, to.z), 0.2); camera.lookAt(lookTarget);
  if (game.runProgress >= 1) {
    const safe = Math.random() < 0.72;
    if (safe) {
      AudioFX.cheer();
      game.bases[game.playerBase - 1] = false; game.playerBase = game.runTargetBase; game.bases[game.playerBase - 1] = true;
      setBanner('SAFE!', `盜上${['', '', '二', '三'][game.playerBase]}壘成功！`);
      enterAfterPause(1.3);
    } else {
      AudioFX.tone(170, 0.25);
      game.bases[game.playerBase - 1] = false; game.playerBase = 0;
      setBanner('OUT!', '盜壘遭捕手阻殺出局！');
      if (!addOut('盜壘失敗出局！')) enterAfterPause(1.4);
    }
    updateGameUI();
  }
}

function updatePracticeScoreUI() {
  document.getElementById('stat-ok').textContent = state.ok;
  document.getElementById('stat-total').textContent = state.total;
  document.getElementById('stat-streak').textContent = state.streak;
}

function startPracticePitch() {
  resultCard.style.display = 'none'; startWrap.style.display = 'none'; quizControls.style.display = 'none';
  resetFielders(true, 0x1565c0); resetPlayerCF(); batterMesh.visible = true;
  state.meta = generatePlayableBall(state.mode === 'quiz');
  state.phase = 'PITCHING'; state.pitchT = 0; state.flightT = 0; state.quizChoice = null;
  trailPts.length = 0; trailGeo.setFromPoints([]);
  ballMesh.visible = true; ballMesh.position.set(0, 1.85, 18.44);
  ballShadow.visible = false; landingRing.visible = false;
  setBanner('', '投球中...');
}

function launchPracticeBall() {
  const m = state.meta;
  launchVisualBall(m.ev, m.la, m.spray, m.spin);
  AudioFX.crack(THREE.MathUtils.clamp((m.ev - 36) / 12, 0.55, 1.25));
  state.phase = 'IN_FLIGHT';
  if (state.showMarker && state.mode === 'chase') {
    landingRing.position.set(m.land.x, 0.08, m.land.z); landingRing.visible = true;
  }
  setBanner('', state.mode === 'quiz' ? '看球！準備判斷前還是後...' : '');
}

function submitQuiz(choice) {
  if (state.phase !== 'QUIZ_WAIT') return;
  state.quizChoice = choice; quizControls.style.display = 'none';
  setBanner(choice === 'front' ? '你選：往前衝！' : '你選：往後退！', '揭曉真實落點...');
  landingRing.position.set(state.meta.land.x, 0.08, state.meta.land.z); landingRing.visible = true;
  state.phase = 'IN_FLIGHT';
}

function finishPracticePlay(outcome, title, sub, color) {
  state.phase = 'RESULT'; state.total++;
  if (outcome) { state.ok++; state.streak++; } else state.streak = 0;
  updatePracticeScoreUI();
  const m = state.meta;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-title').style.color = color;
  document.getElementById('result-sub').textContent = sub;
  document.getElementById('st-ev').textContent = `${(m.ev * 3.6).toFixed(1)} km/h`;
  document.getElementById('st-la').textContent = `${m.la.toFixed(1)}°`;
  document.getElementById('st-dist').textContent = `${m.dist.toFixed(1)} m`;
  document.getElementById('st-hang').textContent = `${m.hang.toFixed(2)} s`;
  document.getElementById('st-delta').textContent = m.deltaZ < 0
    ? `站位前方 ${Math.abs(m.deltaZ).toFixed(1)} 公尺（往前衝）`
    : `站位後方 ${Math.abs(m.deltaZ).toFixed(1)} 公尺（往後退）`;

  setBanner('', ''); resultCard.style.display = 'block';

function switchMode(newMode) {
  state.mode = newMode; game.active = false; state.phase = 'IDLE';
  hideAllActionUI(); clearLiveRunners();
  resultCard.style.display = 'none'; quizControls.style.display = 'none'; startWrap.style.display = 'block';
  ballMesh.visible = false; ballShadow.visible = false;
  trailPts.length = 0; trailGeo.setFromPoints([]);
  ['mode-game', 'mode-chase', 'mode-quiz'].forEach(id => document.getElementById(id).classList.remove('active'));
  document.getElementById(`mode-${newMode}`).classList.add('active');
  resetFielders(true, 0x1565c0);

  if (newMode === 'game') {
    gameBug.style.display = 'block'; practiceScore.style.display = 'none'; ticker.style.display = 'none';
    document.getElementById('setup-panel').style.display = 'block';

    updateSetupBanner();
    resetPlayerCF(); updateGameUI();
  } else {
    gameBug.style.display = 'none'; practiceScore.style.display = 'flex'; ticker.style.display = 'none';
    document.getElementById('setup-panel').style.display = 'none';
    document.getElementById('btn-start').textContent = '投球（Space）';
    if (newMode === 'chase') { touchControls.style.display = 'block'; setBanner('實戰追接模式', '靠視線與聲音判斷落點，跑位接殺飛球'); }
    else setBanner('這顆飛球，前？後？', '擊球後 1.15 秒瞬間判斷往前衝還是往後退');
    resetPlayerCF();
  }
}
